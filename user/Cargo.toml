[package]
name = "user"
version = "0.1.0"
edition = "2021"
description = "LazyOS ring-3 user runtime and programs"
license = "MIT OR Apache-2.0"

[dependencies]
# The parcel codec, shared with the kernel, so client/server parcels round-trip
# through one implementation (issue #69).
libmessenger = { path = "../libs/messenger" }

[lib]
name = "user"
path = "src/lib.rs"

[[bin]]
name = "hello"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "sh"
path = "src/bin/sh.rs"
test = false
bench = false
