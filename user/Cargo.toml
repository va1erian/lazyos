[package]
name = "user"
version = "0.1.0"
edition = "2021"
description = "LazyOS ring-3 user runtime and programs"
license = "GPL-3.0-or-later"

[lints.cargo]
# `netpolicy`, `usbpolicy` and `sndpolicy` are only referenced by `init` under
# `cfg(lazyos_net)` / `cfg(lazyos_usb)` / `cfg(lazyos_sound)` (the driver uids), so a
# default build looks like it never uses them.
unused_dependencies = "allow"

[dependencies]
# Well-known paths and boot-volume names (docs/filesystem-plan.md F0).
fhs = { path = "../libs/fhs", features = ["alloc"] }
# The parcel codec, shared with the kernel, so client/server parcels round-trip
# through one implementation (issue #69).
libmessenger = { path = "../libs/messenger" }
# Vetted primitives for `keyd` (issue #102): SHA-256/HMAC/HKDF/Argon2id and the
# entropy pool. Kernel tests import the same crate, so host KATs cover the code
# that runs in ring 3.
lazyos-crypto = { path = "../libs/crypto" }
# The configuration-registry store logic (issue #259) and its `midlc`-generated
# `os.lazy.confd.v1` stubs (issue #260): the `confd` service and `confctl` drive
# the same store the kernel test suite exercises.
confd = { path = "../libs/confd" }
# `logd`'s persistent journals under `/logs` (issue #508): the store the kernel
# test suite drives against ext2.
logstore = { path = "../libs/logstore" }
# The account file `/system/etc/passwd`, parsed strictly by `accountsd`
# (issue #508): the same parser the image build checks the file with.
passwd = { path = "../libs/passwd" }
# `init`'s session table (account name and home per session, issue #508).
spin = "0.9"
# Display buffer-slot state machines (issue #361), shared by `xuid` and clients.
surfbuf = { path = "../libs/surfbuf" }
messenger-generated = { path = "../libs/generated" }
# Time-zone and DST resolution for `timed` (issue #369).
timezone = { path = "../libs/timed" }
uitheme = { path = "../libs/uitheme" }
# Modern virtio-PCI transport and the virtio-sound protocol for `sndd`
# (docs/driver-plan.md D5/D6); host-tested `no_std` logic.
virtio = { path = "../libs/virtio" }
virtio-snd = { path = "../libs/virtio-snd" }
# Test-tone synthesis for `sndd`'s self-test and the `beep` client.
pcm = { path = "../libs/pcm" }
# The system mixer's engine and wire layer (`audiod`), and the audio client
# library every player uses (docs/audio-plan.md A1-A4).
audiomix = { path = "../libs/audiomix" }
audioclient = { path = "../libs/audioclient" }
# ProTracker module parser and mixer for the `modplay` client (docs/tracker-plan.md).
modplay = { path = "../libs/modplay" }
# virtio-net for `netdrv` (docs/networking-plan.md N1): the wire definitions, the
# host-tested driver core and the frame ring shared with the stack.
virtio-net = { path = "../libs/virtio-net" }
nicdrv = { path = "../libs/nicdrv" }
# The Intel 8254x (e1000) behind the same engine (issue #497, driver-plan D7).
e1000 = { path = "../libs/e1000" }
# Intel High Definition Audio for `sndd` (issue #497, driver-plan D7).
hda = { path = "../libs/hda" }
# `devd`'s driver manifest (issue #497, driver-plan 3.6).
devmatch = { path = "../libs/devmatch" }
# USB for `usbd` (docs/usb-hid-plan.md U2): xHCI rings and contexts, and the
# descriptor and boot-report parsers for hostile device input.
xhci = { path = "../libs/xhci" }
usbhid = { path = "../libs/usbhid" }
usbmsc = { path = "../libs/usbmsc" }
# The `_net` uid `init` spawns the driver as, shared with the ACL rules.
netpolicy = { path = "../libs/netpolicy" }
usbpolicy = { path = "../libs/usbpolicy" }
sndpolicy = { path = "../libs/sndpolicy" }
# Row layouts and names of the device inspection ops (`devctl`, issue #481).
devinspect = { path = "../libs/devinspect" }
framering = { path = "../libs/framering" }
# The stack `netd` runs: smoltcp over the frame rings, DHCP, the echo path.
netstack = { path = "../libs/netstack" }
ftpwire = { path = "../libs/ftpwire" }
# The user-space filesystem protocol (syscall 35), its serve loop and the
# in-memory tree `memfuse` serves (docs/smb-plan.md F1).
fused = { path = "../libs/fused" }
# Keymaps, modifier/lock state and key repeat for `inputd` (docs/input-plan.md).
inputmap = { path = "../libs/inputmap" }
# The application package manager `pkgd` (docs/packages.md): the `.lzp` reader,
# and the host-tested policy/audit/layout logic built on it.
lazypkg = { path = "../libs/lazypkg" }
pkgstore = { path = "../libs/pkgstore" }
# The hidden-app keys `init` resolves for `ListApps` (issue #509).
deskmenu = { path = "../libs/deskmenu" }

# Build-time only: rasterizes the bundled Droid Sans / Droid Serif into the
# proportional glyph atlases `xuid` draws its chrome text with.
[build-dependencies]
font-atlas = { path = "../font-atlas" }

[lib]
name = "user"
path = "src/lib.rs"

[[bin]]
name = "hello"
path = "src/main.rs"
test = false
bench = false

# Deliberate user-mode faults (issue #7), run from the shell as
# `exec FAULTPRB.ELF <mode>`; always on the image (8.3-safe name).
[[bin]]
name = "faultprobe"
path = "src/bin/faultprobe.rs"
test = false
bench = false

[[bin]]
name = "messengerctl"
path = "src/bin/messengerctl.rs"
test = false
bench = false

[[bin]]
name = "messengerd"
path = "src/bin/messengerd.rs"
test = false
bench = false

# Service supervision and observability (issue #93): `init` is the supervisor
# the kernel boots with `LAZYOS_SERVICES=1`; it starts the others from its
# manifest via the native spawn/wait syscalls. `flaky` crashes once on purpose
# so a boot log proves restart-with-backoff.
[[bin]]
name = "init"
path = "src/bin/init.rs"
test = false
bench = false

[[bin]]
name = "logd"
path = "src/bin/logd.rs"
test = false
bench = false

[[bin]]
name = "healthd"
path = "src/bin/healthd.rs"
test = false
bench = false

[[bin]]
name = "flaky"
path = "src/bin/flaky.rs"
test = false
bench = false

# Accounts and console login (issue #101). `accountsd` owns the user/group
# database and the secret check; `logind` prompts on the console, creates the
# session, and starts the user's shell with kernel-stamped credentials.
[[bin]]
name = "accountsd"
path = "src/bin/accountsd.rs"
test = false
bench = false

[[bin]]
name = "logind"
path = "src/bin/logind.rs"
test = false
bench = false

# `keyd` (issue #102) is the secrets and crypto service: `init` starts it from
# its manifest, and clients reach it through the Messenger client in
# `user/src/messenger/`. The on-disk name is `KEYD.ELF` (8.3, like the other
# services).
[[bin]]
name = "keyd"
path = "src/bin/keyd.rs"
test = false
bench = false

# `confd` (issue #260) is the configuration registry service: it owns the
# `/system/confd` store through `libs/confd` and serves `os.lazy.confd.v1` over
# Messenger. `init` starts it from its manifest, before config consumers, and
# the on-disk name is `CONFD.ELF` (8.3). `confctl` is its shell command line.
[[bin]]
name = "confd"
path = "src/bin/confd.rs"
test = false
bench = false

[[bin]]
name = "confctl"
path = "src/bin/confctl.rs"
test = false
bench = false

# The per-session clipboard service (issue #115): typed MIME offers, lazy
# transfer through an owner `Serialize` callback, a retained changed topic per
# session, and a `history=N` policy. `init` starts it from its manifest; the
# on-disk name is `CLIPD.ELF` (8.3, like the other services).
# The input policy service (docs/input-plan.md): the only holder of the
# `input.raw` capability. `INPUTD.ELF` is the 8.3-safe on-disk name.
[[bin]]
name = "inputd"
path = "src/bin/inputd.rs"
test = false
bench = false

[[bin]]
name = "clipboardd"
path = "src/bin/clipboardd.rs"
test = false
bench = false

# The clipboard demo pair (issue #115): `clipcopy` offers lazily and serves one
# serialize callback, `clippaste` pastes the payload and proves a cross-session
# paste is denied. `clipboardd` spawns both at services boot (`demo=1`) and they
# print the `CLIP:*` evidence markers.
[[bin]]
name = "clipcopy"
path = "src/bin/clipcopy.rs"
test = false
bench = false

# `mimed` (issue #116) is the MIME database and open-with registry behind the
# shell-integration verbs. `init` starts it from its manifest; clients reach it
# through the `mime` module in `user/src/messenger/`. The on-disk name is
# `MIMED.ELF` (8.3, like the other services).
[[bin]]
name = "mimed"
path = "src/bin/mimed.rs"
test = false
bench = false

# `sysmond` (issue #144) is the system monitor: it wraps the native
# system-stats syscall (14) as `os.lazy.system.v1` and republishes retained
# `system/stats/*` topics. `top` is its one-shot native text client. `init`
# starts both from its manifest; the on-disk names are `SYSD.ELF` and
# `TOP.ELF` (8.3, like the other services).
[[bin]]
name = "sysmond"
path = "src/bin/sysmond.rs"
test = false
bench = false

# `devctl` (issue #481): the read-only device inventory, driver class rules
# and refused claims; embedded with the drivers (`build_support/drivers.rs`).
[[bin]]
name = "devctl"
path = "src/bin/devctl.rs"
test = false
bench = false

# `devd` (issue #497): matches the enumerated devices against its driver
# manifest, asks `init` to start each driver, and publishes the devices'
# state; embedded with the drivers (`build_support/drivers.rs`).
[[bin]]
name = "devd"
path = "src/bin/devd.rs"
test = false
bench = false

[[bin]]
name = "timectl"
path = "src/bin/timectl.rs"
test = false
bench = false

# The orderly shutdown/reboot command (docs/shutdown.md): asks `init` to stop
# the machine. On disk as `POWERCTL.ELF`; the shell's `shutdown`, `poweroff`,
# `halt` and `reboot` run it.
[[bin]]
name = "powerctl"
path = "src/bin/powerctl.rs"
test = false
bench = false

[[bin]]
name = "top"
path = "src/bin/top.rs"
test = false
bench = false

# `memfuse` (docs/smb-plan.md F1): an in-memory filesystem served from user
# space at `/mnt/<name>` through syscall 35, the FUSE mechanism's proof.
[[bin]]
name = "memfuse"
path = "src/bin/memfuse.rs"
test = false
bench = false

# The display protocol stack (issue #113). `xuid` is the session compositor:
# it binds the kernel's display device grant, implements `os.lazy.display.v1`
# over Messenger, decorates and routes input to app surfaces. `xdemo` is the
# smallest display client: one surface, a painted pattern, input-driven updates.
# Both are embedded only with `LAZYOS_XUID=1`.
[[bin]]
name = "xuid"
path = "src/bin/xuid.rs"
test = false
bench = false

[[bin]]
name = "clippaste"
path = "src/bin/clippaste.rs"
test = false
bench = false

[[bin]]
name = "xdemo"
path = "src/bin/xdemo.rs"
test = false
bench = false

# The compositor-mediated drag & drop demo pair (issue #145). The kernel boots
# `dragdemo` (no args) as a launcher; it starts a `source` and a `target` child
# of itself, so both display clients share one clipboard session. Embedded only
# with `LAZYOS_XUID=1`; the on-disk name `DRAGDMO.ELF` is 8.3-safe.
[[bin]]
name = "dragdemo"
path = "src/bin/dragdemo.rs"
test = false
bench = false

# The shell-protocol evidence client (issue #167, S5.0): a stand-in for
# LazyShell's display side that creates the desktop surface, subscribes to the
# shell events, and logs the `SHELLPROBE:*:PASS` markers. Embedded with
# `LAZYOS_XUID=1` plus the `LAZYOS_SHELLPROBE=1` demo hook, so the default
# compositor sessions are untouched; the on-disk name `SHELLPRB.ELF` is
# 8.3-safe.
[[bin]]
name = "shellprobe"
path = "src/bin/shellprobe.rs"
test = false
bench = false

# Async API examples (issue #91). Not wired into the demo image yet: the root
# build script would need a `CARGO_BIN_FILE_USER_*` hook and a kernel spawn
# line, which is a one-line follow-up noted in the PR.
[[bin]]
name = "async_echo"
path = "src/bin/async_echo.rs"
test = false
bench = false

[[bin]]
name = "async_service"
path = "src/bin/async_service.rs"
test = false
bench = false

# The virtio-sound userspace driver (docs/driver-plan.md D6). It claims the
# device through syscall 23, drives it through `libs/virtio`, and serves
# `os.lazy.audio.v1`. Embedded with `LAZYOS_SOUND=1`; the on-disk name is
# `SNDD.ELF` (8.3, like the other services).
[[bin]]
name = "sndd"
path = "src/bin/sndd.rs"
test = false
bench = false

# The system mixer (docs/audio-plan.md A3): serves `os.lazy.audio.v1` and
# `os.lazy.audio.mixer.v1` under `os.lazy.audio`, mixes every client stream and
# feeds the card's one stream. Embedded with the sound stack as `/system/bin/audiod`.
[[bin]]
name = "audiod"
path = "src/bin/audiod.rs"
test = false
bench = false

# `mixer` (docs/audio-plan.md A5): the volume control panel from the shell,
# and the control-interface probe of the boot evidence. `/system/bin/mixer`.
[[bin]]
name = "mixer"
path = "src/bin/mixer.rs"
test = false
bench = false

# The USB HID driver (docs/usb-hid-plan.md U2): xHCI, boot keyboards and mice,
# published onto the raw input bus. Embedded as `USBD.ELF`.
[[bin]]
name = "usbd"
path = "src/bin/usbd.rs"
test = false
bench = false

# The NIC userspace driver (docs/networking-plan.md N1): virtio-net through
# `libs/virtio`, or an Intel 8254x through `libs/e1000` (issue #497), both
# under the `libs/nicdrv` engine. It claims the device through syscall 23 and
# serves `os.lazy.net.nic.v1`. Embedded with `LAZYOS_NET=1`.
[[bin]]
name = "netdrv"
path = "src/bin/netdrv.rs"
test = false
bench = false

# `nicctl` prints the card's MAC, link and counters, and carries the driver's
# evidence clients (`arp`, `probe=1`, `soak=<n>`); `NICCTL.ELF` on the image.
[[bin]]
name = "nicctl"
path = "src/bin/nicctl.rs"
test = false
bench = false

# The network stack service (docs/networking-plan.md N2): smoltcp over the NIC
# driver's frame rings, serving `os.lazy.net.stack.v1`, with no capabilities.
# Embedded with `LAZYOS_NETD=1`; the on-disk name is `NETD.ELF` (8.3).
[[bin]]
name = "netd"
path = "src/bin/netd.rs"
test = false
bench = false

# `netctl` shows and controls the stack and carries `netd`'s evidence clients
# (`probe=1`, `soak=<n>`); `ping` sends ICMP echo through it. `NETCTL.ELF` and
# `PING.ELF` on the image.
[[bin]]
name = "netctl"
path = "src/bin/netctl.rs"
test = false
bench = false

[[bin]]
name = "ping"
path = "src/bin/ping.rs"
test = false
bench = false

# Stage N3: `nc` (TCP and UDP clients and a one-connection listener over
# `os.lazy.net.socket.v1`) and `nslookup` (`Resolve`). `NC.ELF` and
# `NSLOOKUP.ELF` on the image.
[[bin]]
name = "nc"
path = "src/bin/nc.rs"
test = false
bench = false

# Bulk TCP throughput over `os.lazy.net.socket.v1` (docs/performance-plan.md
# P4), run by `tools/net/bulk.py`.
[[bin]]
name = "netbulk"
path = "src/bin/netbulk.rs"
test = false
bench = false

# The cross-process Messenger benchmark (docs/performance-plan.md P6),
# run by `tools/perf/run.py` through the kernel in `LAZYOS_PERF=1` images.
[[bin]]
name = "msgbench"
path = "src/bin/msgbench.rs"
test = false
bench = false

[[bin]]
name = "nslookup"
path = "src/bin/nslookup.rs"
test = false
bench = false

# Stage N4: a passive-mode FTP client over `os.lazy.net.socket.v1`.
# `FTP.ELF` on the image.
[[bin]]
name = "ftp"
path = "src/bin/ftp.rs"
test = false
bench = false

# `ftpfuse` (docs/smb-plan.md): an FTP server mounted at `/mnt/<name>` through
# the FUSE mechanism, a proof of concept of a network filesystem daemon.
[[bin]]
name = "ftpfuse"
path = "src/bin/ftpfuse.rs"
test = false
bench = false

# `beep` (docs/driver-plan.md D6) is the smallest `os.lazy.audio.v1` client: it
# plays a sine tone through the mixer. `audiod` spawns it under `demo=1`; the
# on-disk name is `BEEP.ELF`.
[[bin]]
name = "beep"
path = "src/bin/beep.rs"
test = false
bench = false

# `modplay` (docs/tracker-plan.md) plays ProTracker modules through the mixer: the
# audio stack's showcase client. On-disk name `MODPLAY.ELF`.
[[bin]]
name = "modplay"
path = "src/bin/modplay.rs"

# `pkgd` (docs/packages.md phase 3) is the application package manager: it
# extracts `.lzp` packages under `/data/apps`, records them in `confd`,
# registers their file types with `mimed` and loads their Messenger policy.
# `init` starts it from its manifest; the on-disk name is `PKGD.ELF` (8.3).
# `pkgctl` is its command line (`PKGCTL.ELF`).
[[bin]]
name = "pkgd"
path = "src/bin/pkgd.rs"
test = false
bench = false

[[bin]]
name = "pkgctl"
path = "src/bin/pkgctl.rs"
test = false
bench = false
