[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
description = "LazyOS kernel (freestanding, x86_64)"
license = "GPL-3.0-or-later"

[lints.cargo]
# lazyos-crypto is only referenced from kernel/src/tests/crypto_suite.rs, which compiles
# under cfg(lazyos_tests) (issue #62); a default (non-test) build looks
# unused to this lint, which doesn't know about that cfg.
unused_dependencies = "allow"

[dependencies]
# Well-known paths and boot-volume names (docs/filesystem-plan.md F0).
fhs = { path = "../libs/fhs" }
# The ext2 driver, shared with the host image build (docs/filesystem-plan.md F2);
# fs/ext2/fsimpl.rs adapts it to the VFS.
ext2fs = { path = "../libs/ext2fs" }
bootloader_api = "0.11.17"
# Issue #102: the in-kernel suite runs the crypto wrapper's round-trip and
# SHARE_ONLY key-isolation checks against the same crate `keyd` links.
lazyos-crypto = { path = "../libs/crypto" }
# Issue #260: the in-kernel suite drives the same `confd` service core the
# userspace `confd` binary links, against an in-memory `StoreFs`.
confd = { path = "../libs/confd" }
# Issue #508: the in-kernel suite drives `logd`'s journal store against ext2.
logstore = { path = "../libs/logstore" }
# Issue #508: the in-kernel suite drives `pkgd`'s install trees and audit log
# (`pkgstore::tree`, `pkgstore::audit`) against ext2.
pkgstore = { path = "../libs/pkgstore" }
# Issue #369: the in-kernel suite drives the zone/DST resolution `timed` links.
timezone = { path = "../libs/timed" }
# Issue #361: the in-kernel suite drives the display buffer-slot state machines
# `xuid` and its clients link, including a present/release soak.
surfbuf = { path = "../libs/surfbuf" }
# Issues #299/#300: the topic ACL scope ids, the `authorize_topic` request layout
# and the registry wire come from `midlc`-generated interfaces (`idl/*.midl`),
# not hand-computed hashes or field ids.
messenger-generated = { path = "../libs/generated" }
# Each driver's device-class rules (issue #481): `dev::policy` installs them at
# boot, and the in-kernel suite checks what they decide.
netpolicy = { path = "../libs/netpolicy" }
usbpolicy = { path = "../libs/usbpolicy" }
sndpolicy = { path = "../libs/sndpolicy" }
libm = "0.2"
libmessenger = { path = "../libs/messenger" }
linked_list_allocator = "0.10"
spin = "0.9"
tiny-skia = { version = "0.12", default-features = false, features = ["no-std-float"] }
uart_16550 = "0.3"
x86_64 = "0.15"
xmas-elf = "0.10"

[build-dependencies]
font-atlas = { path = "../font-atlas" }

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false
