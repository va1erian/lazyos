[package]
name = "lazyos"
version = "0.1.0"
edition = "2021"
description = "A small single-tasking x86_64 OS with a bitmap-font console"
license = "GPL-3.0-or-later"

[workspace]
members = [
    "kernel",
    "font-atlas",
    "user",
    "libs/messenger",
    "libs/generated",
    # Vetted cryptography shared by `keyd` and the kernel test suite (#102):
    # no_std for the freestanding targets plus host `cargo test` known-answer
    # vectors.
    "libs/crypto",
    # Configuration registry store (issue #259): pure `no_std` + `alloc`
    # logic shared by the `confd` service and host tests, with no Messenger or
    # syscall dependencies.
    "libs/confd",
    # logd's persistent journals (issue #508): source naming, the line format,
    # rotation and the /logs budget, shared by `logd` and the kernel suite.
    "libs/logstore",
    # The account file /system/etc/passwd (issue #508): strict, fail-closed
    # parsing shared by `accountsd` and the image build, host-tested.
    "libs/passwd",
    # Fuzz entry point for the accounts/keyd wire decoders (issue #626).
    "libs/accountwire",
    # Buffer-slot state machines for the pipelined display present (#361).
    "libs/surfbuf",
    # The slab and frame allocators' bookkeeping (issue #485): size classes,
    # the intrusive slab free list, refcount rules and the frame free chain,
    # host-tested and run under Miri (.github/workflows/miri.yml).
    "libs/membook",
    # Time-zone and DST resolution for the `timed` service (issue #369): pure
    # `no_std` logic with host tests.
    "libs/timed",
    # Desktop theme schema + palette resolution shared by xuid and Settings.
    "libs/uitheme",
    # Desktop context-menu schema (sys/ui/menu) shared by xuid and Settings.
    "libs/deskmenu",
    # Modern virtio-PCI transport + split virtqueues, and the virtio-sound
    # protocol, for userspace drivers (docs/driver-plan.md D5/D6). Pure `no_std`
    # logic with host tests.
    "libs/virtio",
    "libs/virtio-snd",
    # PCM sample helpers (test-tone synthesis) shared by `sndd` and its clients.
    "libs/pcm",
    # The system mixer's engine (`audiod`, docs/audio-plan.md A1) and the
    # audio client library (A4): pure `no_std` logic with host tests.
    "libs/audiomix",
    "libs/audioclient",
    # ProTracker .mod parser and fixed-point player (docs/tracker-plan.md).
    "libs/modplay",
    # Keymaps, modifier/lock state, repeat and hotkey matching for `inputd`
    # (docs/input-plan.md): pure `no_std` logic with host tests.
    "libs/inputmap",
    # USB descriptors and HID boot reports for `usbd` (docs/usb-hid-plan.md
    # U0): pure `no_std` parsers of hostile device input, with host tests.
    "libs/usbhid",
    # xHCI registers, TRBs, contexts and ring state machines for `usbd`
    # (docs/usb-hid-plan.md U0): pure `no_std` logic with host tests.
    "libs/xhci",
    # ACPI tables (RSDP, XSDT/RSDT, FADT, MADT, HPET) for the kernel's timer
    # and power code (docs/real-pc-boot-plan.md H2): a pure `no_std` walker of
    # hostile firmware tables, with golden QEMU dumps and seeded fuzz.
    "libs/acpi",
    # USB Mass Storage Bulk-Only Transport and SCSI for `usbd`
    # (docs/architecture/usb-storage.md): pure `no_std` logic with host tests
    # against a model device and fuzz entry points.
    "libs/usbmsc",
    # NVMe controller bring-up, queues, PRP planning and Identify parsing for
    # the kernel's NVMe driver (docs/nvme-install-plan.md N1): pure `no_std`
    # logic with host tests against a model controller and seeded fuzz.
    "libs/nvme",
    # Networking libraries (docs/networking-plan.md N0): the shared frame ring,
    # the virtio-net wire definitions, and the seeded-input helper the in-tree
    # fuzz-style tests use. Pure `no_std` logic (fuzzkit is host only).
    "libs/framering",
    "libs/virtio-net",
    "libs/nicdrv",
    # The Intel 8254x NIC behind the same engine (issue #497, driver-plan D7).
    "libs/e1000",
    # Intel High Definition Audio behind sndd (issue #497, driver-plan D7).
    "libs/hda",
    # devd's static driver manifest (issue #497, driver-plan 3.6).
    "libs/devmatch",
    "libs/ftpwire",
    # Printing (docs/printing-plan.md P1/P2): IPP messages and the PWG Raster
    # encoder, pure `no_std` + `alloc` with host tests and fuzz entry points.
    "libs/ipp",
    "libs/raster",
    # The user-space filesystem (FUSE) provider protocol of syscall 35, the
    # daemon serve loop and the in-memory tree (docs/smb-plan.md F1), shared
    # by the kernel's `fs/fuse` backend and the daemons. Pure `no_std` + alloc.
    "libs/fused",
    "libs/netpolicy",
    "libs/usbpolicy",
    "libs/sndpolicy",
    # init's supervision decisions (restart, backoff, giving up, the desktop's
    # app-failure notice; issue #549): pure `no_std` + `alloc`, host-tested.
    "libs/svcpolicy",
    "libs/devinspect",
    "libs/netstack",
    "libs/fuzzkit",
    # Application package (`.lzp`) reader (docs/packages.md): pure `no_std` +
    # `alloc` zip/manifest parsing and validation shared by the installer and
    # host tests.
    "libs/lazypkg",
    # The pure logic of the package manager `pkgd` (docs/packages.md phase 3):
    # policy compilation, the permission explanation table, the audit chain
    # and install paths, host-tested.
    "libs/pkgstore",
    # Every well-known path and boot-volume file name, defined once
    # (docs/filesystem-plan.md F0); `tools/fhs/check_literals.py` guards it.
    "libs/fhs",
    # The ext2 driver, formatter and image populator (docs/filesystem-plan.md F2):
    # `no_std` + `alloc` over a `BlockIo` seam, shared by the kernel and the host
    # image build, with host tests, a soak and a fuzz entry point.
    "libs/ext2fs",
    # Host tests of the image build (`build_support/os_*.rs`, docs_embed): the
    # layout table, the manifest diff, the 64 MiB guard and create-vs-update.
    "build_support/tests",
]
# The xui app is an ordinary static-musl `std` program with its own workspace:
# it is built by `tools/xui/build.py` and embedded in the image, never by the
# OS workspace's `cargo build`. `rhai-host` (the `rhai` command, issue #319)
# is the same shape, built by `tools/rhai/build.py`; `libs/rhai-lazy` is its
# host-testable bindings crate and must not pull Rhai into the OS workspace.
# `fuzz` holds the cargo-fuzz targets (libFuzzer, Linux CI only).
# `lazyrad-os` is the same shape, built by `tools/lazyrad/build.py`.
exclude = ["xui-app", "rhai-host", "nettls", "libs/rhai-lazy", "fuzz", "lazyrad-os"]
resolver = "2"

[build-dependencies]
# The kernel is built for the bare-metal target and handed to the bootloader
# image builder (artifact dependencies; see .cargo/config.toml `bindeps`).
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
# The user program is built as a static ELF and added to the disk image.
user = { path = "user", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "0.11.17"
# The OS volume is formatted and updated with the same ext2 code the kernel
# reads it with (docs/filesystem-plan.md F2). `check` lets an update re-certify
# a volume that stopped uncleanly (`Ext2::recover`).
ext2fs = { path = "libs/ext2fs", features = ["check"] }
# The USB stick image's FAT volumes (`build_support/usb_*.rs`); the same
# version and features `bootloader` already pulls in.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
# Every destination the build writes names its `libs/fhs` constant
# (docs/filesystem-plan.md F3).
fhs = { path = "libs/fhs", features = ["alloc"] }
# The image's `/system/etc/passwd` is checked with the parser `accountsd`
# loads it with, so a file the daemon would refuse never ships (issue #508).
passwd = { path = "libs/passwd" }
# `/system/etc/shadow`'s Argon2id verifiers are derived at build time with the
# code and cost `keyd` verifies them with (issue #447).
lazyos-crypto = { path = "libs/crypto" }
# The TLS trust anchors written to `/system/etc/ssl/certs/ca-certificates.crt`
# (docs/tls-plan.md §5.2): Mozilla's root program (CCADB), pinned exactly so
# the root set changes only with a deliberate bump.
webpki-root-certs = "=1.0.9"

[profile.dev]
panic = "abort"
opt-level = 2

# Optimise dependencies (tiny-skia etc.) even in dev builds: unoptimised
# rendering is orders of magnitude too slow for interactive use.
[profile.dev.package."*"]
opt-level = 3

# The kernel and user programs are artifact build-dependencies of this crate,
# so Cargo builds them, and the workspace libraries they link (ext2fs,
# libmessenger, ...), with the `build-override` profile, which would otherwise
# be opt-level 0 whatever `[profile.dev]` says. Unoptimised, `Vec<u8>` drop
# and `resize` loop per byte and kernel stack frames run to 15 KiB.
[profile.dev.build-override]
opt-level = 2

# User programs are embedded in the disk image, so keep them small and stripped
# (a large ELF makes boot-time ATA reads painfully slow in QEMU).
[profile.dev.package.user]
debug = false
strip = "symbols"
opt-level = "s"

# The full kernel ELF (with line tables) stays in `target/` for panic triage;
# build.rs embeds only its loadable part in the disk image, because the
# bootloader reads the whole file over slow BIOS disk calls at every boot.
[profile.dev.package.kernel]
debug = "line-tables-only"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "debuginfo"

# The same artifact-dependency rule as `[profile.dev.build-override]`: without
# it a release image's kernel and user programs are built at opt-level 0, and
# the boot console's full-screen repaints take ~150 ms a frame at 2560x1440.
[profile.release.build-override]
opt-level = 3

