[package]
name = "smbwire"
version = "0.1.0"
edition = "2021"
publish = false
description = "The SMB 2.1 client protocol (docs/smb-plan.md F2): framing, SMB2 messages, NTLMv2 inside SPNEGO, HMAC-SHA256 signing and a synchronous client over a byte transport. Pure no_std + alloc"
license = "GPL-3.0-or-later"

[lib]
name = "smbwire"
path = "src/lib.rs"

[features]
# Expose `fuzz::run`, shared by the in-tree seeded tests and the cargo-fuzz
# target (`fuzz/fuzz_targets/smbwire.rs`).
fuzz = []

# RustCrypto primitives (pure Rust, `no_std`, MIT OR Apache-2.0: GPLv2
# compatible under the MIT choice). `sha2` uses the `force-soft` backend for
# the same reason as `libs/crypto`: the x86 SIMD dispatch trips the pinned
# nightly's LLVM on `x86_64-unknown-none`.
[dependencies]
hmac = { version = "=0.12.1", default-features = false }
md4 = { version = "=0.10.2", default-features = false }
md-5 = { version = "=0.10.6", default-features = false, features = ["force-soft"] }
sha2 = { version = "=0.10.8", default-features = false, features = ["force-soft"] }

[dev-dependencies]
fuzzkit = { path = "../fuzzkit" }
