[package]
name = "bthid"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bluetooth HIDP message framing and input report decoding for the LazyOS btd service"
license = "GPL-3.0-or-later"

[lib]
name = "bthid"
path = "src/lib.rs"

[features]
# Expose `fuzz::run`, the byte-script entry point shared by the in-tree seeded
# tests and the cargo-fuzz target (`fuzz/fuzz_targets/bthid.rs`). Needs `std`.
fuzz = []

[dependencies]
usbhid = { path = "../usbhid" }

[dev-dependencies]
fuzzkit = { path = "../fuzzkit" }
