[package]
name = "accountwire"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fuzz entry point for the Messenger wire decoding of the account and key services (accountsd, keyd): untrusted request bytes in, no panic out (issue #626)"
license = "GPL-3.0-or-later"

[lib]
name = "accountwire"
path = "src/lib.rs"

[features]
# Kept for symmetry with the other fuzzed libraries: the cargo-fuzz crate
# enables it. The entry point itself is always built (the crate is host-only).
fuzz = []

[dependencies]
# The parcel envelope every request arrives in.
libmessenger = { path = "../messenger" }
# The `midlc`-generated decoders accountsd and keyd call on a request body.
messenger-generated = { path = "../generated" }

[dev-dependencies]
fuzzkit = { path = "../fuzzkit" }
