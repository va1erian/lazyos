[package]
name = "rhai-lazy"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "LazyOS bindings for the Rhai scripting engine: the os and msg modules, engine limits and REPL logic (issue #319)"

# A standalone workspace, like `xui-app`: the OS workspace (`x86_64-unknown-none`)
# must not resolve Rhai. `rhai-host` (the static-musl program) depends on this
# crate by path; `cargo test` here runs the bindings on the host against a mock.
[workspace]
resolver = "2"

[features]
default = ["std"]
std = ["rhai/std"]
# Forwards to Rhai's own `no_std` mode so the bindings can later be linked into
# a native `x86_64-unknown-none` host. Off for the musl `std` host.
no_std = ["rhai/no_std"]
# The real Messenger transport (`msg::gate`): the native `int 0x80` gate a
# static-musl or native LazyOS program reaches the fabric through, issued by
# `lazyos-sys`. Off for host tests, which run the `msg` module against an
# in-memory fabric.
lazyos = ["dep:lazyos-sys"]

[dependencies]
# Pinned exactly (supply chain): a Rhai bump is a reviewed change to this line
# and the two lock files. Feature set (see docs/architecture/userland.md):
# only the default `std`; `sync` stays off (user processes are single-threaded,
# so `Rc` closures are smaller and faster), and no `no_*` language feature is
# removed because later steps (modules, closures, custom syntax) need them.
#
# Rhai's own default also enables `ahash/runtime-rng`; it is left off, so map
# hashing uses ahash's fixed keys and no `getrandom` is needed at startup.
rhai = { version = "=1.26.1", default-features = false }
# The parcel codec shared with the kernel and every service (`no_std` + `alloc`).
# The `msg` module builds bodies from the generated schema with it, so it never
# hand-writes a wire format.
libmessenger = { path = "../messenger" }
# The compiled registry stubs, for the gate's `Resolve` request and name-table
# `List` reply, and the standard reply error field every service answers with.
# The tests also cross-check the schema-driven codec against the compiled
# codecs: what one encodes, the other must decode.
messenger-generated = { path = "../generated" }
# Every native syscall, shared with the native runtime and the xui apps
# (issue #666): the gate's Messenger ops and the registry helpers.
lazyos-sys = { path = "../lazyos-sys", features = ["parcel"], optional = true }
