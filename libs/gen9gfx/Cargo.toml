[package]
name = "gen9gfx"
version = "0.1.0"
edition = "2021"
publish = false
description = "Intel Gen9 (Skylake to Coffee Lake) display and HDMI audio logic, host testable: EDID, ELD, VBT parsing, HDMI N/CTS, register map and the Mmio accessor trait"
license = "GPL-3.0-or-later"

[lib]
name = "gen9gfx"
path = "src/lib.rs"

[features]
# Expose `fuzz::run` and the fixture builders (`build`), the byte entry point
# shared by the in-tree seeded tests and the cargo-fuzz target
# (`fuzz/fuzz_targets/gen9gfx.rs`). Needs `std`.
fuzz = []

[dev-dependencies]
fuzzkit = { path = "../fuzzkit" }
# The offsets `adopt` reads must all be ones `dbgd` may read too.
pciprobe = { path = "../pciprobe" }
