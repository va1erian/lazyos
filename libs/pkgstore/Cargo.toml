[package]
name = "pkgstore"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure logic of the LazyOS package manager pkgd: policy compilation, the permission explanation table, the hash-chained audit log, and install paths"
license = "GPL-3.0-or-later"

[lib]
name = "pkgstore"
path = "src/lib.rs"

[dependencies]
# Where installed apps, the audit log and home directories live.
fhs = { path = "../fhs" }
# The validated manifest the rules and explanations are derived from.
lazypkg = { path = "../lazypkg" }
# SHA-256 for the audit chain, hex for the log lines.
lazyos-crypto = { path = "../crypto" }
# The generated `os.lazy.pkgd.v1` records (`PkgEvent`, `Permission`) and the
# kernel policy rule type: the wire shapes are never re-declared here.
messenger-generated = { path = "../generated" }

[dev-dependencies]
# The install/upgrade/remove soak runs `tree` on a real ext2 volume (`memio`)
# and judges it with the library's independent checker (`check::fsck`).
ext2fs = { path = "../ext2fs", features = ["fuzz"] }
# The provisioning tests write real `.lzp` archives (`tests/provisioning/lzp.rs`).
crc = { version = "3", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
