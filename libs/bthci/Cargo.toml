[package]
name = "bthci"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bluetooth HCI command, event and ACL codecs, command and ACL flow control, and the controller init sequence for the LazyOS btd service"
license = "GPL-3.0-or-later"

[lib]
name = "bthci"
path = "src/lib.rs"

[features]
# Expose `fuzz::run`, the byte-script entry point shared by the in-tree seeded
# tests and the cargo-fuzz target (`fuzz/fuzz_targets/bthci.rs`). Needs `std`.
fuzz = []

[dev-dependencies]
fuzzkit = { path = "../fuzzkit" }
