# Manifest and version cases shared by the two validators, so they cannot drift:
#
#   Rust    libs/lazypkg/tests/cases.rs     (lazypkg::parse_manifest, lazypkg::Version)
#   Python  tools/pkg/test_build.py         (pkgmanifest.validate_manifest, pkgmanifest.Version)
#
# Each [[manifest]] case is spliced into this template (both runners build the
# same text):
#
#   [app]
#   name = "Demo"
#   system_name = "org.lazy.demo"
#   author = "Tester"
#   version = "<version, default 1.0.0>"
#   <app>
#   [entry]
#   binary = "bin/app.elf"
#   <entry>
#   [permissions]
#   <permissions>
#   <processes>
#
# `valid = true` cases may say what `category`, `autostart`, `resident` and
# `develop` read back as, and `children` (the names of the `[processes.<name>]`
# tables, sorted).
# `valid = false` cases name a substring (`error`) that one of the reported
# problems must contain on both sides; pick one both wordings share.

# --- [app] category -----------------------------------------------------------

[[manifest]]
name = "category is optional and defaults to accessories"
valid = true
category = "accessories"
autostart = false

[[manifest]]
name = "every category is accepted"
app = 'category = "accessories"'
valid = true
category = "accessories"

[[manifest]]
name = "development"
app = 'category = "development"'
valid = true
category = "development"

[[manifest]]
name = "games"
app = 'category = "games"'
valid = true
category = "games"

[[manifest]]
name = "graphics"
app = 'category = "graphics"'
valid = true
category = "graphics"

[[manifest]]
name = "internet"
app = 'category = "internet"'
valid = true
category = "internet"

[[manifest]]
name = "office"
app = 'category = "office"'
valid = true
category = "office"

[[manifest]]
name = "system"
app = 'category = "system"'
valid = true
category = "system"

[[manifest]]
name = "utilities"
app = 'category = "utilities"'
valid = true
category = "utilities"

[[manifest]]
name = "an unknown category is an error"
app = 'category = "toys"'
valid = false
error = "app.category"

[[manifest]]
name = "categories are lowercase"
app = 'category = "Graphics"'
valid = false
error = "app.category"

[[manifest]]
name = "an empty category is an error"
app = 'category = ""'
valid = false
error = "app.category"

# --- [entry] autostart --------------------------------------------------------

[[manifest]]
name = "autostart true"
entry = "autostart = true"
valid = true
autostart = true

[[manifest]]
name = "autostart false"
entry = "autostart = false"
valid = true
autostart = false

[[manifest]]
name = "autostart must be a boolean"
entry = 'autostart = "yes"'
valid = false
error = "autostart"

[[manifest]]
name = "autostart belongs in [entry], not [app]"
app = "autostart = true"
valid = false
error = "autostart"

# --- [entry] resident ---------------------------------------------------------

[[manifest]]
name = "resident is optional and defaults to false"
valid = true
resident = false

[[manifest]]
name = "resident true, with autostart"
entry = "autostart = true\nresident = true"
valid = true
autostart = true
resident = true

[[manifest]]
name = "resident must be a boolean"
entry = 'resident = "yes"'
valid = false
error = "resident"

[[manifest]]
name = "resident belongs in [entry], not [permissions]"
permissions = "resident = true"
valid = false
error = "resident"

[[manifest]]
name = "an unknown field is still an error"
entry = "autorun = true"
valid = false
error = "autorun"

# --- [permissions] develop ----------------------------------------------------

[[manifest]]
name = "develop true"
permissions = "develop = true"
valid = true
develop = true

[[manifest]]
name = "develop defaults to false"
permissions = 'interfaces = ["os.lazy.display.v1"]'
valid = true
develop = false

[[manifest]]
name = "develop must be a boolean"
permissions = 'develop = "yes"'
valid = false
error = "develop"

# --- [permissions] topics -----------------------------------------------------

[[manifest]]
name = "dots inside a topic segment are fine"
permissions = 'topics = ["publish:app/org.lazy.demo/x.y", "subscribe:app/org.lazy.demo/#"]'
valid = true

[[manifest]]
name = "a .. topic segment is refused"
permissions = 'topics = ["publish:app/../system/x"]'
valid = false
error = "is not a publish:/subscribe: pattern"

[[manifest]]
name = "a . topic segment is refused"
permissions = 'topics = ["subscribe:app/./#"]'
valid = false
error = "is not a publish:/subscribe: pattern"

[[manifest]]
name = "a segment of only dots is refused"
permissions = 'topics = ["publish:app/.../x"]'
valid = false
error = "is not a publish:/subscribe: pattern"

[[manifest]]
name = "develop belongs in [permissions], not [entry]"
entry = "develop = true"
valid = false
error = "develop"

# --- [permissions] files ------------------------------------------------------

[[manifest]]
name = "an absolute rule"
permissions = 'files = ["read:/data/apps/org.lazy.demo/data"]'
valid = true

[[manifest]]
name = "$HOME as the first segment"
permissions = 'files = ["read:$HOME/Documents/*", "write:$HOME/.apps/org.lazy.demo/data"]'
valid = true

[[manifest]]
name = "an absolute home path points at $HOME"
permissions = 'files = ["read:/home/*/pictures"]'
valid = false
error = "write it as $HOME/"

[[manifest]]
name = "the legacy data volume's home points at $HOME too"
permissions = 'files = ["write:/data/home/*/.apps/org.lazy.demo"]'
valid = false
error = "write it as $HOME/"

[[manifest]]
name = "the app's own folder in the user's home"
permissions = 'files = ["read:$HOME/.apps/org.lazy.demo", "write:$HOME/.apps/org.lazy.demo"]'
valid = true

[[manifest]]
name = "$HOME alone names no path"
permissions = 'files = ["read:$HOME"]'
valid = false
error = "is not a read:/write: absolute or $HOME/ path"

[[manifest]]
name = "$HOME with a trailing slash only"
permissions = 'files = ["read:$HOME/"]'
valid = false
error = "is not a read:/write: absolute or $HOME/ path"

[[manifest]]
name = "$HOME glued to a name is not $HOME"
permissions = 'files = ["read:$HOMEDIR/x"]'
valid = false
error = "is not a read:/write: absolute or $HOME/ path"

[[manifest]]
name = "$HOME after the first segment"
permissions = 'files = ["read:/data/$HOME/x"]'
valid = false
error = "may use $HOME only as its first segment"

[[manifest]]
name = "$HOME twice"
permissions = 'files = ["write:$HOME/$HOME/x"]'
valid = false
error = "may use $HOME only as its first segment"

[[manifest]]
name = "$HOME as a later segment's prefix"
permissions = 'files = ["write:$HOME/a/$HOMEx"]'
valid = false
error = "may use $HOME only as its first segment"

[[manifest]]
name = "no dot-dot under $HOME"
permissions = 'files = ["read:$HOME/../etc"]'
valid = false
error = "permissions.files"

[[manifest]]
name = "a relative path is an error"
permissions = 'files = ["read:Documents"]'
valid = false
error = "permissions.files"

[[manifest]]
name = "an unknown verb is an error"
permissions = 'files = ["exec:$HOME/bin"]'
valid = false
error = "permissions.files"

# --- [processes.<name>] -------------------------------------------------------
# The child labels of issue #832: each table may hold a subset of the app's own
# permissions and nothing more.

[[manifest]]
name = "no process tables"
valid = true
children = []

[[manifest]]
name = "a child that asks for nothing"
permissions = 'interfaces = ["os.lazy.display.v1"]'
processes = '''
[processes.webprocess]
program = "/system/bin/webprocess"
'''
valid = true
children = ["webprocess"]

[[manifest]]
name = "a child holding a subset of the app's permissions"
permissions = '''
interfaces = ["os.lazy.display.v1", "os.lazy.input.v1"]
network = ["outbound"]
files = ["read:/system/share/fonts", "write:$HOME/.apps/org.lazy.demo"]
'''
processes = '''
[processes.webprocess]
program = "/system/bin/webprocess"
files = ["read:/system/share/fonts/liberation"]

[processes.networkprocess]
program = "/system/bin/networkprocess"
interfaces = ["os.lazy.input.v1"]
network = ["outbound"]
files = ["write:$HOME/.apps/org.lazy.demo/cookies", "read:/system/share/fonts"]
'''
valid = true
children = ["networkprocess", "webprocess"]

[[manifest]]
name = "a child asks for an interface the app lacks"
permissions = 'interfaces = ["os.lazy.display.v1"]'
processes = '''
[processes.web]
program = "/system/bin/web"
interfaces = ["os.lazy.clipboard.v1"]
'''
valid = false
error = "is not in the app's permissions.interfaces"

[[manifest]]
name = "a child asks for the network the app lacks"
processes = '''
[processes.web]
program = "/system/bin/web"
network = ["outbound"]
'''
valid = false
error = "does not hold"

[[manifest]]
name = "a child asks for a file the app lacks"
permissions = 'files = ["read:/system/share/fonts"]'
processes = '''
[processes.web]
program = "/system/bin/web"
files = ["read:$HOME/.ssh"]
'''
valid = false
error = "is not covered by a permissions.files rule"

[[manifest]]
name = "a child asks to write where the app may only read"
permissions = 'files = ["read:/system/share/fonts"]'
processes = '''
[processes.web]
program = "/system/bin/web"
files = ["write:/system/share/fonts"]
'''
valid = false
error = "is not covered by a permissions.files rule"

[[manifest]]
name = "a child asks for the whole of a directory the app holds one file of"
permissions = 'files = ["read:/system/share/fonts/a.ttf"]'
processes = '''
[processes.web]
program = "/system/bin/web"
files = ["read:/system/share/fonts"]
'''
valid = false
error = "is not covered by a permissions.files rule"

[[manifest]]
name = "a child's files rule has the files grammar"
processes = '''
[processes.web]
program = "/system/bin/web"
files = ["read:$HOME"]
'''
valid = false
error = "processes.web.files entry"

[[manifest]]
name = "a process name is a label part"
processes = '''
[processes.Web]
program = "/system/bin/web"
'''
valid = false
error = "processes name"

[[manifest]]
name = "a process name has no slash"
processes = '''
[processes."a/b"]
program = "/system/bin/web"
'''
valid = false
error = "processes name"

[[manifest]]
name = "a program is an absolute path"
processes = '''
[processes.web]
program = "bin/web"
'''
valid = false
error = "must be an absolute path"

[[manifest]]
name = "a program has no dot-dot"
processes = '''
[processes.web]
program = "/system/bin/../bin/web"
'''
valid = false
error = "must be an absolute path"

[[manifest]]
name = "two processes cannot share a program"
processes = '''
[processes.a]
program = "/system/bin/web"

[processes.b]
program = "/system/bin/web"
'''
valid = false
error = "is also the program of another process"

[[manifest]]
name = "at most four process tables"
processes = '''
[processes.a]
program = "/p/a"
[processes.b]
program = "/p/b"
[processes.c]
program = "/p/c"
[processes.d]
program = "/p/d"
[processes.e]
program = "/p/e"
'''
valid = false
error = "at most 4 tables"

[[manifest]]
name = "a process table has no topics"
processes = '''
[processes.web]
program = "/system/bin/web"
topics = ["publish:a/b"]
'''
valid = false
error = "topics"

[[manifest]]
name = "a process table has no develop"
processes = '''
[processes.web]
program = "/system/bin/web"
develop = true
'''
valid = false
error = "develop"

[[manifest]]
name = "a process table needs its program"
processes = '''
[processes.web]
interfaces = []
'''
valid = false
error = "program"

# --- app.version --------------------------------------------------------------

[[manifest]]
name = "two components"
version = "1.0"
valid = true

[[manifest]]
name = "four components"
version = "1.2.3.4"
valid = true

[[manifest]]
name = "a pre-release"
version = "2.0.0-rc.1"
valid = true

[[manifest]]
name = "one component is not a version"
version = "1"
valid = false
error = "app.version"

[[manifest]]
name = "a leading zero is not a version"
version = "1.02.0"
valid = false
error = "app.version"

[[manifest]]
name = "build metadata is not supported"
version = "1.0.0+abc"
valid = false
error = "app.version"

# --- Versions on their own ----------------------------------------------------

[versions]
valid = [
    "0.0",
    "1.0",
    "1.0.0",
    "1.0.0.0",
    "65535.65535.65535.65535",
    "1.0.0-rc1",
    "1.0.0-rc-1",
    "1.0.0-alpha.1.beta",
    "1.0-0",
    "1.0-0abc",
    "1.0-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
]
# Each chain is strictly ascending.
ascending = [
    ["1.9", "1.10", "1.10.1", "2.0"],
    ["0.9.9", "1.0.0-rc1", "1.0.0", "1.0.1"],
    [
        "1.0.0-alpha",
        "1.0.0-alpha.1",
        "1.0.0-alpha.beta",
        "1.0.0-beta",
        "1.0.0-beta.2",
        "1.0.0-beta.11",
        "1.0.0-rc.1",
        "1.0.0",
    ],
    ["1.0.0-1", "1.0.0-2", "1.0.0-10", "1.0.0-a", "1.0.0-a.0"],
    ["1.0.0-B", "1.0.0-a"],
    ["1.0", "1.0.0.1", "1.0.1"],
]
# Each pair is equal (and so neither is lower).
equal = [
    ["1.0", "1.0.0"],
    ["1.0", "1.0.0.0"],
    ["1.0-rc1", "1.0.0-rc1"],
    ["2.5.0", "2.5"],
]

# `reason` is the Display of the lazypkg::VersionError, which pkgmanifest.py
# raises word for word.
[[versions.invalid]]
text = ""
reason = "is empty or longer than 64 bytes"

[[versions.invalid]]
# 65 bytes: one over the limit (the 64-byte one below is valid).
text = "1.0-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
reason = "is empty or longer than 64 bytes"

[[versions.invalid]]
text = "1"
reason = "must have two to four numbers"

[[versions.invalid]]
text = "1.2.3.4.5"
reason = "must have two to four numbers"

[[versions.invalid]]
text = "1..0"
reason = "has a number that is not decimal below 65536 without a leading zero"

[[versions.invalid]]
text = "01.0"
reason = "has a number that is not decimal below 65536 without a leading zero"

[[versions.invalid]]
text = "65536.0"
reason = "has a number that is not decimal below 65536 without a leading zero"

[[versions.invalid]]
text = "1.0.x"
reason = "has a number that is not decimal below 65536 without a leading zero"

[[versions.invalid]]
text = "v1.0"
reason = "has a number that is not decimal below 65536 without a leading zero"

[[versions.invalid]]
text = "1.0 "
reason = "has a number that is not decimal below 65536 without a leading zero"

[[versions.invalid]]
text = "1.0+build"
reason = "has a number that is not decimal below 65536 without a leading zero"

[[versions.invalid]]
text = "1.0-"
reason = "has a pre-release part that is not dot-separated [0-9A-Za-z-] identifiers"

[[versions.invalid]]
text = "1.0-rc..1"
reason = "has a pre-release part that is not dot-separated [0-9A-Za-z-] identifiers"

[[versions.invalid]]
text = "1.0-rc_1"
reason = "has a pre-release part that is not dot-separated [0-9A-Za-z-] identifiers"

[[versions.invalid]]
text = "1.0-01"
reason = "has a pre-release part that is not dot-separated [0-9A-Za-z-] identifiers"

[[versions.invalid]]
text = "1.0-rc+1"
reason = "has a pre-release part that is not dot-separated [0-9A-Za-z-] identifiers"
