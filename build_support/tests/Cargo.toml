[package]
name = "build-support-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host tests of the image build modules in build_support/"
license = "GPL-3.0-or-later"

[lib]
path = "lib.rs"

[dependencies]
# `fuzz` brings the in-memory device and the independent fsck-style checker.
ext2fs = { path = "../../libs/ext2fs", features = ["fuzz"] }
# The destinations the image build modules name.
fhs = { path = "../../libs/fhs", features = ["alloc"] }
# The USB stick image's FAT volumes (`usb_ramdisk.rs`), as in the root build.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }

[dev-dependencies]
# The roots the image's CA bundle is built from (the root crate pins it).
webpki-root-certs = "=1.0.9"
