name: ci

# Hardening gates (issue #9): formatting, lints, a plain `cargo build`, and a
# headless boot that asserts on serial output. The heavier suites live in their
# own workflows: kernel-tests (in-kernel unit/soak), abi-compat (Linux ABI),
# screenshots (framebuffer pixels), clippy (`unsafe` documentation).

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# F2 (docs/filesystem-plan.md): `cargo build` updates target/lazyos.img in place when it
# exists; CI is hermetic, so every image is created fresh.
env:
  LAZYOS_RESET_OS: "1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the nightly toolchain (with rustfmt/clippy).
      - run: cargo fmt --all -- --check

  fhs:
    # Well-known paths come from libs/fhs, never string literals (F0).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-cache
        with:
          key: host
      - run: python tools/fhs/check_literals.py
      - run: python -m unittest discover -s tools/fhs -p "test_*.py"
      - run: cargo test -p fhs --features alloc

  xui-pin:
    # One xui revision across every manifest and lockfile (xui-app, doom,
    # lazyrad-os), so a bump cannot miss a workspace.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/xui/test_check_pin.py
      - run: python tools/xui/check_pin.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-cache
        with:
          key: host
      - name: Clippy (kernel and user programs, no_std target)
        run: |
          cargo clippy -p kernel -p user --target x86_64-unknown-none \
            -Zbuild-std=core,alloc -- -D warnings
      - name: Clippy (host libraries)
        run: cargo clippy -p libmessenger -p messenger-generated -p lazyos-crypto -p font-atlas -p confd -p timezone -p inputmap -- -D warnings
      - name: Zone and DST resolution tests (timed)
        run: cargo test -p timezone
      - name: Keymap, modifier, repeat and pointer tests (inputd, includes the seeded pointer fuzz)
        run: cargo test -p inputmap
      - name: Clippy (inputmap tests and its fuzz entry point)
        run: cargo clippy -p inputmap --all-targets --features fuzz -- -D warnings
      - name: USB libraries (usbd, docs/usb-hid-plan.md U0)
        run: cargo test -p usbhid -p xhci -p usbpolicy -p usbmsc --features usbmsc/fuzz
      - name: Clippy (usbhid and xhci, tests and fuzz entry points)
        run: cargo clippy -p usbhid -p xhci -p usbpolicy -p usbmsc --all-targets --features usbhid/fuzz,usbmsc/fuzz -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: NVMe protocol core (model controller, PRP rules, hostile controller fuzz)
        run: cargo test -p nvme
        env:
          FUZZ_CASES: "5000"
      - name: Clippy (nvme, tests and fuzz entry point)
        run: cargo clippy -p nvme --all-targets --features fuzz -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: ACPI table walker (golden QEMU dumps, hostile tables, seeded fuzz)
        run: cargo test -p acpi
        env:
          FUZZ_CASES: "5000"
      - name: Clippy (acpi, tests and fuzz entry point)
        run: cargo clippy -p acpi --all-targets --features fuzz -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: ext2 driver, formatter and populator (host tests, soak and seeded fuzz)
        run: cargo test -p ext2fs
        env:
          FUZZ_CASES: "2000"
      - name: Clippy (ext2fs, tests and fuzz entry point)
        run: cargo clippy -p ext2fs --all-targets --features fuzz -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: Image build modules (layout, manifest diff, 64 MiB guard, create vs update)
        run: cargo test -p build-support-tests
      - name: Clippy (image build modules)
        run: cargo clippy -p build-support-tests --all-targets -- -D warnings

  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/qemu
        with:
          packages: qemu-system-x86 musl-tools

      - uses: ./.github/actions/rust-cache
        with:
          key: os-image

      # The system shell is BusyBox `sh` (issue #254); the pinned static musl
      # binary is embedded in the demo image by `build.rs`.
      - uses: ./.github/actions/busybox

      # Builds the BIOS disk image and copies it to target/lazyos.img.
      - name: Build
        run: cargo build

      # Boots headless and drives the system shell (BusyBox `sh`, issue #254):
      # the serial log must show the FAT volume listing and a file read. Every
      # step waits on a serial marker, so a hang or a wrong result fails the
      # job. (Ring-3 fault containment is covered by the `fault_*` kernel tests
      # now that the native shell that used to launch `/system/bin/faultprobe` is gone.)
      - name: Boot and assert on serial output
        run: |
          python tools/screenshot/qemu_session.py --image target/lazyos.img \
            --out shots/boot --script tools/screenshot/examples/fs_demo.json \
            --fail-on "EXCEPTION:" --fail-on "PANIC"
          python tools/screenshot/pngstats.py shots/boot/*.png --min-nonblack 0.01

      # Issue #260: the services image starts `confd`, which spawns one
      # `confctl` self-test at boot. The session gates on
      # `CONFD:READY dir=/conf persistent=true` (the store on the OS volume) and
      # `CONFCTL:SELFTEST:PASS`, so the store, the VFS `StoreFs` (write tmp ->
      # fsync -> rename) and the change publisher are exercised over the real
      # Messenger transport, not just in the unit suite.
      - name: Build services image and assert confd evidence
        run: |
          LAZYOS_SERVICES=1 cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img \
            --out shots/confd --script tools/screenshot/examples/confd_demo.json \
            --fail-on "PANIC" --fail-on "CONFCTL:SELFTEST:FAIL"
          python tools/screenshot/pngstats.py shots/confd/*.png --min-nonblack 0.01

      # The full services evidence (issue #158): the non-desktop
      # `LAZYOS_SERVICES=1` boot still starts the demo/evidence programs, so its
      # serial log is checked for the launch, crash-restart, `top` and open-with
      # markers. The desktop profile (`LAZYOS_DESKTOP=1`) deliberately omits
      # those, and its own job checks only the markers it still emits (see
      # `tools/services/evidence.py --desktop` and `.github/workflows/xui.yml`).
      - name: Assert services boot evidence
        run: |
          python tools/screenshot/qemu_session.py --image target/lazyos.img \
            --out shots/services --script tools/screenshot/examples/services_demo.json \
            --fail-on "PANIC"
          python tools/services/evidence.py shots/services/serial.log

      # Issue #315: native LazyOS programs run from BusyBox `sh`. `sh` reaches
      # them through `fork` + `execve`; the kernel spawns the native ELF as a
      # child of the forked task, waits for it and forwards its exit status.
      # The session logs in on the console and checks the exit statuses
      # (`top` 0, `confctl` 1, an unknown command 127, a faulting `faultprobe`
      # 139), a piped native program, and a background job (`top &`, then
      # `wait`).
      - name: Run native programs from the shell
        run: |
          python tools/screenshot/qemu_session.py --image target/lazyos.img \
            --out shots/native --script tools/screenshot/examples/native_exec.json \
            --fail-on "PANIC" --fail-on "EXCEPTION:"
          grep -q "^status=0" shots/native/serial.log
          grep -q "^status=1$" shots/native/serial.log
          grep -q "^status=127" shots/native/serial.log
          grep -q "^fault=139" shots/native/serial.log
          grep -q "^PIPED-USAGE: confctl" shots/native/serial.log
          grep -q "^waited=0" shots/native/serial.log
          python tools/screenshot/pngstats.py shots/native/*.png --min-nonblack 0.01

      # Issue #508 section 3: the accounts are `admin` and `user` from
      # /system/etc/passwd. `user` logs in on the console, lands in its home
      # with HOME/USER/PATH set, and cannot read /home/admin, /conf or
      # /logs/kernel.log; `admin` lands in /home/admin. Then an image without
      # the account file: accountsd fails closed and no login succeeds.
      - name: Accounts, homes and permissions
        run: |
          python tools/screenshot/qemu_session.py --image target/lazyos.img \
            --out shots/accounts --script tools/screenshot/examples/accounts_perms.json \
            --fail-on "PANIC" --fail-on "EXCEPTION:"
          grep -q "^ACCOUNTS:LOAD:PASS rows=2 " shots/accounts/serial.log
          LAZYOS_SERVICES=1 LAZYOS_OMIT_PASSWD=1 cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img \
            --out shots/accounts-missing --script tools/screenshot/examples/accounts_failclosed.json \
            --fail-on "PANIC" --fail-on "LOGIN:OK:PASS"
          LAZYOS_SERVICES=1 cargo build

      # docs/input-plan.md: `inputd` turns the kernel's raw HID-coded key edges
      # into layout-aware events. The session presses a fixed set of physical
      # keys (letters, symbols, Shift, AltGr, Ctrl, Caps Lock, keypad, a held
      # key for repeat) and `verify_trace.py` checks the `INPUTD:` serial trace
      # against what each layout must type. Runs last: the AZERTY image is a
      # separate build (`LAZYOS_KBD_LAYOUT=fr`).
      - name: Input trace (US then AZERTY)
        run: |
          LAZYOS_SERVICES=1 cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img             --out shots/input_us --script tools/screenshot/examples/input_keys.json             --fail-on "PANIC" --fail-on "EXCEPTION:"
          python tools/input/verify_trace.py shots/input_us/serial.log --layout us
          LAZYOS_KBD_LAYOUT=fr LAZYOS_SERVICES=1 cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img             --out shots/input_fr --script tools/screenshot/examples/input_keys.json             --fail-on "PANIC" --fail-on "EXCEPTION:"
          python tools/input/verify_trace.py shots/input_fr/serial.log --layout fr

      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-evidence
          path: |
            shots/boot/**
            shots/confd/**
            shots/services/**
            shots/native/**
            shots/input_us/**
            shots/input_fr/**
          if-no-files-found: warn
