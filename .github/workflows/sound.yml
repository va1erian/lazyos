name: sound

# virtio-sound driver (docs/driver-plan.md D6) and the system mixer
# (docs/audio-plan.md): host unit tests for the driver libraries, the mixer
# engine, the client library and the detectors, then the end-to-end harness,
# which boots QEMU with `-audiodev wav` and checks the *recording*, not just
# the serial markers.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sound-${{ github.ref }}
  cancel-in-progress: true

# F2 (docs/filesystem-plan.md): `cargo build` updates target/lazyos.img in place when it
# exists; CI is hermetic, so every image is created fresh.
env:
  LAZYOS_RESET_OS: "1"

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-cache
        with:
          key: host

      # rust-toolchain.toml pins the nightly toolchain; rustup installs it.
      - name: Driver libraries (host)
        run: cargo test -p virtio -p virtio-snd -p pcm

      # The engine's tests include a seeded script fuzz; CI runs a longer soak.
      - name: Mixer engine and client library (host)
        run: |
          cargo test -p audiomix -p audioclient -p sndpolicy
          FUZZ_CASES=3000 cargo test -p audiomix -p audioclient seeded
          cargo test -p messenger-generated --test audio

      # The ProTracker engine the `modplay` binary and the LazyRAD MOD player use.
      - name: Tracker engine (host)
        run: cargo test -p modplay

      - name: Clippy (mixer engine and client library)
        run: cargo clippy -p audiomix -p audioclient --all-targets -- -D warnings

      - name: WAV and mix detectors
        run: |
          python tools/sound/test_analyze_wav.py
          python tools/sound/test_mixcheck.py
          python tools/lazyrad/test_modjudge.py
          python tools/lazyrad/gen_demo_song.py --check

  harness:
    name: harness (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default machine: the kernel boots `sndd`, which plays its own
          # tone, and `audiod`, which then runs the clients through the mixer
          # (tone, probe, intruder, soak, control-panel probe).
          - name: default
            args: ""
          # Two clients at once must sound as one chord at unity level, and a
          # stream at half volume at half the amplitude.
          - name: mix
            args: "--mix"
          # `init` supervises the driver as _snd (uid 901) and the mixer as
          # _audio (uid 905, no capabilities).
          - name: services
            args: "--services"
          # q35 has no IDE controller the kernel drives: virtio-blk boot disk.
          - name: q35
            args: "--machine q35 --virtio-disk"
          # No sound card: the driver must say so and exit cleanly.
          - name: no-device
            args: "--no-device"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/qemu

      - uses: ./.github/actions/rust-cache
        with:
          key: os-image

      - name: Boot, record and verify
        run: python tools/sound/run.py --out shots/sound ${{ matrix.args }}

      - name: Upload the recording and serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-${{ matrix.name }}
          path: shots/sound/**
          if-no-files-found: warn
