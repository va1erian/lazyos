name: messenger

# Parcel codec tests (issue #65). The crate is host-testable (no QEMU needed):
# round-trips, limits, and the one-million-iteration decode fuzz.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messenger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messenger-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run the parcel codec tests
        run: cargo test -p libmessenger

      # The shell language was retired (issue #254): BusyBox `sh` is the system
      # shell now, and the fabricated `midlc` stubs keep their own tests.
      - name: Run the generated-stub tests
        run: cargo test -p messenger-generated
