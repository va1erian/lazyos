name: abi-compat

# Linux ABI conformance bench: build the static musl fixtures, run each in
# headless LazyOS, and publish the compatibility matrix + syscall coverage.
# The reports go out as the `abi-compat` and `abi-reports` artifacts; pages.yml
# (which runs after this workflow on main) picks up the latter and publishes it
# on the docs site.
#
# run.py exits non-zero when a fixture fails or never reports, which fails the
# job; later steps use `if: always()` so the matrix and PR comment still land.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: abi-compat-${{ github.ref }}
  cancel-in-progress: true

# F2 (docs/filesystem-plan.md): `cargo build` updates target/lazyos.img in place when it
# exists; CI is hermetic, so every image is created fresh.
env:
  LAZYOS_RESET_OS: "1"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/qemu
        with:
          packages: qemu-system-x86 musl-tools

      - uses: ./.github/actions/rust-cache
        with:
          key: abi
          workspaces: |
            . -> target
            tools/abi/fixtures -> target

      # `build.py` also provides the BusyBox row's shell; the cache spares the
      # download and compile of the pinned release.
      - uses: ./.github/actions/busybox

      # build.py adds the musl target itself (nightly, per rust-toolchain.toml).
      - name: Build fixtures (static musl)
        run: python tools/abi/build.py

      # Three guests at a time: the runner has four cores and every boot is a
      # fixed `--at` wait, so the rows overlap instead of queueing.
      - name: Run the conformance bench
        run: python tools/abi/run.py --at 8 --jobs 3

      - name: Syscall coverage
        if: always()
        run: python tools/abi/coverage.py

      - name: Upload ABI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abi-compat
          path: |
            docs/compat/**
            shots/abi/**
          if-no-files-found: warn

      # Just the two reports, for pages.yml: the docs site publishes them, and
      # the big artifact above (screenshots included) is not worth fetching.
      - name: Upload the ABI reports for the docs site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abi-reports
          path: |
            docs/compat/matrix.md
            docs/compat/coverage.md
          if-no-files-found: warn

      - name: Summarise on the pull request
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Linux ABI conformance"
            echo
            # Blank lines around the content are required for GitHub to
            # render the markdown tables inside <details>.
            echo "<details><summary>Compatibility matrix</summary>"
            echo
            cat docs/compat/matrix.md
            echo
            echo "</details>"
            echo
            echo "<details><summary>Syscall coverage (ENOSYS)</summary>"
            echo
            cat docs/compat/coverage.md
            echo
            echo "</details>"
          } > abi-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${GITHUB_REPOSITORY}" --body-file abi-comment.md
