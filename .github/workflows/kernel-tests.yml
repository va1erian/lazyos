name: kernel-tests

# In-kernel unit/soak suite (issue #62): build the kernel with `LAZYOS_TESTS=1`,
# boot it headless in QEMU, and classify the `TEST:` lines printed over serial.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      # Hosted runners expose /dev/kvm but not to the runner user; open it up
      # so `--accel auto` picks KVM (it falls back to TCG if KVM is unusable).
      - name: Enable KVM (best effort)
        run: bash tools/ci/enable_kvm.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # rust-toolchain.toml pins the nightly toolchain and target; rustup
      # installs it on first use.
      - name: Run the kernel test harness
        run: python tools/test/run.py --out shots/kernel-tests

      - name: Append report to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f docs/test/report.md ]; then
            cat docs/test/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no report was generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload kernel test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-test-report
          path: |
            docs/test/**
            shots/kernel-tests/**
          if-no-files-found: warn
