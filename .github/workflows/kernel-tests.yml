name: kernel-tests

# In-kernel unit/soak suite (issue #62): build the kernel with `LAZYOS_TESTS=1`,
# boot it headless in QEMU, and classify the `TEST:` lines printed over serial.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-tests-${{ github.ref }}
  cancel-in-progress: true

# F2 (docs/filesystem-plan.md): `cargo build` updates target/lazyos.img in place when it
# exists; CI is hermetic, so every image is created fresh.
env:
  LAZYOS_RESET_OS: "1"

jobs:
  kernel-tests:
    name: kernel-tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default machine: IDE disk, no NIC.
          - name: default
            args: ""
          # A legacy virtio-net function enables the end-to-end device
          # interrupt test (dev_irq_real_device_end_to_end); issue #283.
          - name: virtio-net
            args: "--nic"
          # q35 with a virtio-only disk: no ATA, so the ATA-specific tests must
          # skip cleanly and the device core must work without an IDE drive.
          - name: q35-virtio
            args: "--machine q35 --virtio-disk --nic"
          # The 8259 and INTx only (issue #616): every other leg runs the
          # I/O APIC and MSI/MSI-X, this one the path older images took.
          - name: pic-intx
            args: "--nic"
            irqchip: pic
            msi: "0"
          # A scratch NVMe disk for the NVMe request-path tests (nvme_suite,
          # docs/nvme-install-plan.md N1).
          - name: nvme
            args: "--machine q35 --nvme"
          # A scratch disk on QEMU's AHCI controller for the AHCI request-path
          # tests (ahci_suite, docs/ahci-plan.md A2).
          - name: ahci
            args: "--machine q35 --ahci"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/qemu

      - uses: ./.github/actions/rust-cache
        with:
          key: os-image

      # rust-toolchain.toml pins the nightly toolchain and target; rustup
      # installs it on first use.
      - name: Run the kernel test harness
        run: python tools/test/run.py --out shots/kernel-tests ${{ matrix.args }}
        env:
          LAZYOS_IRQCHIP: ${{ matrix.irqchip }}
          LAZYOS_MSI: ${{ matrix.msi }}

      - name: Append report to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f docs/test/report.md ]; then
            cat docs/test/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no report was generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload kernel test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-test-report-${{ matrix.name }}
          path: |
            docs/test/**
            shots/kernel-tests/**
          if-no-files-found: warn

  # The dev image on QEMU's NVMe controller and nothing else: firmware boots
  # from it, the kernel attaches nvme0 and mounts / from nvme0p3
  # (docs/nvme-install-plan.md N1). Default build, judged on serial markers.
  nvme-boot:
    name: nvme-boot (bios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/qemu

      - uses: ./.github/actions/rust-cache
        with:
          key: os-image

      - name: Build the dev image
        run: cargo build

      - name: Boot from NVMe and judge it
        run: >
          python tools/boot/run.py --no-build --image target/lazyos.img
          --media nvme --firmware bios --root nvme0p3
          --ready "Hello from ring 3!" --serial-only --settle 0
          --out shots/nvme-boot

      - name: Upload the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvme-boot
          path: shots/nvme-boot/**
          if-no-files-found: warn

  # The dev image on QEMU's AHCI controller and nothing else: firmware boots
  # from it, the kernel attaches ahci0 and mounts / from ahci0p3
  # (docs/ahci-plan.md A3). Default build, judged on serial markers.
  ahci-boot:
    name: ahci-boot (bios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/qemu

      - uses: ./.github/actions/rust-cache
        with:
          key: os-image

      - name: Build the dev image
        run: cargo build

      - name: Boot from AHCI and judge it
        run: >
          python tools/boot/run.py --no-build --image target/lazyos.img
          --media ahci --firmware bios --root ahci0p3
          --ready "Hello from ring 3!" --serial-only --settle 0
          --out shots/ahci-boot

      - name: Upload the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahci-boot
          path: shots/ahci-boot/**
          if-no-files-found: warn
