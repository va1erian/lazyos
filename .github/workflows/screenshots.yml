name: screenshots

# Boots LazyOS in headless QEMU, captures PNG screenshots, verifies they are
# non-blank, publishes them to a force-pushed `screenshots` branch, and comments
# them onto pull requests so an agent or reviewer can visually inspect output
# without a display.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_path:
        description: "Path to a disk image to boot (leave empty to auto-detect / smoke test)"
        required: false
        default: ""
      capture_at:
        description: "Comma-separated capture times in seconds"
        required: false
        default: "5,8,12"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build disk image (if the OS project exists)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          image=""
          if [ -f Cargo.toml ]; then
            echo "Cargo project detected; attempting build"
            if command -v cargo >/dev/null 2>&1; then
              cargo build || echo "::warning::cargo build failed; falling back to firmware smoke test"
            fi
          else
            echo "No Cargo.toml yet; running firmware smoke test only"
          fi
          shopt -s nullglob
          for candidate in target/lazyos.img target/bios.img target/*/bios.img target/*/*/bios.img; do
            if [ -f "$candidate" ]; then image="$candidate"; break; fi
          done
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ -n "$image" ]; then
            echo "Found image: $image"
          else
            echo "No disk image found; will boot firmware only to validate the capture pipeline"
          fi

      - name: Capture screenshots (headless QEMU)
        shell: bash
        run: |
          set -euo pipefail
          image="${{ inputs.image_path }}"
          if [ -z "$image" ]; then image="${{ steps.build.outputs.image }}"; fi
          at="${{ inputs.capture_at }}"
          if [ -z "$at" ]; then at="5,8,12"; fi
          if [ -n "$image" ] && [ -f "$image" ]; then
            python tools/screenshot/qemu_shot.py --out shots --at "$at" --image "$image"
          else
            python tools/screenshot/qemu_shot.py --out shots --at "2,5"
          fi

      - name: Drive the guest (keyboard + mouse smoke test)
        shell: bash
        run: |
          set -euo pipefail
          image="${{ inputs.image_path }}"
          if [ -z "$image" ]; then image="${{ steps.build.outputs.image }}"; fi
          if [ -n "$image" ] && [ -f "$image" ]; then
            python tools/screenshot/qemu_session.py --image "$image" --out shots \
              --script tools/screenshot/examples/type_and_shot.json
          else
            echo "no disk image; skipping input smoke test"
          fi

      - name: Verify screenshots are non-blank
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=(shots/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then
            echo "::error::no screenshots were captured"
            exit 1
          fi
          python tools/screenshot/pngstats.py "${pngs[@]}" --min-nonblack 0.001 \
            --min-colors 40

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-screenshots
          path: |
            shots/*.png
            shots/serial.log
            shots/summary.json
          if-no-files-found: error

      - name: Upload screenshots to image host
        id: host
        # External upload is best-effort; on failure we fall back to the
        # `screenshots` branch raw URLs in the PR comment.
        continue-on-error: true
        shell: bash
        env:
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=(shots/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then
            echo "no screenshots to upload"
            exit 0
          fi
          python tools/screenshot/upload_image.py "${pngs[@]}" | tee shots/urls.tsv

      - name: Publish screenshots to 'screenshots' branch
        id: publish
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          work=/tmp/shots-branch
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf "$work"
          # Append to the existing branch so historical PR-comment links stay
          # reachable (a force-push would orphan them).
          if git clone -q --depth 1 --branch screenshots "$remote" "$work" 2>/dev/null; then
            echo "appending to existing screenshots branch"
          else
            mkdir -p "$work"
            git -C "$work" init -q
            git -C "$work" checkout -q -b screenshots
          fi
          prefix="runs/${GITHUB_RUN_ID}"
          mkdir -p "$work/$prefix"
          cp shots/*.png "$work/$prefix/"
          pngs=("$work/$prefix"/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then
            echo "no screenshots to publish"
            exit 0
          fi
          git -C "$work" add -A
          git -C "$work" -c user.name=github-actions \
              -c user.email=github-actions@users.noreply.github.com \
              commit -qm "screenshots for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git -C "$work" push -q "$remote" screenshots
          echo "sha=$(git -C "$work" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Comment screenshots on PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ steps.publish.outputs.sha }}"
          prefix="${{ steps.publish.outputs.prefix }}"
          ref="${sha:-screenshots}"
          {
            echo "### QEMU screenshots"
            echo
            echo "_commit \`${GITHUB_SHA:0:7}\` — run [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
            echo
            shopt -s nullglob
            for png in shots/*.png; do
              name=$(basename "$png")
              echo "**${name}**"
              echo
              url=""
              if [ -f shots/urls.tsv ]; then
                url=$(awk -F'\t' -v n="$name" '$1==n {print $2; exit}' shots/urls.tsv || true)
              fi
              if [ -n "$url" ] && [ "${url:0:4}" = "http" ]; then
                echo "![${name}](${url})"
              elif [ -n "$sha" ]; then
                echo "![${name}](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ref}/${prefix}/${name})"
              else
                echo "_screenshot available as a workflow artifact_"
              fi
              echo
            done
            if [ -f shots/serial.log ]; then
              echo "<details><summary>serial.log (tail)</summary>"
              echo
              echo '```'
              tail -n 60 shots/serial.log
              echo '```'
              echo
              echo "</details>"
            fi
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${GITHUB_REPOSITORY}" --body-file comment.md
