name: pages

# The documentation site (https://<owner>.github.io/<repo>/): every Markdown
# file under docs/, README.md and CONTRIBUTING.md, built by tools/site/build.py
# and deployed to GitHub Pages. It replaces the GitHub wiki.
#
# Rebuilt when the docs or the generator change, and after every abi-compat run
# on main so the Linux ABI matrix and syscall coverage (CI output, git-ignored)
# stay current under "Hardware & ABI compatibility". Pull requests build and
# check the site (broken links fail) but do not deploy it.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# To rebuild by hand: Actions -> pages -> Run workflow, or locally
# `python tools/site/build.py` (tools/site/README.md).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [abi-compat]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download the latest abi-compat artifact

concurrency:
  group: pages-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A cancelled abi-compat run has nothing new to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/site/requirements.txt

      - run: pip install -r tools/site/requirements.txt

      - name: Generator tests
        run: python tools/site/test_site.py

      # docs/compat/matrix.md and coverage.md are written by the ABI bench and
      # are git-ignored; take them from the newest abi-compat artifact built on
      # main from this repository (never from a fork's pull request). Without
      # one the site simply has no ABI pages yet.
      - name: Fetch the latest ABI reports (best effort)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=abi-compat&per_page=30" \
            --jq '[.artifacts[]
                   | select(.expired == false
                            and .workflow_run.head_branch == "main"
                            and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].id // empty')
          if [ -z "$id" ]; then
            echo "No abi-compat artifact on main yet; building without the ABI pages."
            exit 0
          fi
          scratch=$(mktemp -d)
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "${scratch}/abi.zip"
          unzip -q "${scratch}/abi.zip" -d "${scratch}/abi"
          for name in matrix.md coverage.md; do
            found=$(find "${scratch}/abi" -path '*docs/compat/*' -name "$name" | head -n1)
            if [ -n "$found" ]; then cp "$found" "docs/compat/$name"; fi
          done
          ls docs/compat

      # --strict: a broken link or a #fragment that matches no heading fails the
      # build, so a renamed doc is caught in the pull request that renames it.
      - name: Build the site
        env:
          SITE_REF: ${{ github.event.repository.default_branch }}
        run: python tools/site/build.py --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
