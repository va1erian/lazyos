name: xui-app

# Issue #114: build the ordinary xui app (static musl) and boot LazyOS with it
# as the session (`LAZYOS_XUID=1` + `LAZYOS_XUI_APP`). Captures screenshots for
# each milestone and viewer, checks the `XUIAPP:*:PASS`/`SYSMON:*`/`FABMON:*`
# markers in the serial log, and comments the images on the pull request.
# Optional: if the musl target or toolchain is unavailable the app build reports
# nothing and the visual steps are skipped (`tools/xui/build.py` exits 0, like
# the ABI bench); a real compile error fails the job.
#
# Every capture is readiness-gated, not scheduled at fixed seconds after boot:
# the session scripts wait for each app's serial marker (`wait_for`) before a
# screenshot, and confirm each key/click was handled (`until`, re-sending it
# if not). Boot under TCG on a shared runner varies by tens of seconds, which a
# fixed timeline turns into flaky failures. A gate that times out, or a
# `--fail-on` marker, fails the session itself, with `shot_failed.png`, the
# serial tail and a step `timeline` in `summary.json`; the logs and shots are
# uploaded even when the job fails so a red run can be diagnosed.
#
# The build/boot job runs with a read-only token and no persisted git
# credentials; only the separate `publish` job, which never runs repository
# code, gets write access to push screenshots and comment.

on:
  # Also on `main`, so the caches this job saves (cargo dependencies, the zig
  # global cache, BusyBox) are the warm set every pull request restores; a
  # cache saved on a pull request branch is visible to that branch alone.
  push:
    branches: [main]
    paths:
      - "xui-app/**"
      - "tools/xui/**"
      - "tools/screenshot/**"
      - "tools/ci/**"
      - "kernel/**"
      - "libs/**"
      - "user/**"
      - "build.rs"
      - "build_support/**"
      - "Cargo.toml"
      - ".github/workflows/xui.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "xui-app/**"
      - "tools/xui/**"
      - "tools/screenshot/**"
      - "tools/ci/**"
      - "kernel/**"
      - "libs/**"
      - "user/**"
      - "build.rs"
      - "build_support/**"
      - "Cargo.toml"
      - ".github/workflows/xui.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xui-app-${{ github.ref }}
  cancel-in-progress: true

# F2 (docs/filesystem-plan.md): `cargo build` updates target/lazyos.img in place when it
# exists; CI is hermetic, so every image is created fresh.
env:
  LAZYOS_RESET_OS: "1"

jobs:
  xui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      captured: ${{ steps.app.outputs.counter != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/qemu
        with:
          packages: qemu-system-x86 musl-tools

      # The OS workspace (`.`) and the standalone app workspace (`xui-app`)
      # have separate lockfiles and target dirs, so both are listed. rust-cache
      # recurses into nested target dirs (the Docs app's `target/xui-zig`), so
      # no extra entry is needed; it also sets CARGO_INCREMENTAL=0.
      - uses: ./.github/actions/rust-cache
        with:
          key: xui
          workspaces: |
            . -> target
            xui-app -> target

      # zig builds libc++/libc++abi/libunwind/musl for the Docs app on first use
      # and stores them in its global cache; pin that location and cache it so a
      # warm run skips those compiles. The env var must be set before the first
      # zig invocation. Bump the key with `zig.ZIG_VERSION` (tools/xui/zig.py).
      - name: Pin and cache the zig global cache
        shell: bash
        run: echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-0.16.0-${{ runner.os }}

      # The Docs app embeds litehtml (C++), built with zig for the musl target
      # (`tools/xui/zig.py`, docs/xui-docs.md). Without it `build.py` skips the
      # app with a warning, so the pin here is what makes CI exercise it.
      - name: Install zig (C++ toolchain for the Docs app)
        run: |
          python -m pip install ziglang==0.16.0
          python tools/xui/test_zig.py
          python tools/xui/test_core_packages.py
          python tools/xui/test_git_checkout.py
          python tools/screenshot/test_qmp_mouse.py

      - name: Build the app (static musl)
        id: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/xui
          python tools/xui/build.py | tee target/xui/build.json
          m0=""; counter=""; sysmon=""; fabricmon=""; client=""; term=""
          editor=""; paint=""; files=""; docs=""; writer=""; shell=""
          if python -c "import json,sys; sys.exit(0 if 'xui-m0' in json.load(open('target/xui/build.json')) else 1)"; then
            m0="$(pwd)/target/xui/xui-m0.elf"
            counter="$(pwd)/target/xui/xui-counter.elf"
            sysmon="$(pwd)/target/xui/xui-sysmon.elf"
            fabricmon="$(pwd)/target/xui/xui-fabricmon.elf"
            client="$(pwd)/target/xui/xui-client.elf"
            term="$(pwd)/target/xui/xui-term.elf"
            # The document apps (Editor, Paint, Files, Docs, LazyWriter) are
            # built by the same script; a build without them just skips their
            # sessions.
            for app in editor paint files docs writer shell; do
              if python -c "import json,sys; sys.exit(0 if 'xui-$app' in json.load(open('target/xui/build.json')) else 1)"; then
                printf -v "$app" '%s' "$(pwd)/target/xui/xui-$app.elf"
              fi
            done
          else
            echo "::warning::xui app unavailable; skipping the visual run"
          fi
          echo "m0=$m0" >> "$GITHUB_OUTPUT"
          echo "counter=$counter" >> "$GITHUB_OUTPUT"
          echo "sysmon=$sysmon" >> "$GITHUB_OUTPUT"
          echo "fabricmon=$fabricmon" >> "$GITHUB_OUTPUT"
          echo "client=$client" >> "$GITHUB_OUTPUT"
          echo "term=$term" >> "$GITHUB_OUTPUT"
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          echo "paint=$paint" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "writer=$writer" >> "$GITHUB_OUTPUT"
          # LazyShell (issue #157) is part of every desktop image.
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          ls -l target/xui/*.elf || true

      # The Terminal hosts BusyBox `sh` (issue #254); the pinned static musl
      # binary is embedded in the desktop image by `build.rs`.
      - uses: ./.github/actions/busybox

      # M0: the gradient proves bind/present from a static musl program.
      - name: Capture M0 (gradient present)
        if: ${{ !cancelled() && steps.app.outputs.m0 != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.m0 }}
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/m0 \
            --timeout 300 --script tools/screenshot/examples/xui_m0.json \
            --fail-on "XUIAPP:(BIND|PRESENT|RUN):FAIL"
          grep -q "XUIAPP:PRESENT:PASS" shots/m0/serial.log

      # M1 + M2: the Counter paints, then a scripted click increments it.
      - name: Capture M1/M2 (counter, real input)
        if: ${{ !cancelled() && steps.app.outputs.counter != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.counter }}
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/m1 \
            --timeout 300 --script tools/screenshot/examples/xui_m1.json \
            --fail-on "XUIAPP:(BIND|PRESENT|RUN):FAIL"
          grep -q "XUIAPP:COUNTER:PASS" shots/m1/serial.log
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/m2 \
            --timeout 300 --script tools/screenshot/examples/xui_counter.json \
            --fail-on "XUIAPP:(BIND|PRESENT|RUN):FAIL"
          grep -q "XUIAPP:COUNTER:PASS" shots/m2/serial.log
          grep -q "XUIAPP:INPUT:PASS" shots/m2/serial.log

      # sysmon: the system-state dashboard (syscall 14) with a 1 s timer and
      # the r/s/o/q keys driven by the session script. The image boots the
      # service session (`LAZYOS_SERVICES=1`) so the Services tab (issue #489)
      # lists what `init` supervises with `healthd`'s health for each.
      - name: Capture sysmon (dashboard + services)
        if: ${{ !cancelled() && steps.app.outputs.sysmon != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.sysmon }}
          LAZYOS_SERVICES: "1"
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/sysmon \
            --timeout 300 --script tools/screenshot/examples/xui_sysmon.json \
            --fail-on "SYSMON:(BIND|UP|RUN):FAIL"
          grep -q "SYSMON:UP:PASS" shots/sysmon/serial.log
          grep -q "SYSMON:REFRESH:PASS" shots/sysmon/serial.log
          grep -q "SYSMON:SERVICES:PASS" shots/sysmon/serial.log
          grep -q "SYSMON:VIEW:overview" shots/sysmon/serial.log
          grep -q "SYSMON:QUIT:PASS" shots/sysmon/serial.log

      # fabricmon: the Messenger fabric panel (syscall 5). The image boots the
      # full service session (`LAZYOS_SERVICES=1`), so the registry lists every
      # registered service and `messengerd`'s topics broker answers live.
      - name: Capture fabricmon (fabric panel)
        if: ${{ !cancelled() && steps.app.outputs.fabricmon != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.fabricmon }}
          LAZYOS_SERVICES: "1"
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/fabmon \
            --timeout 300 --script tools/screenshot/examples/xui_fabricmon.json \
            --fail-on "FABMON:(BIND|UP|RUN):FAIL"
          grep -q "FABMON:UP:PASS" shots/fabmon/serial.log
          grep -q "FABMON:REFRESH:PASS" shots/fabmon/serial.log
          grep -q "FABMON:QUIT:PASS" shots/fabmon/serial.log

      # Client mode (issue #168): `xuid` runs the compositor and the app is a
      # client in a decorated window. The session clicks the text field, types
      # with the pointer away, focuses the counter by key cycling, drives it
      # with Space, then exercises the WM (drag, minimize, Alt+Tab restore,
      # close). This image has no LazyShell, so there is no taskbar.
      - name: Capture client mode (window, focus routing, WM)
        if: ${{ !cancelled() && steps.app.outputs.client != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_CLIENT: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.client }}
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/client \
            --timeout 300 --script tools/screenshot/examples/xui_client.json \
            --fail-on "XUIAPP:(CLIENT|RUN):FAIL"
          grep -q "XUIAPP:CLIENT:PASS" shots/client/serial.log
          grep -q "XUIAPP:KEY:PASS" shots/client/serial.log
          grep -q "XUIAPP:COUNTER:1" shots/client/serial.log
          grep -q "XUIAPP:CLOSE:PASS" shots/client/serial.log

      # Issue #215: sysmon (owner-mode by design) falls back to client mode when
      # `xuid` already holds the display grant, so the same binary runs in a
      # desktop window. The session drives it with the r/s/o/q keys through
      # xuid; this image has no services, so the Services tab shows why
      # (`SYSMON:SERVICES:NONE`) instead of hanging on a missing `init`.
      - name: Capture sysmon as a xuid client (owner-mode fallback)
        if: ${{ !cancelled() && steps.app.outputs.sysmon != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_CLIENT: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.sysmon }}
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/sysclient \
            --timeout 300 --script tools/screenshot/examples/xui_sysmon_noservices.json \
            --fail-on "SYSMON:(BIND|UP|RUN):FAIL"
          grep -q "XUID:UP:PASS" shots/sysclient/serial.log
          grep -q "SYSMON:UP:PASS" shots/sysclient/serial.log
          grep -q "SYSMON:REFRESH:PASS" shots/sysclient/serial.log
          grep -q "SYSMON:SERVICES:NONE" shots/sysclient/serial.log
          grep -q "SYSMON:QUIT:PASS" shots/sysclient/serial.log

      # Issues #215/#216/#217: the desktop session. One `LAZYOS_DESKTOP=1`
      # switch expands to the whole recipe (services + `xuid` + the default xui
      # apps embedded side by side); `init`'s app registry opens them as clients
      # (Terminal, sysmon, fabricmon, counter). The session types into the
      # Terminal window (it hosts the shell; it also runs a native LazyOS
      # program, `confctl`, through the shell's `execve`, issue #315), then
      # cycles focus with Alt+Tab.
      # The desktop profile starts no demo/evidence programs (no `flaky`, `top`
      # self-test or clipboard demo pair), and no registered-but-unshipped app
      # may log a launch failure.
      - name: Capture desktop session (multi-app + Terminal)
        if: ${{ !cancelled() && steps.app.outputs.term != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          # The desktop opens only the Terminal by default; this session
          # exercises the viewers side by side too.
          LAZYOS_XUI_AUTOSTART: term,sysmon,fabricmon,counter
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/desktop \
            --timeout 300 --script tools/screenshot/examples/xui_desktop.json \
            --fail-on "(TERM|SYSMON|FABMON):(BIND|UP|RUN):FAIL" --fail-on "TERM:SPAWN:FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          for app in terminal os.lazy.sysmon os.lazy.fabricmon os.lazy.counter; do
            grep -q "INIT:AUTOSTART:PASS app=$app" shots/desktop/serial.log
          done
          grep -q "TERM:CMD:echo \$((6\*7))" shots/desktop/serial.log
          grep -q "TERM:OUT:42" shots/desktop/serial.log
          grep -q "TERM:OUT:Hello from LazyOS!" shots/desktop/serial.log
          grep -q "TERM:OUT:usage: confctl" shots/desktop/serial.log
          python tools/services/evidence.py shots/desktop/serial.log --desktop
          ! grep -q "^init: launch .* failed" shots/desktop/serial.log
          # Keys reach the windows through `inputd` sessions (docs/input-plan.md),
          # not the compositor's legacy KeyDown/KeyUp.
          grep -q "xuid: attached to inputd" shots/desktop/serial.log
          grep -q "INPUTD:SESSION:OPEN" shots/desktop/serial.log
          # So does the pointer (docs/usb-hid-plan.md, P2): one cursor for
          # every pointing device, kept by `inputd`.
          grep -q "xuid: pointer from inputd" shots/desktop/serial.log

      # docs/usb-hid-plan.md, P2: kill `inputd` from the Terminal. `xuid`
      # releases what it held and falls back to the kernel pointer stream,
      # `init` restarts `inputd`, and `xuid` re-attaches and takes the
      # pointer from it again; a click on the taskbar then restores the
      # Counter (screenshot `02_taskbar_click_after_restart`).
      - name: Capture inputd restart (pointer handover)
        if: ${{ !cancelled() && steps.app.outputs.term != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_AUTOSTART: term,counter
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/pointer_restart \
            --timeout 300 --script tools/screenshot/examples/xuid_pointer_restart.json \
            --fail-on "TERM:SPAWN:FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          grep -q "xuid: pointer back on the kernel stream" shots/pointer_restart/serial.log
          grep -qE "init: started inputd \\(pid [0-9]+, attempt 2\\)" shots/pointer_restart/serial.log
          test "$(grep -c "xuid: pointer from inputd" shots/pointer_restart/serial.log)" -ge 2

      # Issue #157: LazyShell, the desktop shell. The session captures the
      # desktop and taskbar, opens the start menu with Ctrl+Esc, launches System
      # Monitor from it (a new taskbar entry), switches with Alt+Tab, closes it
      # (the entry goes), then kills LazyShell from the Terminal (`kill -9`
      # with the pid captured from `INIT:LAUNCH:PASS`) and waits for `init` to
      # restart it with the window list intact (`SHELL:RESTART:PASS`).
      - name: Capture LazyShell session (taskbar, start menu, restart)
        if: ${{ !cancelled() && steps.app.outputs.shell != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/shell \
            --timeout 300 --script tools/screenshot/examples/shell_demo.json \
            --fail-on "SHELL:[A-Z]+:FAIL" --fail-on "INIT:AUTOSTART:FAIL" --fail-on "TERM:SPAWN:FAIL"
          grep -q "INIT:AUTOSTART:PASS app=lazyshell" shots/shell/serial.log
          # LazyShell opens before the apps.
          first="$(grep -o "INIT:AUTOSTART:PASS app=[a-z]*" shots/shell/serial.log | head -n 1)"
          test "$first" = "INIT:AUTOSTART:PASS app=lazyshell"
          for marker in SHELL:UP:PASS SHELL:SERVICE:PASS SHELL:DESKTOP:PASS SHELL:MENU:OPEN \
                        "SHELL:LAUNCH:PASS app=os.lazy.sysmon" "INIT:LAUNCH:PASS app=os.lazy.sysmon" \
                        SHELL:TASKBAR:ADD SHELL:TASKBAR:REMOVE \
                        "INIT:RESTART:PASS name=lazyshell" SHELL:RESTART:PASS; do
            grep -q "$marker" shots/shell/serial.log
          done
          test "$(grep -c "SHELL:UP:PASS" shots/shell/serial.log)" -ge 2
          python tools/services/evidence.py shots/shell/serial.log --desktop

      # Symbols that share their code with navigation keys in the Windows
      # virtual-key vocabulary (`& " ' ( % $ #`) must type, not move the caret.
      # The Editor screenshot shows the text in order; the Terminal marker is
      # checked on serial. Same symbols on US here and, with physical keys,
      # on AZERTY in the last capture step.
      - name: Capture symbol typing (US)
        if: ${{ !cancelled() && steps.app.outputs.term != '' && steps.app.outputs.editor != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.term }}:${{ steps.app.outputs.editor }}
          LAZYOS_XUI_AUTOSTART: term,editor
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/symbols_us --timeout 300 --script tools/screenshot/examples/input_symbols_us.json --fail-on "(TERM|EDITOR):[A-Z]+:FAIL"
          grep -qF 'TERM:OUT:&"(%$#' shots/symbols_us/serial.log

      # The document apps (Editor, Paint, Files). Each session boots the
      # desktop profile with just that app (an explicit `LAZYOS_XUI_APPS` list,
      # so it does not depend on the default desktop set) autostarted, then
      # drives it with real keys and pointer input and waits on the app's own
      # serial markers. `/tmp` is ramfs, so saves land there.
      - name: Capture Editor (type, edit, save)
        if: ${{ !cancelled() && steps.app.outputs.editor != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.editor }}
          LAZYOS_XUI_AUTOSTART: editor
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/editor             --timeout 300 --script tools/screenshot/examples/xui_editor.json             --fail-on "EDITOR:[A-Z]+:FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          for marker in EDITOR:UP:PASS EDITOR:SAVE:PASS; do
            grep -q "$marker" shots/editor/serial.log
          done
          ! grep -q "^init: launch .* failed" shots/editor/serial.log

      - name: Capture Paint (draw, undo, save PNG)
        if: ${{ !cancelled() && steps.app.outputs.paint != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.paint }}
          LAZYOS_XUI_AUTOSTART: paint
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/paint             --timeout 300 --script tools/screenshot/examples/xui_paint.json             --fail-on "PAINT:[A-Z]+:FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          for marker in PAINT:UP:PASS PAINT:SAVE:PASS; do
            grep -q "$marker" shots/paint/serial.log
          done
          ! grep -q "^init: launch .* failed" shots/paint/serial.log

      - name: Capture Files (browse, open)
        if: ${{ !cancelled() && steps.app.outputs.files != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.files }}:${{ steps.app.outputs.editor }}
          LAZYOS_XUI_AUTOSTART: files
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/files             --timeout 300 --script tools/screenshot/examples/xui_files.json             --fail-on "FILES:[A-Z]+:FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          for marker in FILES:UP:PASS FILES:OPEN:PASS; do
            grep -q "$marker" shots/files/serial.log
          done
          ! grep -q "^init: launch .* failed" shots/files/serial.log

      # Docs: Markdown rendered by litehtml (built with zig). The pointer only
      # hovers over the window (no click), so this also proves the mouse wheel
      # goes to the window under the pointer, through the whole input chain: the
      # PS/2 wheel driver, `xuid`'s PointerWheel and the client backend. The
      # page must move on wheel-down and return to the top on wheel-up.
      - name: Capture Docs (Markdown, mouse wheel)
        if: ${{ !cancelled() && steps.app.outputs.docs != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.docs }}
          LAZYOS_XUI_AUTOSTART: docs
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/docs             --timeout 300 --script tools/screenshot/examples/xui_docs.json             --fail-on "DOCS:[A-Z]+:FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          for marker in DOCS:UP:PASS DOCS:RENDER:PASS XUID:WHEEL:PASS MIME:VIEW:PASS                         "mouse: PS/2 auxiliary device enabled (wheel)"; do
            grep -qF "$marker" shots/docs/serial.log
          done
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/screenshot")
          from pngstats import decode_png

          # The pointer is parked before the baseline, so the cursor is at the
          # same place in all three frames. Only the window content is compared
          # (the taskbar clock may tick between shots).
          def content(name):
              width, height, channels, pixels = decode_png(Path(f"shots/docs/shot_{name}.png"))
              x0, x1, y0, y1 = 52, 948, 52, 688
              return b"".join(
                  pixels[(y * width + x0) * channels : (y * width + x1) * channels]
                  for y in range(y0, y1)
              )

          top = content("01_docs_top")
          down = content("02_docs_wheel_down")
          back = content("03_docs_wheel_back_up")
          if down == top:
              sys.exit("the mouse wheel did not scroll the page down")
          if back != top:
              sys.exit("wheel-up did not return the page to where it started")
          PY
          ! grep -q "^init: launch .* failed" shots/docs/serial.log

      # Docs Open dialog: the toolbar button and Ctrl+O each show the portable
      # file picker (which lists the `/system/share/samples/testdoc.md` fixture the image ships), a
      # cancelled dialog leaves the page alone, and a typed path loads the
      # document into the view.
      - name: Capture Docs (Open dialog, test document)
        if: ${{ !cancelled() && steps.app.outputs.docs != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.docs }}
          LAZYOS_XUI_AUTOSTART: docs
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/docs_open             --timeout 300 --script tools/screenshot/examples/xui_docs_open.json             --fail-on "DOCS:[A-Z]+:FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          for marker in DOCS:UP:PASS DOCS:RENDER:PASS DOCS:OPEN:PASS:/system/share/samples/testdoc.md \
                        DOCS:RENDER:PASS:/system/share/samples/testdoc.md; do
            grep -qF "$marker" shots/docs_open/serial.log
          done
          # The replacement view must have painted a document: compare decoded
          # pixels inside the page viewport only (below the toolbar, so the path
          # label, window title and pointer cannot change the result). The
          # pointer is unmoved between the two shots.
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/screenshot")
          from pngstats import decode_png

          def viewport(name):
              width, height, channels, pixels = decode_png(Path(f"shots/docs_open/shot_{name}.png"))
              x0, x1, y0, y1 = 52, 948, 90, 688
              return b"".join(
                  pixels[(y * width + x0) * channels : (y * width + x1) * channels]
                  for y in range(y0, y1)
              ), channels

          welcome, channels = viewport("01_welcome_toolbar")
          opened, _ = viewport("06_document_opened")
          if opened == welcome:
              sys.exit("opening the test document did not change the page viewport")
          pixels = {opened[i : i + channels] for i in range(0, len(opened), channels)}
          if len(pixels) < 8:
              sys.exit(f"the opened document's viewport is nearly blank ({len(pixels)} colours)")
          PY
          ! grep -q "^init: launch .* failed" shots/docs_open/serial.log

      # LazyWriter (issue #533): type a paragraph and bold a word (Ctrl+B),
      # centre a line, make a bullet list and insert the sample picture with
      # the toolbar, then save as .lzw, export Markdown, start a new document
      # and reopen the saved one. The reopened document's area must differ
      # from the new, empty one and hold more than a few colours (text and the
      # picture), so a reopen that loaded nothing fails.
      - name: Capture LazyWriter (format, save, export, reopen)
        if: ${{ !cancelled() && steps.app.outputs.writer != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.writer }}
          LAZYOS_XUI_AUTOSTART: writer
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/writer             --timeout 300 --script tools/screenshot/examples/xui_writer.json             --fail-on "WRITER:[A-Z]+:FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          for marker in WRITER:UP:PASS WRITER:SAVE:PASS WRITER:EXPORT:PASS WRITER:OPEN:PASS; do
            grep -q "$marker" shots/writer/serial.log
          done
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/screenshot")
          from pngstats import decode_png

          # The document area only: the 960x600 window's client area starts
          # at (49, 70); this is below its toolbar and format row and above
          # its status bar (which names the file, so it would differ even for
          # an empty reopen). The pointer is parked off the window for both.
          def document(name):
              width, height, channels, pixels = decode_png(Path(f"shots/writer/shot_{name}.png"))
              x0, x1, y0, y1 = 52, 1000, 144, 640
              return b"".join(
                  pixels[(y * width + x0) * channels : (y * width + x1) * channels]
                  for y in range(y0, y1)
              ), channels

          empty, channels = document("11_new_document")
          reopened, _ = document("13_reopened")
          if reopened == empty:
              sys.exit("reopening the saved document did not change the document area")
          colours = {reopened[i : i + channels] for i in range(0, len(reopened), channels)}
          if len(colours) < 8:
              sys.exit(f"the reopened document is nearly blank ({len(colours)} colours)")
          PY
          ! grep -q "^init: launch .* failed" shots/writer/serial.log

      # LazyWriter in the light theme (issue #533): the Terminal switches
      # `sys/ui/mode` to light, then starts the app (which reads the theme
      # once, at start); its document area must come out light.
      - name: Capture LazyWriter in the light theme
        if: ${{ !cancelled() && steps.app.outputs.writer != '' && steps.app.outputs.term != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.term }}:${{ steps.app.outputs.writer }}
          LAZYOS_XUI_AUTOSTART: term
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/writer_light \
            --timeout 300 --script tools/screenshot/examples/xui_writer_light.json \
            --fail-on "WRITER:[A-Z]+:FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          grep -q "THEME:APPLIED" shots/writer_light/serial.log
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/screenshot")
          from pngstats import decode_png

          # The document area below the typed line, in the window xuid
          # cascades below the Terminal's (client area from about 113,86).
          width, height, channels, pixels = decode_png(Path("shots/writer_light/shot_02_light_bold.png"))
          x0, x1, y0, y1 = 130, 1050, 200, 640
          total = count = 0
          for y in range(y0, y1):
              row = pixels[(y * width + x0) * channels : (y * width + x1) * channels]
              for i in range(0, len(row), channels):
                  total += row[i] + row[i + 1] + row[i + 2]
                  count += 1
          mean = total / (3 * count)
          print(f"light document area mean {mean:.1f}")
          if mean < 200:
              sys.exit(f"the document area is not light (mean {mean:.1f})")
          PY

      # LazyWriter printing (docs/printing-plan.md): type a line, open the
      # print bar (Ctrl+P), print to a fake IPP printer on the host
      # (tools/print/fake_printer.py, 10.0.2.2:8631 from the guest) and judge
      # what it received: one Print-Job of one A4 PWG Raster page at 300 dpi
      # with the text at the 25 mm margins.
      - name: Print from LazyWriter to a fake printer
        if: ${{ !cancelled() && steps.app.outputs.writer != '' }}
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_NETD: "1"
          LAZYOS_NETD_ARGS: demo=0
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.writer }}
          LAZYOS_XUI_AUTOSTART: writer
        run: |
          set -euo pipefail
          cargo build
          python tools/print/run.py --no-build --out shots/print
          ! grep -q "^init: launch .* failed" shots/print/serial.log

      # docs/input-plan.md: the same desktop on the French AZERTY layout. The
      # session types *physical* keys (`qwerty` is `azerty` there) into the
      # Editor and the Terminal, so a wrong keymap, a lost session or a key
      # read as an arrow shows up as different text in the screenshot and on
      # the Terminal's serial marker. Runs after the US captures (see the
      # next step for why).
      - name: Capture desktop session on AZERTY (Editor + Terminal)
        if: ${{ !cancelled() && steps.app.outputs.term != '' && steps.app.outputs.editor != '' }}
        shell: bash
        env:
          LAZYOS_KBD_LAYOUT: fr
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.term }}:${{ steps.app.outputs.editor }}
          LAZYOS_XUI_AUTOSTART: term,editor
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/desktop_fr             --timeout 300 --script tools/screenshot/examples/input_desktop_fr.json             --fail-on "(TERM|EDITOR):[A-Z]+:FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          grep -q "INPUTD:READY layout=fr" shots/desktop_fr/serial.log
          grep -q "TERM:OUT:azerty" shots/desktop_fr/serial.log

      # The same symbols on AZERTY (physical keys). This and the AZERTY
      # desktop step above are the last captures: `LAZYOS_KBD_LAYOUT` is a
      # `user` crate switch, so every other capture shares one US build and
      # the French `user` is compiled once instead of toggled back and forth.
      - name: Capture symbol typing (AZERTY)
        if: ${{ !cancelled() && steps.app.outputs.term != '' && steps.app.outputs.editor != '' }}
        shell: bash
        env:
          LAZYOS_KBD_LAYOUT: fr
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_APPS: ${{ steps.app.outputs.term }}:${{ steps.app.outputs.editor }}
          LAZYOS_XUI_AUTOSTART: term,editor
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/symbols_fr --timeout 300 --script tools/screenshot/examples/input_symbols_fr.json --fail-on "(TERM|EDITOR):[A-Z]+:FAIL"
          grep -qF 'TERM:OUT:&"(%$#' shots/symbols_fr/serial.log

      - name: Verify screenshots are non-blank
        if: steps.app.outputs.counter != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=(shots/m0/*.png shots/m1/*.png shots/m2/*.png shots/sysmon/*.png shots/fabmon/*.png shots/client/*.png shots/sysclient/*.png shots/desktop/*.png shots/shell/*.png shots/desktop_fr/*.png shots/symbols_us/*.png shots/symbols_fr/*.png shots/editor/*.png shots/paint/*.png shots/files/*.png shots/docs/*.png shots/docs_open/*.png shots/writer/*.png shots/writer_light/*.png shots/print/shot_*.png)
          if [ ${#pngs[@]} -eq 0 ]; then
            echo "::error::no screenshots were captured"
            exit 1
          fi
          # Client mode has no LazyShell, and xuid itself paints no taskbar
          # (issue #157): once the window is minimized or closed the frame is
          # the background plus the cursor, three colours. Those two shots are
          # checked on their own for exactly that (the compositor still draws
          # the cursor); every other shot keeps the four-colour floor.
          empty=(shots/client/shot_05_minimized.png shots/client/shot_08_closed.png)
          rest=()
          for png in "${pngs[@]}"; do
            case " ${empty[*]} " in *" $png "*) ;; *) rest+=("$png") ;; esac
          done
          python tools/screenshot/pngstats.py "${rest[@]}" --min-nonblack 0.01 --min-colors 4
          present=()
          for png in "${empty[@]}"; do [ -f "$png" ] && present+=("$png"); done
          if [ ${#present[@]} -gt 0 ]; then
            python tools/screenshot/pngstats.py "${present[@]}" --min-nonblack 0.01 --min-colors 3
          fi

      # On a red run, show what each boot reached: the app markers, the session
      # outcome (which gate failed and when) and the serial tail.
      - name: Dump serial markers and session timelines
        if: failure() && steps.app.outputs.counter != ''
        shell: bash
        run: |
          shopt -s nullglob
          for dir in shots/m0 shots/m1 shots/m2 shots/sysmon shots/fabmon shots/client shots/sysclient shots/desktop shots/shell shots/editor shots/paint shots/files shots/docs shots/docs_open shots/writer shots/writer_light shots/print; do
            [ -d "$dir" ] || continue
            echo "::group::$dir"
            if [ -f "$dir/summary.json" ]; then
              python -c "import json,sys; s=json.load(open(sys.argv[1])); print('ok:', s.get('ok'), '| failure:', s.get('failure')); [print(' ', e) for e in s.get('timeline', [])]" "$dir/summary.json" || true
            fi
            if [ -f "$dir/serial.log" ]; then
              echo "--- markers ---"
              grep -aE "XUIAPP|SYSMON|FABMON|TERM:|EDITOR:|PAINT:|FILES:|DOCS:|WRITER:|SHELL:|INIT:AUTOSTART|INIT:RESTART|panic|PANIC" "$dir/serial.log" || echo "(none)"
              echo "--- serial tail ---"
              tail -n 40 "$dir/serial.log"
            fi
            echo "::endgroup::"
          done

      # Uploaded on failure too (the publish job still needs a green run), so
      # the shots, serial logs and timelines of a failing run can be inspected.
      - name: Upload screenshots artifact
        if: always() && steps.app.outputs.counter != ''
        uses: actions/upload-artifact@v4
        with:
          name: xui-app-screenshots
          path: |
            shots/m0/*.png
            shots/m0/serial.log
            shots/m0/summary.json
            shots/m1/*.png
            shots/m1/serial.log
            shots/m1/summary.json
            shots/m2/*.png
            shots/m2/serial.log
            shots/m2/summary.json
            shots/sysmon/*.png
            shots/sysmon/serial.log
            shots/sysmon/summary.json
            shots/fabmon/*.png
            shots/fabmon/serial.log
            shots/fabmon/summary.json
            shots/client/*.png
            shots/client/serial.log
            shots/client/summary.json
            shots/sysclient/*.png
            shots/sysclient/serial.log
            shots/sysclient/summary.json
            shots/desktop/*.png
            shots/desktop/serial.log
            shots/desktop/summary.json
            shots/shell/*.png
            shots/shell/serial.log
            shots/shell/summary.json
            shots/editor/*.png
            shots/editor/serial.log
            shots/editor/summary.json
            shots/paint/*.png
            shots/paint/serial.log
            shots/paint/summary.json
            shots/files/*.png
            shots/files/serial.log
            shots/files/summary.json
            shots/docs/*.png
            shots/docs/serial.log
            shots/docs/summary.json
            shots/docs_open/*.png
            shots/docs_open/serial.log
            shots/docs_open/summary.json
            shots/writer/*.png
            shots/writer/serial.log
            shots/writer/summary.json
            shots/writer_light/*.png
            shots/writer_light/serial.log
            shots/writer_light/summary.json
          if-no-files-found: warn

  # Write-scoped job: no checkout of repository code, only the screenshots
  # artifact the read-only job uploaded.
  publish:
    needs: xui
    if: >-
      needs.xui.outputs.captured == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download screenshots artifact
        uses: actions/download-artifact@v4
        with:
          name: xui-app-screenshots
          path: shots

      - name: Publish screenshots to 'screenshots' branch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=/tmp/xui-shots
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf "$work"
          if git clone -q --depth 1 --branch screenshots "$remote" "$work" 2>/dev/null; then
            echo "appending to existing screenshots branch"
          else
            mkdir -p "$work"
            git -C "$work" init -q
            git -C "$work" checkout -q -b screenshots
          fi
          prefix="runs/${GITHUB_RUN_ID}/xui"
          mkdir -p "$work/$prefix"
          shopt -s nullglob
          for group in m0 m1 m2 sysmon fabmon client sysclient desktop shell editor paint files docs docs_open writer writer_light; do
            for png in shots/$group/*.png; do
              cp "$png" "$work/$prefix/$group-$(basename "$png")"
            done
          done
          git -C "$work" add -A
          git -C "$work" -c user.name=github-actions \
              -c user.email=github-actions@users.noreply.github.com \
              commit -qm "xui screenshots for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          # Concurrent runs (other PRs, xui.yml) push to this shared branch, so
          # a plain push loses the race. Each run only adds its own runs/<id>
          # directory, so rebasing onto the new tip never conflicts.
          for attempt in 1 2 3 4 5 6; do
            git -C "$work" push -q "$remote" screenshots && break
            [ "$attempt" -eq 6 ] && { echo "screenshots push kept losing the race" >&2; exit 1; }
            sleep $((attempt * 2))
            git -C "$work" -c user.name=github-actions                 -c user.email=github-actions@users.noreply.github.com                 pull -q --rebase "$remote" screenshots
          done
          echo "sha=$(git -C "$work" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Comment screenshots on PR
        if: github.event_name == 'pull_request' && steps.publish.outputs.sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ steps.publish.outputs.sha }}"
          prefix="${{ steps.publish.outputs.prefix }}"
          {
            echo "### xui app on LazyOS (M0-M2 + viewers + compositor client + desktop session)"
            echo
            echo "_commit \`${GITHUB_SHA:0:7}\` — run [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
            echo
            shopt -s nullglob
            for group in m0 m1 m2 sysmon fabmon client sysclient desktop shell editor paint files docs docs_open writer writer_light; do
              for png in shots/$group/*.png; do
                name="$group-$(basename "$png")"
                echo "<details><summary>${name}</summary>"
                echo
                echo "![${name}](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha}/${prefix}/${name})"
                echo
                echo "</details>"
                echo
              done
            done
            for log in shots/m0/serial.log shots/m2/serial.log shots/sysmon/serial.log shots/fabmon/serial.log shots/client/serial.log shots/sysclient/serial.log shots/desktop/serial.log shots/editor/serial.log shots/paint/serial.log shots/files/serial.log shots/docs/serial.log shots/docs_open/serial.log shots/writer/serial.log shots/writer_light/serial.log; do
              if [ -f "$log" ]; then
                echo "<details><summary>${log} (xui/sysmon/fabricmon/client markers)</summary>"
                echo
                echo '```'
                grep -E "XUIAPP|SYSMON|FABMON|TERM:|EDITOR:|PAINT:|FILES:|DOCS:|WRITER:|INIT:AUTOSTART" "$log" || true
                echo '```'
                echo
                echo "</details>"
              fi
            done
          } > xui-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${GITHUB_REPOSITORY}" --body-file xui-comment.md
