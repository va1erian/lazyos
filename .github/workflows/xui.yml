name: xui-app

# Issue #114: build the ordinary xui app (static musl) and boot LazyOS with it
# as the session (`LAZYOS_XUID=1` + `LAZYOS_XUI_APP`). Captures screenshots for
# each milestone and viewer, checks the `XUIAPP:*:PASS`/`SYSMON:*`/`FABMON:*`
# markers in the serial log, and comments the images on the pull request.
# Optional: if the musl target or toolchain is unavailable the app build reports
# nothing and the visual steps are skipped (`tools/xui/build.py` exits 0, like
# the ABI bench); a real compile error fails the job.
#
# Every capture is readiness-gated, not scheduled at fixed seconds after boot:
# the session scripts wait for each app's serial marker (`wait_for`) before a
# screenshot, and confirm each key/click was handled (`until`, re-sending it
# if not). Boot under TCG on a shared runner varies by tens of seconds, which a
# fixed timeline turns into flaky failures. A gate that times out, or a
# `--fail-on` marker, fails the session itself, with `shot_failed.png`, the
# serial tail and a step `timeline` in `summary.json`; the logs and shots are
# uploaded even when the job fails so a red run can be diagnosed.
#
# The build/boot job runs with a read-only token and no persisted git
# credentials; only the separate `publish` job, which never runs repository
# code, gets write access to push screenshots and comment.

on:
  pull_request:
    paths:
      - "xui-app/**"
      - "tools/xui/**"
      - "tools/screenshot/**"
      - "tools/ci/**"
      - "kernel/**"
      - "libs/**"
      - "user/**"
      - "build.rs"
      - "Cargo.toml"
      - ".github/workflows/xui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xui-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      captured: ${{ steps.app.outputs.counter != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 musl-tools

      # Hosted runners expose /dev/kvm but not to the runner user; open it up
      # so `--accel auto` picks KVM (it falls back to TCG if KVM is unusable).
      - name: Enable KVM (best effort)
        run: bash tools/ci/enable_kvm.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build the app (static musl)
        id: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/xui
          python tools/xui/build.py | tee target/xui/build.json
          m0=""; counter=""; sysmon=""; fabricmon=""; client=""; term=""
          if python -c "import json,sys; sys.exit(0 if 'xui-m0' in json.load(open('target/xui/build.json')) else 1)"; then
            m0="$(pwd)/target/xui/xui-m0.elf"
            counter="$(pwd)/target/xui/xui-counter.elf"
            sysmon="$(pwd)/target/xui/xui-sysmon.elf"
            fabricmon="$(pwd)/target/xui/xui-fabricmon.elf"
            client="$(pwd)/target/xui/xui-client.elf"
            term="$(pwd)/target/xui/xui-term.elf"
          else
            echo "::warning::xui app unavailable; skipping the visual run"
          fi
          echo "m0=$m0" >> "$GITHUB_OUTPUT"
          echo "counter=$counter" >> "$GITHUB_OUTPUT"
          echo "sysmon=$sysmon" >> "$GITHUB_OUTPUT"
          echo "fabricmon=$fabricmon" >> "$GITHUB_OUTPUT"
          echo "client=$client" >> "$GITHUB_OUTPUT"
          echo "term=$term" >> "$GITHUB_OUTPUT"
          ls -l target/xui/*.elf || true

      # The Terminal hosts BusyBox `sh` (issue #254); build the pinned static
      # musl binary so `build.rs` embeds it in the desktop image.
      - name: Build BusyBox (system shell)
        shell: bash
        run: python tools/abi/busybox.py

      # M0: the gradient proves bind/present from a static musl program.
      - name: Capture M0 (gradient present)
        if: ${{ !cancelled() && steps.app.outputs.m0 != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.m0 }}
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/m0 \
            --timeout 300 --script tools/screenshot/examples/xui_m0.json \
            --fail-on "XUIAPP:(BIND|PRESENT|RUN):FAIL"
          grep -q "XUIAPP:PRESENT:PASS" shots/m0/serial.log

      # M1 + M2: the Counter paints, then a scripted click increments it.
      - name: Capture M1/M2 (counter, real input)
        if: ${{ !cancelled() && steps.app.outputs.counter != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.counter }}
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/m1 \
            --timeout 300 --script tools/screenshot/examples/xui_m1.json \
            --fail-on "XUIAPP:(BIND|PRESENT|RUN):FAIL"
          grep -q "XUIAPP:COUNTER:PASS" shots/m1/serial.log
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/m2 \
            --timeout 300 --script tools/screenshot/examples/xui_counter.json \
            --fail-on "XUIAPP:(BIND|PRESENT|RUN):FAIL"
          grep -q "XUIAPP:COUNTER:PASS" shots/m2/serial.log
          grep -q "XUIAPP:INPUT:PASS" shots/m2/serial.log

      # sysmon: the system-state dashboard (syscall 14) with a 1 s timer and
      # the r/q keys driven by the session script.
      - name: Capture sysmon (dashboard)
        if: ${{ !cancelled() && steps.app.outputs.sysmon != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.sysmon }}
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/sysmon \
            --timeout 300 --script tools/screenshot/examples/xui_sysmon.json \
            --fail-on "SYSMON:(BIND|UP|RUN):FAIL"
          grep -q "SYSMON:UP:PASS" shots/sysmon/serial.log
          grep -q "SYSMON:REFRESH:PASS" shots/sysmon/serial.log
          grep -q "SYSMON:QUIT:PASS" shots/sysmon/serial.log

      # fabricmon: the Messenger fabric panel (syscall 5). The image boots the
      # full service session (`LAZYOS_SERVICES=1`), so the registry lists every
      # registered service and `messengerd`'s topics broker answers live.
      - name: Capture fabricmon (fabric panel)
        if: ${{ !cancelled() && steps.app.outputs.fabricmon != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.fabricmon }}
          LAZYOS_SERVICES: "1"
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/fabmon \
            --timeout 300 --script tools/screenshot/examples/xui_fabricmon.json \
            --fail-on "FABMON:(BIND|UP|RUN):FAIL"
          grep -q "FABMON:UP:PASS" shots/fabmon/serial.log
          grep -q "FABMON:REFRESH:PASS" shots/fabmon/serial.log
          grep -q "FABMON:QUIT:PASS" shots/fabmon/serial.log

      # Client mode (issue #168): `xuid` runs the compositor and the app is a
      # client in a decorated window. The session clicks the text field, types
      # with the pointer away, focuses the counter by key cycling, drives it
      # with Space, then exercises the WM (drag, minimize, taskbar restore,
      # close).
      - name: Capture client mode (window, focus routing, WM)
        if: ${{ !cancelled() && steps.app.outputs.client != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_CLIENT: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.client }}
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/client \
            --timeout 300 --script tools/screenshot/examples/xui_client.json \
            --fail-on "XUIAPP:(CLIENT|RUN):FAIL"
          grep -q "XUIAPP:CLIENT:PASS" shots/client/serial.log
          grep -q "XUIAPP:KEY:PASS" shots/client/serial.log
          grep -q "XUIAPP:COUNTER:1" shots/client/serial.log
          grep -q "XUIAPP:CLOSE:PASS" shots/client/serial.log

      # Issue #215: sysmon (owner-mode by design) falls back to client mode when
      # `xuid` already holds the display grant, so the same binary runs in a
      # desktop window. The session drives it with the r/q keys through xuid.
      - name: Capture sysmon as a xuid client (owner-mode fallback)
        if: ${{ !cancelled() && steps.app.outputs.sysmon != '' }}
        shell: bash
        env:
          LAZYOS_XUID: "1"
          LAZYOS_XUI_CLIENT: "1"
          LAZYOS_XUI_APP: ${{ steps.app.outputs.sysmon }}
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/sysclient \
            --timeout 300 --script tools/screenshot/examples/xui_sysmon.json \
            --fail-on "SYSMON:(BIND|UP|RUN):FAIL"
          grep -q "XUID:UP:PASS" shots/sysclient/serial.log
          grep -q "SYSMON:UP:PASS" shots/sysclient/serial.log
          grep -q "SYSMON:REFRESH:PASS" shots/sysclient/serial.log
          grep -q "SYSMON:QUIT:PASS" shots/sysclient/serial.log

      # Issues #215/#216: the desktop session. Services + `xuid` + several xui
      # apps embedded side by side (`LAZYOS_XUI_APPS`); `init`'s app registry
      # opens them as clients (Terminal, sysmon, fabricmon, counter). The
      # session types into the Terminal window (it hosts the shell), then
      # cycles focus with Alt+Tab. No registered-but-unshipped app may log a
      # launch failure.
      - name: Capture desktop session (multi-app + Terminal)
        if: ${{ !cancelled() && steps.app.outputs.term != '' }}
        shell: bash
        env:
          LAZYOS_SERVICES: "1"
          LAZYOS_XUID: "1"
          LAZYOS_XUI_CLIENT: "1"
          XUI_TERM: ${{ steps.app.outputs.term }}
          XUI_SYSMON: ${{ steps.app.outputs.sysmon }}
          XUI_FABMON: ${{ steps.app.outputs.fabricmon }}
          XUI_COUNTER: ${{ steps.app.outputs.counter }}
        run: |
          set -euo pipefail
          export LAZYOS_XUI_APPS="$XUI_TERM:$XUI_SYSMON:$XUI_FABMON:$XUI_COUNTER"
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/desktop \
            --timeout 300 --script tools/screenshot/examples/xui_desktop.json \
            --fail-on "(TERM|SYSMON|FABMON):(BIND|UP|RUN):FAIL" --fail-on "INIT:AUTOSTART:FAIL"
          for app in terminal sysmon fabricmon counter; do
            grep -q "INIT:AUTOSTART:PASS app=$app" shots/desktop/serial.log
          done
          grep -q "TERM:CMD:echo \$((6\*7))" shots/desktop/serial.log
          grep -q "TERM:OUT:42" shots/desktop/serial.log
          grep -q "TERM:OUT:Hello from LazyOS!" shots/desktop/serial.log
          python tools/services/evidence.py shots/desktop/serial.log
          ! grep -q "^init: launch .* failed" shots/desktop/serial.log

      - name: Verify screenshots are non-blank
        if: steps.app.outputs.counter != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=(shots/m0/*.png shots/m1/*.png shots/m2/*.png shots/sysmon/*.png shots/fabmon/*.png shots/client/*.png shots/sysclient/*.png shots/desktop/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then
            echo "::error::no screenshots were captured"
            exit 1
          fi
          python tools/screenshot/pngstats.py "${pngs[@]}" --min-nonblack 0.01 --min-colors 4

      # On a red run, show what each boot reached: the app markers, the session
      # outcome (which gate failed and when) and the serial tail.
      - name: Dump serial markers and session timelines
        if: failure() && steps.app.outputs.counter != ''
        shell: bash
        run: |
          shopt -s nullglob
          for dir in shots/m0 shots/m1 shots/m2 shots/sysmon shots/fabmon shots/client shots/sysclient shots/desktop; do
            [ -d "$dir" ] || continue
            echo "::group::$dir"
            if [ -f "$dir/summary.json" ]; then
              python -c "import json,sys; s=json.load(open(sys.argv[1])); print('ok:', s.get('ok'), '| failure:', s.get('failure')); [print(' ', e) for e in s.get('timeline', [])]" "$dir/summary.json" || true
            fi
            if [ -f "$dir/serial.log" ]; then
              echo "--- markers ---"
              grep -aE "XUIAPP|SYSMON|FABMON|TERM:|INIT:AUTOSTART|panic|PANIC" "$dir/serial.log" || echo "(none)"
              echo "--- serial tail ---"
              tail -n 40 "$dir/serial.log"
            fi
            echo "::endgroup::"
          done

      # Uploaded on failure too (the publish job still needs a green run), so
      # the shots, serial logs and timelines of a failing run can be inspected.
      - name: Upload screenshots artifact
        if: always() && steps.app.outputs.counter != ''
        uses: actions/upload-artifact@v4
        with:
          name: xui-app-screenshots
          path: |
            shots/m0/*.png
            shots/m0/serial.log
            shots/m0/summary.json
            shots/m1/*.png
            shots/m1/serial.log
            shots/m1/summary.json
            shots/m2/*.png
            shots/m2/serial.log
            shots/m2/summary.json
            shots/sysmon/*.png
            shots/sysmon/serial.log
            shots/sysmon/summary.json
            shots/fabmon/*.png
            shots/fabmon/serial.log
            shots/fabmon/summary.json
            shots/client/*.png
            shots/client/serial.log
            shots/client/summary.json
            shots/sysclient/*.png
            shots/sysclient/serial.log
            shots/sysclient/summary.json
            shots/desktop/*.png
            shots/desktop/serial.log
            shots/desktop/summary.json
          if-no-files-found: warn

  # Write-scoped job: no checkout of repository code, only the screenshots
  # artifact the read-only job uploaded.
  publish:
    needs: xui
    if: >-
      needs.xui.outputs.captured == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download screenshots artifact
        uses: actions/download-artifact@v4
        with:
          name: xui-app-screenshots
          path: shots

      - name: Publish screenshots to 'screenshots' branch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=/tmp/xui-shots
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf "$work"
          if git clone -q --depth 1 --branch screenshots "$remote" "$work" 2>/dev/null; then
            echo "appending to existing screenshots branch"
          else
            mkdir -p "$work"
            git -C "$work" init -q
            git -C "$work" checkout -q -b screenshots
          fi
          prefix="runs/${GITHUB_RUN_ID}/xui"
          mkdir -p "$work/$prefix"
          shopt -s nullglob
          for group in m0 m1 m2 sysmon fabmon client sysclient desktop; do
            for png in shots/$group/*.png; do
              cp "$png" "$work/$prefix/$group-$(basename "$png")"
            done
          done
          git -C "$work" add -A
          git -C "$work" -c user.name=github-actions \
              -c user.email=github-actions@users.noreply.github.com \
              commit -qm "xui screenshots for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          # Concurrent runs (other PRs, xui.yml) push to this shared branch, so
          # a plain push loses the race. Each run only adds its own runs/<id>
          # directory, so rebasing onto the new tip never conflicts.
          for attempt in 1 2 3 4 5 6; do
            git -C "$work" push -q "$remote" screenshots && break
            [ "$attempt" -eq 6 ] && { echo "screenshots push kept losing the race" >&2; exit 1; }
            sleep $((attempt * 2))
            git -C "$work" -c user.name=github-actions                 -c user.email=github-actions@users.noreply.github.com                 pull -q --rebase "$remote" screenshots
          done
          echo "sha=$(git -C "$work" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Comment screenshots on PR
        if: github.event_name == 'pull_request' && steps.publish.outputs.sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ steps.publish.outputs.sha }}"
          prefix="${{ steps.publish.outputs.prefix }}"
          {
            echo "### xui app on LazyOS (M0-M2 + viewers + compositor client + desktop session)"
            echo
            echo "_commit \`${GITHUB_SHA:0:7}\` — run [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
            echo
            shopt -s nullglob
            for group in m0 m1 m2 sysmon fabmon client sysclient desktop; do
              for png in shots/$group/*.png; do
                name="$group-$(basename "$png")"
                echo "<details><summary>${name}</summary>"
                echo
                echo "![${name}](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha}/${prefix}/${name})"
                echo
                echo "</details>"
                echo
              done
            done
            for log in shots/m0/serial.log shots/m2/serial.log shots/sysmon/serial.log shots/fabmon/serial.log shots/client/serial.log shots/sysclient/serial.log shots/desktop/serial.log; do
              if [ -f "$log" ]; then
                echo "<details><summary>${log} (xui/sysmon/fabricmon/client markers)</summary>"
                echo
                echo '```'
                grep -E "XUIAPP|SYSMON|FABMON|TERM:|INIT:AUTOSTART" "$log" || true
                echo '```'
                echo
                echo "</details>"
              fi
            done
          } > xui-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${GITHUB_REPOSITORY}" --body-file xui-comment.md
