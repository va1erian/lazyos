name: midlc

# Messenger IDL compiler (issue #90): compiler unit tests, generated-code
# drift check (stubs and the Rhai schema table), and host round-trip tests for the generated stubs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midlc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  midlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-cache
        with:
          key: host

      - name: Compiler tests
        run: python tools/midlc/test_midlc.py

      # The Rust stubs and the schema table the Rhai `msg` module reads
      # (`docs/rhai/msg.md`) are both generated from `idl/`.
      - name: Generated stubs and schema are up to date
        run: python tools/midlc/midlc.py --check --out libs/generated/src/lib.rs --schema libs/rhai-lazy/src/msg/idl.rs idl/*.midl

      - name: Generated stubs round-trip
        run: cargo test -p messenger-generated
