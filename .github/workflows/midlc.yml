name: midlc

# Messenger IDL compiler (issue #90): compiler unit tests, generated-code
# drift check (stubs, the Rhai schema table and the Rhai API modules), and host round-trip tests for the generated stubs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midlc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  midlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-cache
        with:
          key: host

      - name: Compiler tests
        run: python tools/midlc/test_midlc.py

      - name: Transfer clause tests
        run: python tools/midlc/test_midlc_objects.py

      - name: Ring declaration tests
        run: python tools/midlc/test_midlc_rings.py

      - name: Package compatibility checker tests
        run: python tools/pkg/test_idl_compat.py

      - name: Field id, error field and corpus tests
        run: python tools/midlc/test_midlc_fields.py

      # The language-neutral corpus (docs/midl.md, "Conformance corpus"): the
      # expected models, errors and bytes, and the Rust test that holds the
      # generated codecs to them (run by the round-trip step below).
      - name: Conformance corpus is up to date
        run: python tools/midlc/conformance.py --check

      - name: Rhai API backend tests
        run: python tools/midlc/test_midlc_rhai.py

      # Headless model tests; the Tk smoke test skips without a display.
      - name: MIDL browser tests
        run: python tools/midlc/test_midl_browser.py

      # The Rust stubs, the schema table the Rhai `msg` module reads
      # (`docs/rhai/msg.md`) and the `sys::*` Rhai modules
      # (`libs/rhai-lazy/api/README.md`) are all generated from `idl/`.
      - name: Generated stubs, schema and Rhai API are up to date
        run: python tools/midlc/midlc.py --check --out libs/generated/src/lib.rs --schema libs/rhai-lazy/src/msg/idl.rs --rhai-api libs/rhai-lazy/api --rhai-docs docs/rhai/api --manifest idl/manifest.json --docs docs/idl idl/*.midl

      # The interface id checked at bind time hashes only the `.vN` name, so
      # this schema diff is the real compatibility test (docs/update-plan.md
      # decision 18). Informational for now: a deliberate break inside a `.vN`
      # shows up in the job summary and the log; making it a gate is dropping
      # `continue-on-error` once the first release snapshot exists.
      - name: IDL stays append-only against the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python tools/pkg/idl_compat.py FETCH_HEAD HEAD || { echo "::warning::IDL has non-append-only changes against $BASE_REF (see the job summary)"; exit 1; }

      - name: Generated stubs round-trip and match the corpus
        run: cargo test -p messenger-generated
