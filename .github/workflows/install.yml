name: install-beside-linux

# docs/grub-install-plan.md I3: build the desktop stick, install it with
# `lazyos-install --image` into a Linux-shaped GPT disk whose ESP boots real
# GRUB (grub-mkstandalone, a Debian-shaped grub.cfg, `next_entry` as
# grub-reboot writes it), boot that disk alone on AHCI under OVMF, power off,
# check both volumes from the host, check the next boot is the "Linux"
# default, and boot LazyOS again (tools/install/run.py).

on:
  pull_request:
    paths:
      - "tools/install/**"
      - "libs/gpt/**"
      - "libs/fhs/src/boot.rs"
      - "kernel/src/block/**"
      - "kernel/src/fs/mounts.rs"
      - "vendor/bootloader/uefi/**"
      - "build_support/os_*.rs"
      - "build_support/usb_*.rs"
      - ".github/workflows/install.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  LAZYOS_RESET_OS: "1"

jobs:
  install:
    name: install beside Linux and boot it (GRUB, OVMF, AHCI)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/qemu
        with:
          # python3-tk: run_demo.py imports lazygui, whose package imports Tk.
          packages: qemu-system-x86 musl-tools ovmf grub-efi-amd64-bin grub-common python3-tk

      - uses: ./.github/actions/rust-cache
        with:
          key: install
          workspaces: |
            . -> target
            xui-app -> target

      - uses: ./.github/actions/busybox

      - name: Build the desktop apps
        run: python tools/xui/build.py

      - name: The judge fails when it should
        run: |
          python tools/install/test_judge.py
          python tools/install/test_grubenv_judge.py

      - name: Install and boot (GRUB)
        run: python tools/install/run.py --via grub

      # docs/update-plan.md U2a: GRUB counts trial boots in /releases/grubenv.
      - name: Boot counting in the GRUB environment block (U2a)
        run: python tools/install/grubenv_run.py --no-build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-beside-linux
          path: |
            shots/install/**/*.log
            shots/install/**/*.json
            shots/install/**/*.png
          if-no-files-found: warn
