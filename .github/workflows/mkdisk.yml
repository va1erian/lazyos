name: mkdisk

# Pure-Python ext2 formatter for the persistent data volume (issue #332):
# unit tests, plus `e2fsck -n` over the generated images on a host that has it.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkdisk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdisk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tkinter: lazygui's package __init__ imports the Tk UI even for the
      # catalog tests, and the runner image ships without it.
      - name: Install e2fsprogs and tkinter
        run: sudo apt-get install -y e2fsprogs python3-tk

      - name: Formatter and launcher tests
        run: |
          python tools/mkdisk/test_mkdisk.py -v
          python tools/mkdisk/test_seed.py -v
          python tools/lazygui/test_catalog.py
          python tools/lazygui/test_drivers.py
          python tools/lazygui/test_limits.py
          python tools/test_run_demo.py
          python tools/test_run_demo_apps.py
          python tools/test_run_demo_net.py
          python tools/test_run_demo_webkit.py
          python tools/test_irqpath.py
          python tools/test_suites.py
          python tools/boot/test_stick_gui.py
          python tools/screenshot/test_qmp_disks.py

      # The WebKit dependency bundle (tools/webkit, docs/webkit-port-plan.md W3):
      # the judge, the staged-install and stamp logic, the recipe table and
      # pins, the libs/fhs path rule and the licence register. The build itself
      # (Docker, zig) and the QEMU run are manual (tools/webkit/README.md); each
      # file runs on its own because they share module names with tools/jsc.
      - name: WebKit bundle tests and licences
        run: |
          python tools/webkit/test_judge.py
          python tools/webkit/test_port_judge.py
          python tools/webkit/test_port_tree.py
          python tools/webkit/test_app_judge.py
          python tools/webkit/test_buildkit.py
          python tools/webkit/test_registry.py
          python tools/webkit/test_recipes.py
          python tools/webkit/test_paths.py
          python tools/webkit/test_licenses.py
          python tools/webkit/test_attack_judge.py
          python tools/webkit/licenses.py
          python tools/webplus/test_judge.py
          python tools/webplus/test_notify_judge.py
          python tools/webplus/test_hang_judge.py
          python tools/webplus/test_blocker_judge.py
          python tools/webplus/test_sample.py
          python tools/webplus/session.py --check

      # The Rust formatter (libs/ext2fs) writes the same bytes as the Python one.
      - name: Rust and Python formatters are byte-identical
        run: python tools/mkdisk/test_parity.py -v

      # The default image carries the seeded /home/<user> and sticky /tmp
      # (issue #347); the variants cover the root flags, a bare volume and
      # several block sizes, including multi-group sizes.
      - name: Seeded volumes are fsck-clean
        run: |
          python -m tools.mkdisk /tmp/data.img
          e2fsck -fn /tmp/data.img
          debugfs -R "stat /tmp" /tmp/data.img | grep -E "Mode: +01777"
          debugfs -R "stat /home/user" /tmp/data.img | grep -E "User: +1000 "
          debugfs -R "stat /home/admin" /tmp/data.img | grep -E "User: +1001 "
          python -m tools.mkdisk /tmp/root.img --root-mode 1777 --root-uid 1000 --root-gid 1000
          e2fsck -fn /tmp/root.img
          python -m tools.mkdisk /tmp/bare.img --no-seed --size 8M
          e2fsck -fn /tmp/bare.img
          python -m tools.mkdisk /tmp/k1.img --block-size 1024 --size 40M
          e2fsck -fn /tmp/k1.img
          python -m tools.mkdisk /tmp/big.img --size 200M
          e2fsck -fn /tmp/big.img

      # The home volume (filesystem plan F2): <user>/ at the volume root, owned
      # by the account, and neither /home nor /tmp. Label `lazyhome` is what
      # `home=LABEL=lazyhome` in lazyos.cfg resolves.
      - name: Home volume is fsck-clean and seeded as designed
        run: |
          python -m tools.mkdisk /tmp/home.img --home-volume
          e2fsck -fn /tmp/home.img
          dumpe2fs -h /tmp/home.img 2>/dev/null | grep -E "Filesystem volume name: +lazyhome"
          debugfs -R "stat /user" /tmp/home.img | grep -E "User: +1000 +Group: +1000"
          debugfs -R "stat /user" /tmp/home.img | grep -E "Mode: +0700"
          debugfs -R "stat /admin" /tmp/home.img | grep -E "User: +1001 +Group: +1001"
          debugfs -R "stat /admin" /tmp/home.img | grep -E "Mode: +0700"
          debugfs -R "ls -p /" /tmp/home.img | tee /tmp/home.ls
          grep -q "/user/" /tmp/home.ls
          grep -q "/admin/" /tmp/home.ls
          if grep -E "/(home|tmp)/" /tmp/home.ls; then exit 1; fi
          python -m tools.mkdisk /tmp/home4k.img --home-volume --block-size 1024 --size 40M
          e2fsck -fn /tmp/home4k.img
