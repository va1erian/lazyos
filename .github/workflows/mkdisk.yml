name: mkdisk

# Pure-Python ext2 formatter for the persistent data volume (issue #332):
# unit tests, plus `e2fsck -n` over the generated images on a host that has it.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkdisk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdisk:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # tkinter: lazygui's package __init__ imports the Tk UI even for the
      # catalog tests, and the runner image ships without it.
      - name: Install e2fsprogs and tkinter
        run: sudo apt-get install -y e2fsprogs python3-tk

      - name: Formatter and launcher tests
        run: |
          python tools/mkdisk/test_mkdisk.py -v
          python tools/mkdisk/test_seed.py -v
          python tools/lazygui/test_catalog.py

      # The default image carries the seeded /home/<user> and sticky /tmp
      # (issue #347); the variants cover the root flags, a bare volume and
      # several block sizes, including multi-group sizes.
      - name: Seeded volumes are fsck-clean
        run: |
          python -m tools.mkdisk /tmp/data.img
          e2fsck -fn /tmp/data.img
          debugfs -R "stat /tmp" /tmp/data.img | grep -E "Mode: +01777"
          debugfs -R "stat /home/alice" /tmp/data.img | grep -E "User: +1000 "
          python -m tools.mkdisk /tmp/root.img --root-mode 1777 --root-uid 1000 --root-gid 1000
          e2fsck -fn /tmp/root.img
          python -m tools.mkdisk /tmp/bare.img --no-seed --size 8M
          e2fsck -fn /tmp/bare.img
          python -m tools.mkdisk /tmp/k1.img --block-size 1024 --size 40M
          e2fsck -fn /tmp/k1.img
          python -m tools.mkdisk /tmp/big.img --size 200M
          e2fsck -fn /tmp/big.img
