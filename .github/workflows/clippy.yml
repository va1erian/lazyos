name: clippy

# Issue #124: every unsafe block in the kernel must carry its own safety
# comment (`clippy::undocumented_unsafe_blocks`). The audit that closed the
# existing gap is only durable if CI stops the next undocumented block from
# landing, so this gate denies the lint on the default (non-test) kernel build.
#
# Issue #247: the host-shared libraries are linted with `--all-targets` too, so
# test code is held to the same `-D warnings` bar as the shipped crate.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the nightly toolchain, target, and the
      # clippy component; rustup installs it on first use.
      - name: Clippy (kernel, unsafe-comment lint denied)
        run: |
          cargo clippy -p kernel --target x86_64-unknown-none \
            -Zbuild-std=core,alloc \
            -- -D clippy::undocumented_unsafe_blocks
      # Test targets are included so `#[cfg(test)]` code cannot drift past the
      # lint gate (issue #247).
      - name: Clippy (host libraries, all targets)
        run: |
          cargo clippy \
            -p libmessenger -p messenger-generated -p lazyos-crypto -p font-atlas -p confd -p timezone \
            -p virtio -p virtio-snd -p pcm -p framering -p virtio-net -p nicdrv -p netpolicy -p fuzzkit \
            --all-targets -- -D warnings
