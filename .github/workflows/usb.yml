name: usb

# USB HID (docs/usb-hid-plan.md): host tests for the xHCI and USB HID libraries
# and the harness judge, then the end-to-end harness, which boots QEMU with
# `qemu-xhci`, a USB keyboard and mouse and no i8042, types and points over QMP,
# and judges what reached `inputd`, not just the driver's serial markers; the
# hotplug run unplugs and replugs the devices over QMP.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usb-${{ github.ref }}
  cancel-in-progress: true

# F2 (docs/filesystem-plan.md): `cargo build` updates target/lazyos.img in place when it
# exists; CI is hermetic, so every image is created fresh.
env:
  LAZYOS_RESET_OS: "1"

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-cache
        with:
          key: host

      - name: USB libraries (host, includes the seeded fuzz tests)
        run: cargo test -p usbhid -p xhci -p usbpolicy -p usbmsc --features usbmsc/fuzz

      - name: Harness judge (it must fail when it should)
        run: python tools/usb/test_judge.py

  harness:
    name: harness (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # No i8042: every key and pointer record must come through `usbd`.
          - name: usb-only
            args: ""
          # PS/2 and USB side by side: one cursor, one keyboard stream.
          - name: with-ps2
            args: "--ps2"
          # U3: 200 unplug/replug cycles (a key and a button held across the
          # first), bounded DMA, nothing stuck, typing on the last keyboard.
          - name: hotplug
            args: "--hotplug 200"
          # U4: a usb-tablet (report protocol, absolute) instead of the mouse.
          - name: tablet
            args: "--tablet"
          # U5: usbd dies holding a key; init restarts it, nothing stuck.
          - name: restart
            args: "--restart"
          # U5: the same session on q35 (boot disk on virtio-blk).
          - name: q35
            args: "--machine q35 --virtio-disk"
          # H3: keyboard and mouse behind a usb-hub (full speed, route
          # string), then the hub unplugged: everything below it detaches.
          - name: hub
            args: "--hub"
          # H3: USB 1.1 devices on root ports (endpoint 0 fixed by Evaluate
          # Context, full-speed intervals).
          - name: full-speed
            args: "--full-speed"
          # H3: two xHCI controllers, keyboard and mouse on different ones.
          - name: two-controllers
            args: "--controllers 2"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/qemu

      - uses: ./.github/actions/rust-cache
        with:
          key: os-image

      - name: Boot on USB input and judge it
        run: python tools/usb/run.py ${{ matrix.args }}

      # On failure, print the evidence in the log itself: every key edge usbd
      # sent and inputd decoded, the driver's lifecycle lines, and when each
      # session step ran, so a lost or late key can be placed without the
      # artifact.
      - name: Dump the key trace and session timeline
        if: ${{ failure() }}
        run: |
          grep -anE "USBD:(KEY|XHCI|PORT|HID|HUB|READY|DETACH|CRASH|FATAL|PANIC|SLOT)|INPUTD:(KEY|READY)|INIT:RESTART|HANG:" shots/usb/serial.log || true
          python -c "import json; [print(step) for step in json.load(open('shots/usb/summary.json'))['timeline']]" || true

      - name: Upload the session
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: usb-${{ matrix.name }}
          path: shots/usb
          if-no-files-found: ignore
