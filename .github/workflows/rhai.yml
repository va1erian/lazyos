name: rhai

# Issue #319 (step R0 of the Rhai plan): the `rhai` command. Host-tests the
# bindings crate (`libs/rhai-lazy`, mock filesystem/environment) and the thin
# musl host (`rhai-host`), builds the static-musl program, embeds it in the
# image as `/system/bin/rhai`, and boots LazyOS twice: on the console (BusyBox `sh`
# runs `rhai -e`, script files, pipelines and the REPL) and in the desktop
# Terminal (the pipe-pair terminal without a pty), where the `msg` module also
# calls the real Messenger services. `python tools/rhai/run.py --desktop` runs
# the same guest checks locally in one command.
#
# The console run asserts the serial markers `RHAI:<name>:PASS|FAIL` printed by
# the commands themselves (the marker text is assembled from `$m` so the typed,
# echoed command line can never satisfy a gate). Every gate is readiness-based
# (`until`), not a fixed timeline. Optional like the other guest jobs: if the
# musl target is unavailable the build step reports nothing and the guest steps
# are skipped (`tools/rhai/build.py` exits 0); a real compile error fails.

on:
  # Also on `main`, so the caches this job saves (cargo dependencies, BusyBox)
  # are the warm set every pull request restores; a cache saved on a pull
  # request branch is visible to that branch alone.
  push:
    branches: [main]
    paths:
      - "rhai-host/**"
      - "libs/rhai-lazy/**"
      - "idl/**"
      - "tools/midlc/**"
      - "libs/messenger/**"
      - "libs/generated/**"
      - "tools/rhai/**"
      - "tools/screenshot/**"
      - "build_support/**"
      - "build.rs"
      - "kernel/src/process/linux/**"
      - ".github/workflows/rhai.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "rhai-host/**"
      - "libs/rhai-lazy/**"
      # The `msg` module is generated from the IDL and speaks the parcel codec.
      - "idl/**"
      - "tools/midlc/**"
      - "libs/messenger/**"
      - "libs/generated/**"
      - "tools/rhai/**"
      - "tools/screenshot/**"
      - "build_support/**"
      - "build.rs"
      - "kernel/src/process/linux/**"
      - ".github/workflows/rhai.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhai-${{ github.ref }}
  cancel-in-progress: true

# F2 (docs/filesystem-plan.md): `cargo build` updates target/lazyos.img in place when it
# exists; CI is hermetic, so every image is created fresh.
env:
  LAZYOS_RESET_OS: "1"

jobs:
  rhai:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/qemu
        with:
          packages: qemu-system-x86 musl-tools

      # Four workspaces with their own lockfiles and target dirs: the OS, the
      # bindings crate, the musl host and the xui apps the desktop run embeds.
      - uses: ./.github/actions/rust-cache
        with:
          key: rhai
          workspaces: |
            . -> target
            libs/rhai-lazy -> target
            rhai-host -> target
            xui-app -> target

      # The two crates are standalone workspaces (excluded from the OS
      # workspace), so each is tested and linted on its own.
      - name: Host tests and clippy (libs/rhai-lazy)
        run: |
          cargo test --manifest-path libs/rhai-lazy/Cargo.toml
          cargo clippy --manifest-path libs/rhai-lazy/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path libs/rhai-lazy/Cargo.toml --all-targets --features lazyos -- -D warnings
          cargo check --manifest-path libs/rhai-lazy/Cargo.toml --no-default-features --features no_std
          rustup target add x86_64-unknown-none
          cargo check --manifest-path libs/rhai-lazy/Cargo.toml --no-default-features --features no_std,lazyos --target x86_64-unknown-none

      - name: Host tests and clippy (rhai-host)
        run: |
          cargo test --manifest-path rhai-host/Cargo.toml
          cargo clippy --manifest-path rhai-host/Cargo.toml --all-targets -- -D warnings

      - name: Build rhai (static musl)
        id: rhai
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          python tools/rhai/build.py | tee target/rhai-build.json
          if python -c "import json,sys; sys.exit(0 if 'rhai' in json.load(open('target/rhai-build.json')) else 1)"; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            ls -l target/rhai/rhai.elf
          else
            echo "::warning::rhai unavailable; skipping the guest runs"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      # BusyBox is the system shell the console and Terminal run.
      - uses: ./.github/actions/busybox
        if: steps.rhai.outputs.built == 'true'

      # One boot, no retries: a shell that dies (`user: task N killed by`, the
      # #375 wild jump that used to be retried away here) fails the job, and
      # the kernel's fatal-fault report in serial.log says why. A failed
      # marker ends the boot at once through `--fail-on`.
      - name: Guest run on the console (commands, pipelines, REPL)
        if: steps.rhai.outputs.built == 'true'
        shell: bash
        env:
          LAZYOS_CLI: "1"
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/rhai \
            --timeout 300 --script tools/screenshot/examples/rhai_demo.json \
            --fail-on "RHAI:[a-z]+:FAIL" --fail-on "user: task [0-9]+ killed by"
          grep -a "^RHAI:" shots/rhai/serial.log | sort -u
          # Every check must have reported PASS at least once.
          test "$(grep -ac '^RHAI:[a-z]*:PASS' shots/rhai/serial.log)" -ge 25
          grep -aq '^RHAI:repl:PASS' shots/rhai/serial.log

      - name: Build the xui apps (desktop Terminal)
        if: steps.rhai.outputs.built == 'true'
        id: xui
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          python tools/xui/build.py | tee target/xui-build.json
          if python -c "import json,sys; sys.exit(0 if 'xui-term' in json.load(open('target/xui-build.json')) else 1)"; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::xui apps unavailable; skipping the desktop run"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the Terminal is autostarted so its window is never covered.
      - name: Guest run in the desktop Terminal
        if: steps.rhai.outputs.built == 'true' && steps.xui.outputs.built == 'true'
        shell: bash
        env:
          LAZYOS_DESKTOP: "1"
          LAZYOS_XUI_AUTOSTART: term
        run: |
          set -euo pipefail
          cargo build
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/rhai_desktop \
            --timeout 300 --script tools/screenshot/examples/rhai_desktop.json \
            --fail-on "TERM:(BIND|RUN|SPAWN|PANIC)"
          grep -aq "TERM:OUT:42" shots/rhai_desktop/serial.log
          grep -aq "TERM:OUT:HI" shots/rhai_desktop/serial.log
          grep -aq "TERM:OUT:123" shots/rhai_desktop/serial.log
          grep -aq "TERM:OUT:144" shots/rhai_desktop/serial.log
          grep -aq "TERM:OUT:RHAI:desktop:42" shots/rhai_desktop/serial.log

      # The `msg` module against the real services of the same desktop image
      # (docs/rhai/msg.md): the session writes a script from short lines and
      # runs it; it prints how many of its six checks passed, with the marker
      # assembled from parts so the echoed line can never satisfy the gate.
      - name: Guest run of the msg module (Messenger services)
        if: steps.rhai.outputs.built == 'true' && steps.xui.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/screenshot/qemu_session.py --image target/lazyos.img --out shots/rhai_msg \
            --timeout 300 --script tools/screenshot/examples/rhai_msg.json \
            --fail-on "TERM:(BIND|RUN|SPAWN|PANIC)" --fail-on "TERM:OUT:RHAI:msg:[0-5]$"
          grep -aq "TERM:OUT:RHAI:msg:6" shots/rhai_msg/serial.log

      - name: Verify screenshots are non-blank
        if: steps.rhai.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=(shots/rhai/*.png shots/rhai_desktop/*.png shots/rhai_msg/*.png)
          [ ${#pngs[@]} -gt 0 ] || { echo "::error::no screenshots captured"; exit 1; }
          python tools/screenshot/pngstats.py "${pngs[@]}" --min-nonblack 0.01 --min-colors 4

      - name: Upload screenshots and serial logs
        if: always() && steps.rhai.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rhai-guest
          path: |
            shots/rhai/*.png
            shots/rhai/serial.log
            shots/rhai/summary.json
            shots/rhai_desktop/*.png
            shots/rhai_desktop/serial.log
            shots/rhai_desktop/summary.json
            shots/rhai_msg/*.png
            shots/rhai_msg/serial.log
          if-no-files-found: warn
