[package]
name = "lazyrad-os"
version = "0.1.0"
edition = "2021"
publish = false
description = "LazyRAD on LazyOS: the `lrplay` player and the `lazyrad` IDE as xuid clients"

# A standalone workspace, like `xui-app` and `rhai-host`: both bins build for
# x86_64-unknown-linux-musl (static) via `tools/lazyrad/build.py` and are
# packaged as the core package os.lazy.lazyrad (tools/xui/core_packages.py), so the OS workspace
# never resolves Rhai, xui or LazyRAD.
[workspace]
resolver = "2"

[dependencies]
# One xui for the whole graph: the same revision `xui-app` pins (see its
# Cargo.toml and docs/xui-plan.md "Bumping the pinned rev"). LazyRAD's own
# workspace (va1erian/lazyrad) pins the same revision: bump them together.
# `default-features = false` keeps
# winit/softbuffer/glutin/glow/arboard/xui-gpu out of the image.
xui-core = { git = "https://github.com/va1erian/xui", rev = "6d7bb7ca98073df049b41092dc5953570ab8dc7e" }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "6d7bb7ca98073df049b41092dc5953570ab8dc7e", default-features = false }
# The LazyOS backend (xuid client), fonts, clipboardd client and the portable
# file-dialog plumbing.
xui-app = { path = "../xui-app" }
# `fcntl(O_NONBLOCK)` for the player launcher's pipes (already in the graph via
# `xui-app`).
libc = "0.2"
# Well-known paths and boot-volume names (docs/filesystem-plan.md F0); `alloc`
# for `home_of`/`app_data_dir`.
fhs = { path = "../libs/fhs", features = ["alloc"] }
# The same Messenger codec and generated stubs `xui-app` uses; the `pkgd` and
# `init` clients encode with the stubs, never by hand.
libmessenger = { path = "../libs/messenger" }
messenger-generated = { path = "../libs/generated" }
# The pre-check of File -> Make LazyOS App runs in the IDE's own process
# (`pkgstore::inspect`, the function `pkgd`'s `Inspect` runs, over the `.lzp`
# reader `pkgd` uses): `pkgd` refuses labelled callers, and the IDE is one.
lazypkg = { path = "../libs/lazypkg" }
pkgstore = { path = "../libs/pkgstore" }
# The `msg` module and the generated `sys::*` modules (Messenger from scripts,
# docs/rhai/msg.md) with the real `int 0x80` transport, registered as a LazyRAD
# script extension. Same exact Rhai pin as LazyRAD, so one Rhai links.
rhai-lazy = { path = "../libs/rhai-lazy", features = ["lazyos"] }
# The event-source callback types name Rhai's own; the exact pin LazyRAD and
# rhai-lazy use, so one Rhai links.
rhai = { version = "=1.26.1", default-features = false, features = ["std"] }
# ProTracker parsing and mixing for the `modplay` script module, and the audio
# API it plays through (the transport is `xui_app::platform::audio`).
modplay = { path = "../libs/modplay" }
audioclient = { path = "../libs/audioclient" }

# LazyRAD, from its own repository, `default-features = false` so the `desktop`
# features (winit, rfd, directories, dark-light, local time) stay off.
#
# PIN: `rev` is a va1erian/lazyrad commit whose own workspace pins the same xui
# revision as `xui-app`, so one `xui_core` links with no `[patch]`
# (`python tools/xui/bump_pin.py <xui> --lazyrad <lazyrad>` moves both). Earlier
# pins carried the designer hover fix (#99), xui layouts (#97), the Midnight
# theme (#95), xui-rich-text (#92) and `lazyos-msg` (Messenger in form
# scripts, #88; docs/lazyrad-messenger-plan.md).
# Bump `rev` on EVERY va1erian/lazyrad line below (runtime, player, ide and
# the dev-dependency packager) together, then regenerate the lockfile.
lazyrad-runtime = { git = "https://github.com/va1erian/lazyrad", rev = "9b21bd426fb36e482adefa58c81acfad38b88cdc", default-features = false }
lazyrad-ide = { git = "https://github.com/va1erian/lazyrad", rev = "9b21bd426fb36e482adefa58c81acfad38b88cdc", default-features = false }
lazyrad-packager = { git = "https://github.com/va1erian/lazyrad", rev = "9b21bd426fb36e482adefa58c81acfad38b88cdc", default-features = false }
lazyrad-player = { git = "https://github.com/va1erian/lazyrad", rev = "9b21bd426fb36e482adefa58c81acfad38b88cdc", default-features = false }
# The form document: the player's UI probe reads control rectangles from it
# (`probe`, issue #538), and the sample tests read form values back
# (`tests/modplayer.rs`). Pinned with the other LazyRAD crates.
xui-form = { git = "https://github.com/va1erian/lazyrad", rev = "9b21bd426fb36e482adefa58c81acfad38b88cdc" }

[dev-dependencies]
# `modplay::synth` builds the songs the `modplay` script tests play.
modplay = { path = "../libs/modplay", features = ["fuzz"] }

[lib]
name = "lazyrad_os"
path = "src/lib.rs"

[[bin]]
name = "lrplay"
path = "src/bin/lrplay.rs"

[[bin]]
name = "lazyrad"
path = "src/bin/lazyrad.rs"

# Embedded in the disk image and read over slow boot-time ATA: size first
# (the player is copied into every produced `.lzp`, plan D2).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Size first, except the software rasteriser: every frame is painted by
# tiny-skia through xui-canvas, and at "z" a full HiDPI repaint costs 3-4x
# more (issue #604). Only performance-critical crates get 3; keep it that way.
[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

[profile.release.package.xui-canvas]
opt-level = 3
