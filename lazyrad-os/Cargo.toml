[package]
name = "lazyrad-os"
version = "0.1.0"
edition = "2021"
publish = false
description = "LazyRAD on LazyOS: the `lrplay` player and the `lazyrad` IDE as xuid clients"

# A standalone workspace, like `xui-app` and `rhai-host`: both bins build for
# x86_64-unknown-linux-musl (static) via `tools/lazyrad/build.py` and are
# embedded in the disk image as /system/bin/lrplay and /system/bin/lazyrad, so the OS workspace
# never resolves Rhai, xui or LazyRAD.
[workspace]
resolver = "2"

[dependencies]
# One xui for the whole graph: the same revision `xui-app` pins (see its
# Cargo.toml and docs/xui-plan.md "Bumping the pinned rev"). LazyRAD's own
# workspace pins the same revision. `default-features = false` keeps
# winit/softbuffer/glutin/glow/arboard/xui-gpu out of the image.
xui-core = { git = "https://github.com/va1erian/xui", rev = "4c2a4fbb2b7420bc5f5fe77cc1ea84ad0468b7d9" }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "4c2a4fbb2b7420bc5f5fe77cc1ea84ad0468b7d9", default-features = false }
# The LazyOS backend (xuid client), fonts, clipboardd client and the portable
# file-dialog plumbing.
xui-app = { path = "../xui-app" }
# `fcntl(O_NONBLOCK)` for the player launcher's pipes (already in the graph via
# `xui-app`).
libc = "0.2"
# Well-known paths and boot-volume names (docs/filesystem-plan.md F0); `alloc`
# for `home_of`/`app_data_dir`.
fhs = { path = "../libs/fhs", features = ["alloc"] }
# The same Messenger codec and generated stubs `xui-app` uses; the `pkgd` and
# `init` clients encode with the stubs, never by hand.
libmessenger = { path = "../libs/messenger" }
messenger-generated = { path = "../libs/generated" }
# The `msg` module and the generated `sys::*` modules (Messenger from scripts,
# docs/rhai/msg.md) with the real `int 0x80` transport, registered as a LazyRAD
# script extension. Same exact Rhai pin as LazyRAD, so one Rhai links.
rhai-lazy = { path = "../libs/rhai-lazy", features = ["lazyos"] }
# The event-source callback types name Rhai's own; the exact pin LazyRAD and
# rhai-lazy use, so one Rhai links.
rhai = { version = "=1.26.1", default-features = false, features = ["std"] }
# ProTracker parsing and mixing for the `modplay` script module, and the audio
# API it plays through (the transport is `xui_app::platform::audio`).
modplay = { path = "../libs/modplay" }
audioclient = { path = "../libs/audioclient" }

# LazyRAD, from its own repository, `default-features = false` so the `desktop`
# features (winit, rfd, directories, dark-light, local time) stay off.
#
# PIN: `rev` is LazyRAD `main` at the merge of va1erian/lazyrad#88 (`lazyos-msg`:
# Messenger in form scripts, event sources, scoped extensions, host
# permissions and xui 4c2a4fb; docs/lazyrad-messenger-plan.md) on top of the
# home-data change (#86) and the packager granting `$HOME/.apps/<id>` (#87),
# the form LazyOS's F5 manifest grammar requires (filesystem F5, #509).
# Bump `rev` on EVERY va1erian/lazyrad line below (runtime, player, ide and
# the dev-dependency packager) together, then regenerate the lockfile.
lazyrad-runtime = { git = "https://github.com/va1erian/lazyrad", rev = "0043b1f5c1bd5f2b306d1932a430c2459ff829ea", default-features = false }
lazyrad-ide = { git = "https://github.com/va1erian/lazyrad", rev = "0043b1f5c1bd5f2b306d1932a430c2459ff829ea", default-features = false }
lazyrad-packager = { git = "https://github.com/va1erian/lazyrad", rev = "0043b1f5c1bd5f2b306d1932a430c2459ff829ea", default-features = false }
lazyrad-player = { git = "https://github.com/va1erian/lazyrad", rev = "0043b1f5c1bd5f2b306d1932a430c2459ff829ea", default-features = false }

[dev-dependencies]
# The `.lzp` conformance suite (tests/lzp_conformance.rs): packages built by
# LazyRAD's packager are re-opened with LazyOS's own reader. `libs/lazypkg` is
# PR #431; the packager is pinned like the other LazyRAD crates.
lazypkg = { path = "../libs/lazypkg" }
# The form values the sample tests read back (`tests/modplayer.rs`); pinned
# with the other LazyRAD crates.
xui-form = { git = "https://github.com/va1erian/lazyrad", rev = "0043b1f5c1bd5f2b306d1932a430c2459ff829ea" }
# `modplay::synth` builds the songs the `modplay` script tests play.
modplay = { path = "../libs/modplay", features = ["fuzz"] }

[lib]
name = "lazyrad_os"
path = "src/lib.rs"

[[bin]]
name = "lrplay"
path = "src/bin/lrplay.rs"

[[bin]]
name = "lazyrad"
path = "src/bin/lazyrad.rs"

# Embedded in the disk image and read over slow boot-time ATA: size first
# (the player is copied into every produced `.lzp`, plan D2).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
