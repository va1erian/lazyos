[package]
name = "nettls-crypto"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "A pure-Rust rustls crypto provider over RustCrypto crates, GPLv2-compatible throughout (no ring, no aws-lc)"

# MIT (like xui), unlike the rest of the tree, so a GPL-2.0-only program
# such as a NetSurf port can link it.
#
# Every dependency here must be available under a licence a GPL-2.0 binary
# can include (MIT, BSD, ISC, or a choice that includes one of them):
# `tools/nettls/licenses.py` checks the whole tree. That rules out ring
# (Apache-2.0 AND ISC, with OpenSSL-derived code) and aws-lc-rs.

[features]
# A P-256 ECDSA signing key for the server side of a handshake. Only the ABI
# fixture `tlsfix` (an in-memory client and server) needs it; the clients
# never sign.
server = ["p256/pkcs8"]

[dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12"] }
rustls-pki-types = { version = "1.15", default-features = false, features = ["std"] }
aead = { version = "0.5", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
chacha20poly1305 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "std"] }
ecdsa = { version = "0.16", default-features = false, features = ["verifying", "der"] }
ed25519-dalek = { version = "2", default-features = false }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
signature = { version = "2", default-features = false }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
getrandom = { version = "0.2", default-features = false }
