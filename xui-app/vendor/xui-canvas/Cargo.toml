# A vendored copy of `va1erian/xui`'s `crates/xui-canvas` at rev `5efb730`,
# with the three LazyOS additions documented in README.md (`set_default_font` /
# `add_font` / `set_default_family`, the per-line horizontal alignment offset,
# and `Surface::pixels`). `xui-app/Cargo.toml` patches the git dependency onto
# this crate so the portable `SkiaCanvas` / `Surface` and the shaper are the
# ones LazyOS's backend paints with.
#
# The upstream `winit`/GL/clipboard window backend is dropped: LazyOS drives
# its own display protocol and its Linux ABI cannot host `winit` (anonymous
# `mmap` only), so the winit/GL dependencies would only add dead weight and,
# through `wayland-sys`'s `dlib`, an unsatisfiable `-ldl` at link time.
# `xui-core` resolves to the same pinned git revision as the app's own
# dependency, so there is a single `xui_core` in the graph.
[package]
name = "xui-canvas"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-platform software-rendered backend for xui (tiny-skia)"
repository = "https://github.com/va1erian/xui"
readme = "README.md"
publish = false

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "5efb730" }
tiny-skia = "0.11"
cosmic-text = "0.19"
