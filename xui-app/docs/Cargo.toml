# The Docs app: renders Markdown on a Blitz view. A package of its own (not a
# `xui-app` binary) because Blitz is a large dependency tree the other apps do
# not need (see docs/xui-docs.md).
[package]
name = "xui-docs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Markdown viewer for LazyOS: pulldown-cmark to HTML, laid out by Blitz"

[lib]
name = "xui_docs"
path = "src/lib.rs"

[[bin]]
name = "xui-docs"
path = "src/main.rs"

[dependencies]
xui-app = { path = ".." }
# The documentation root the Open dialog starts in.
fhs = { path = "../../libs/fhs" }
xui-core = { git = "https://github.com/va1erian/xui", rev = "59c1bd433e9b174e6e7896137891d06c073e7d1c" }
# One xui revision for every crate, so a single `xui_core` links. No
# `system-fonts`: LazyOS has no fontconfig (fonts are registered at start).
webfonts = { path = "../crates/webfonts" }
xui-blitz = { git = "https://github.com/va1erian/xui", rev = "59c1bd433e9b174e6e7896137891d06c073e7d1c", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
