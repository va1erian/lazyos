# The Docs app: renders Markdown with litehtml. A package of its own (not a
# `xui-app` binary) because litehtml is C++: Cargo builds every dependency of a
# package for every target in it, so keeping the engine here means the other
# apps still build with the plain Rust toolchain. `tools/xui/build.py` builds
# this package with the zig toolchain (see docs/xui-docs.md).
[package]
name = "xui-docs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Markdown viewer for LazyOS: pulldown-cmark to HTML, laid out by litehtml"

[lib]
name = "xui_docs"
path = "src/lib.rs"

[[bin]]
name = "xui-docs"
path = "src/main.rs"

[build-dependencies]
# litehtml-sys compiles ~80 C/C++ files through cc-rs; without this feature
# it does so one at a time. Host features unify, so it applies there too.
cc = { version = "1", features = ["parallel"] }

[dependencies]
xui-app = { path = ".." }
xui-core = { git = "https://github.com/va1erian/xui", rev = "4c2a4fbb2b7420bc5f5fe77cc1ea84ad0468b7d9" }
# One xui revision for every crate, so a single `xui_core` links. `xui-litehtml`
# is an ordinary git dependency, not vendored.
xui-litehtml = { git = "https://github.com/va1erian/xui", rev = "4c2a4fbb2b7420bc5f5fe77cc1ea84ad0468b7d9" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
