# The Docs app: shows Markdown in xui's read-only Markdown view (`xui-markdown`). A package of its own
# (not a `xui-app` binary) so its document and link logic and their tests stay out of `xui-app`
# (docs/xui-docs.md).
[package]
name = "xui-docs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Markdown viewer for LazyOS, drawn by xui-markdown"

[lib]
name = "xui_docs"
path = "src/lib.rs"

[[bin]]
name = "xui-docs"
path = "src/main.rs"

[dependencies]
xui-app = { path = ".." }
# The documentation root the Open dialog starts in.
fhs = { path = "../../libs/fhs" }
xui-core = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3" }
# The read-only Markdown view: parsing, layout, scrolling, selection and links.
xui-markdown = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3" }
