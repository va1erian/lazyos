# LazyWebPlus (docs/lazywebplus.md): LazyWeb's chrome on WebKit's engine.
#
# LazyWeb (`../web`) lays pages out with Blitz and fetches them itself. This crate is its
# fork for the WebKit port: the same menu bar, toolbar, status bar, history, downloads and
# internal pages, but the page is whatever WebKit's UI process paints and the fetching is
# WebKit's NetworkProcess. It is built as a static library (`tools/webkit/app.py --plus`)
# that the C++ UI process `lazywebplus-app` (`webkit/port/app/`) links in the WebKit build
# container; `xui-webkit` (`../crates/webkit`) is the seam both windows share (the
# engine trait, the mailbox, the page view, the pure parts of the C ABI).
#
# The binary is GPL-2.0-only like LazyWeb (over WebKit's LGPL-2.1), so every crate linked
# into it must be available under a GPLv2-compatible licence: no GPL-3.0, no Apache-2.0
# alone (`python tools/nettls/licenses.py --lazywebplus` checks this crate's tree).
[package]
name = "xui-webplus"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only"
description = "LazyWebPlus: LazyWeb's chrome on the WebKit engine"

[lib]
name = "xui_webplus"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
# The app's data folder (`app_data_dir`), the Downloads and scratch folders.
fhs = { path = "../../libs/fhs", features = ["alloc"] }
# One xui revision for every crate, so a single `xui_core` links.
xui-core = { git = "https://github.com/va1erian/xui", rev = "93592fdc7540e3f3ba21cd01f05ed1d949c3b3f6" }
# The seam: the engine trait, the mailbox, the page view and the C ABI shared with the W5
# window, without that window.
xui-webkit = { path = "../crates/webkit", default-features = false }

# The compositor client, `mimed` and the notification service are LazyOS's: the platform glue
# (`src/ffi.rs`) is built for LazyOS only, everything else runs on any host.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
xui-app = { path = ".." }

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "93592fdc7540e3f3ba21cd01f05ed1d949c3b3f6", default-features = false }
