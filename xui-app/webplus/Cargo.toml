# LazyWeb+ (docs/lazywebplus.md): the browser window, a client of webd (docs/webd-plan.md P4).
#
# A menu bar, toolbar, status bar, history, downloads and internal pages; the page is one full view
# of `webd`, the session's WebKit (its `browser` profile), driven through `xui-webkit-remote`'s
# `RemoteEngine` and shown by `xui-webkit`'s page view. The bin `xui-lazywebplus` is an ordinary
# xui app built by `tools/xui/build.py` (`target/xui/xui-lazywebplus.elf`); it links no WebKit, no
# curl and no OpenSSL.
#
# Licence: the crate keeps its GPLv2-compatible declaration (the window's own code and the crates
# it pulls from the registry: `python tools/nettls/licenses.py --lazywebplus`) until a maintainer
# relicenses it (docs/webd-plan.md, open question 8). The program links LazyOS's own
# GPL-3.0-or-later crates (`xui-app`, `xui-webd-client`), so it is distributed as GPL-3.0-or-later.
[package]
name = "xui-webplus"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only OR GPL-3.0-or-later"
description = "LazyWeb+: the browser window, a client of webd"

[lib]
name = "xui_webplus"
path = "src/lib.rs"

[[bin]]
name = "xui-lazywebplus"
path = "src/main.rs"

[dependencies]
lazydownloads = { path = "../crates/downloads" }
# One xui revision for every crate, so a single `xui_core` links.
xui-core = { git = "https://github.com/va1erian/xui", rev = "71dc3b5903ac94dba00466a6d6a00d69251beeab" }
# The seam: the engine trait, the mailbox, the page view.
xui-webkit = { path = "../crates/webkit" }
# The ad blocker's converter (Adblock Plus lists to WebKit rule lists; MIT, no dependencies).
lazyadblock = { path = "../crates/adblock" }

# The compositor client, `mimed`, the notification service and webd's view are LazyOS's: the platform
# glue (`src/platform/`) is built for LazyOS only, everything else runs on any host.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
xui-app = { path = ".." }
# The settings store seam (`ConfigStore`), over which the blocker's switches live in `confd`.
xui-settings = { path = "../crates/settings" }
# The app's data folder (`app_data_dir`), the Downloads and scratch folders.
fhs = { path = "../../libs/fhs", features = ["alloc"] }
# The engine: webd's full view (`RemoteEngine` over `xui_app::platform::webd::WebdTransport`).
xui-webkit-remote = { path = "../crates/webkit-remote" }
# The view's event channel as a descriptor the window's loop parks on (`endpoint_fd`).
lazyos-sys = { path = "../../libs/lazyos-sys", features = ["std"] }

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "71dc3b5903ac94dba00466a6d6a00d69251beeab", default-features = false }
