[package]
name = "xui-settings"
version = "0.1.0"
edition = "2021"
publish = false
description = "The LazyOS Settings app core: sections, config store seam and UI (host-testable)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "bcdde8c859c017067505de082582c8fc02b3932b" }
# The theme schema and palette resolution shared with xuid, so the app never
# hand-copies the `sys/ui/*` keys or the preset colours.
uitheme = { path = "../../../libs/uitheme" }
deskmenu = { path = "../../../libs/deskmenu" }
# The keyboard layout keys (machine and per user) `inputd` and `xuid` follow.
inputmap = { path = "../../../libs/inputmap" }
confd = { path = "../../../libs/confd" }
# The zone table, civil-date maths and the taskbar clock format keys, shared
# with `timed` and `xuid`.
timezone = { path = "../../../libs/timed" }
# The account name and password rules accountsd applies, so the Accounts
# page refuses exactly what the service would.
accountdb = { path = "../../../libs/accountdb" }
# Where the image ships the Lucide licence notice the About page points to.
fhs = { path = "../../../libs/fhs" }

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "bcdde8c859c017067505de082582c8fc02b3932b", default-features = false }
