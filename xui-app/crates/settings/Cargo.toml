[package]
name = "xui-settings"
version = "0.1.0"
edition = "2021"
publish = false
description = "The LazyOS Settings app core: sections, config store seam and UI (host-testable)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "58c1a6ea1a2dc1e5bb81463ff8dba82329a4f080" }
# The theme schema and palette resolution shared with xuid, so the app never
# hand-copies the `sys/ui/*` keys or the preset colours.
uitheme = { path = "../../../libs/uitheme" }
confd = { path = "../../../libs/confd" }

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "58c1a6ea1a2dc1e5bb81463ff8dba82329a4f080", default-features = false }
