# Copied from `va1erian/xui` `crates/xui-icons` at rev `5efb730` (MIT). Kept
# so `xui-explorer`'s optional `village-icons` feature resolves; LazyOS ships
# with it off (Lucide fallback) to keep the boot image small.
[package]
name = "xui-icons"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Global Village: a 90s-flavoured, multi-colour vector icon set for xui, drawn through the portable Canvas"
repository = "https://github.com/va1erian/xui"
readme = "README.md"
publish = false
# The raster and .ico exports are for people, not for the crate: the drawn
# shapes are compiled into `src/data`.
exclude = ["assets/png", "assets/ico"]

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "5efb730" }

[dev-dependencies]
xui-canvas = { path = "../../vendor/xui-canvas" }
