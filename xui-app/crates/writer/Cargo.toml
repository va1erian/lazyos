# LazyWriter's portable core (issue #533): the app state, commands, file logic
# and widget tree, ported from xui's `crates/xui-rich-text/examples/wordpad`.
# The `writer` binary in `xui-app/src/bin/writer.rs` supplies the LazyOS side
# (backend, fonts, atomic writes, the default folder) through `Host`, so this
# crate builds and tests on the host.
[package]
name = "xui-writer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "LazyWriter, a word processor on xui-rich-text"
publish = false

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "beaec24f65e0616c54ac1987e774441009189358" }
xui-rich-text = { git = "https://github.com/va1erian/xui", rev = "beaec24f65e0616c54ac1987e774441009189358", features = ["serde"] }

# Printing (docs/printing-plan.md): sheets are painted offscreen, encoded
# as PWG Raster and handed to the print spooler (`printd`), which sends them
# over IPP.
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "beaec24f65e0616c54ac1987e774441009189358", default-features = false }
ipp = { path = "../../../libs/ipp", features = ["std"] }
raster = { path = "../../../libs/raster" }
printd = { path = "../printd" }

[dev-dependencies]
# The loopback IPP printer the print tests send to.
printd = { path = "../printd", features = ["fake"] }
