[package]
name = "lazyagent-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "LazyAgent's headless core: the Fireworks client, SSE, conversations and their store, compaction (no xui, no LazyOS crate; docs/ai-agent-plan.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
lazyhttps = { path = "../https" }

[features]
# The host CLI turns this on to trust the machine's CA store.
native-roots = ["lazyhttps/native-roots"]
# Exposes `fuzz::run` to a cargo-fuzz target.
fuzz = []

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12"] }
nettls-crypto = { path = "../../../nettls/crypto", features = ["server"] }

# The host CLI is a binary, not an example: an example would also build the
# dev-dependencies (`ring` needs a C compiler) when cross-built for the guest.
[[bin]]
name = "agent_cli"
path = "src/bin/agent_cli.rs"
