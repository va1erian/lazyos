# Copied from `va1erian/xui` `crates/xui-explorer` (MIT). The LazyOS app
# supplies its own `Platform`/`Launcher` (over the Linux shim and init.Launch)
# instead of the std desktop shell; the Global Village icon set is the opt-in
# `village-icons` feature, which `xui-app/Cargo.toml` enables for the Files app
# (the Lucide fallback is still the crate default). The `xui-core`, `xui-icons`
# and dev-only `xui-canvas` crates are git dependencies at the LazyOS-pinned
# rev. See `docs/xui-apps-integration.md`.
[package]
name = "xui-explorer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A portable spatial file explorer core for xui, with all OS specifics behind small traits"
repository = "https://github.com/va1erian/xui"
readme = "README.md"
publish = false

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "2ad12feb3eb3a961855323e9520e29131a1eff50" }
# The optional Global Village multi-colour icon set. A target that prefers the
# single-colour Lucide fallback (or cannot afford the crate) leaves the feature
# off; the LazyOS Files app turns it on.
xui-icons = { git = "https://github.com/va1erian/xui", rev = "2ad12feb3eb3a961855323e9520e29131a1eff50", optional = true }

[features]
# The std-backed `Platform` (`StdPlatform`), which the LazyOS app reuses over
# the Linux shim. The app supplies its own `Launcher` (init.Launch).
default = ["std-platform"]
std-platform = []
# Draw tiles with the multi-colour Global Village icons instead of Lucide.
# Off by default; `xui-app/Cargo.toml` enables it for the LazyOS Files app.
village-icons = ["dep:xui-icons"]

[dev-dependencies]
# Offscreen rendering for the crate's headless tests.
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "2ad12feb3eb3a961855323e9520e29131a1eff50", default-features = false }
# The resizable offscreen backend the window-resize tests drive.
xui-app-testkit = { path = "../testkit" }
