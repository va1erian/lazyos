# The WebKit browser's window (docs/webkit-port-plan.md W5): the toolbar, the
# address field, the page view that shows the bitmap WebKit paints and forwards
# the mouse and keyboard to it, and the C ABI the WebKit UI process
# (`webkit/port/app`, C++) calls. Built as a static library: the UI process is a
# C++ program linked by zig with WebKit's own static libraries and this one
# (`tools/webkit/app.py`); the window logic stays portable and host-tested
# against a recording engine.
#
# The C++ side is LGPL-2.1 WebKit and Apache-2.0 OpenSSL; this crate is GPL-3.0-or-later like the
# rest of the tree, and also GPL-2.0-only: LazyWeb+'s window (`xui-app/webplus`, which links this
# crate without its W5 window) keeps LazyWeb's GPLv2-compatible rule (docs/lazywebplus.md).
[package]
name = "xui-webkit"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only OR GPL-3.0-or-later"
description = "WebKit's window for LazyOS: chrome, page view and the UI-process C ABI"

[lib]
name = "xui_webkit"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
default = ["window"]
# The W5 window (`os.lazy.webkit`): toolbar, address field, status line, and the C ABI functions
# that decide for it. LazyWebPlus links this crate without it and defines those functions itself.
window = []

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "e9d4ede3ce541a4b8017fa075dc43a0629c701da" }

# The compositor-client backend (`LazyOSBackend`) is only used by the C ABI,
# which is built for LazyOS only.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
xui-app = { path = "../.." }
# The native syscall gate, for the quota read (`lzw_ui_user_memory`).
lazyos-sys = { path = "../../../libs/lazyos-sys", features = ["std"] }

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "e9d4ede3ce541a4b8017fa075dc43a0629c701da", default-features = false }
