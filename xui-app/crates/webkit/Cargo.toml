# The seam between WebKit and a LazyOS window (docs/lazyweb.md, docs/webd.md): the engine trait,
# the mailbox, the page view that shows the picture WebKit paints and forwards the mouse and keyboard
# to it. WebKit runs in `webd`, another process (`xui-webkit-remote` drives it); this crate links none
# of it and stays portable, host-tested against a recording engine.
#
# Licence: GPL-3.0-or-later like the rest of the tree, and also GPL-2.0-only: LazyWeb's window
# (`xui-app/lazyweb`) keeps its GPLv2-compatible declaration until a maintainer relicenses it
# (docs/webd-plan.md, open question 8).
[package]
name = "xui-webkit"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only OR GPL-3.0-or-later"
description = "The seam between WebKit and a LazyOS window: page view, mailbox, engine trait"

[lib]
name = "xui_webkit"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
lazydamage = { path = "../damage" }
xui-core = { git = "https://github.com/va1erian/xui", rev = "d77768341745d8e8ed1779ae3677c00a1b74b3aa" }

# The direct painter of the page view (`xui_app::backend::direct`) is LazyOS's.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
xui-app = { path = "../.." }

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "d77768341745d8e8ed1779ae3677c00a1b74b3aa", default-features = false }
