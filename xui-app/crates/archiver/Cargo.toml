# The Archiver's app core (docs/archiver-plan.md): the folder view over an
# archive's entries, commands, dialogs, the worker-thread job runner and the
# drag bridge. The `xui-archiver` binary in `xui-app/src/bin/archiver.rs`
# supplies the LazyOS platform through `Host`, so this crate builds and is
# tested on the host.
[package]
name = "xui-archiver"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Archiver, a 7-Zip-style archive manager for xui"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3" }
lazyarc = { path = "../archive" }
xui-work = { path = "../work" }
xui-host = { path = "../host" }


[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3", default-features = false }
