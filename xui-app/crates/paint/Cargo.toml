# Copied from `va1erian/xui` `crates/xui-paint` (library only, MIT). The
# upstream `xpaint` binary is replaced by the `xui-paint` binary in
# `xui-app/src/bin/paint.rs`, which drives the same `PaintApp` on the LazyOS
# backend; the LazyOS canonical library never names a backend. `xui-core` and
# the dev-only `xui-canvas` are git dependencies at the LazyOS-pinned rev.
[package]
name = "xui-paint"
version = "0.0.0"
edition = "2024"
publish = false
description = "A minimal MS-Paint-style doodler built on xui, portable to a toy OS."

[lib]
name = "xui_paint"
path = "src/lib.rs"

[features]
# Optional filesystem persistence; off by default so nothing touches disk.
fs = []
# The real text rasterizer (`cosmic-text` + `swash`, the stack xui-canvas
# draws with). Off by default: the model's `TextRasterizer` trait, `TextEdit`
# and the caret geometry need none of it, so a host that never rasterizes text
# pays nothing. The LazyOS binary turns it on when the Text tool is wired.
text = ["dep:cosmic-text"]

[dependencies]
# Antialiased coverage for shapes: the 0.11 line xui-canvas (and so the
# lockfile) already carries, with only `std` (no PNG codec, no SIMD).
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
cosmic-text = { version = "0.19", optional = true, default-features = false, features = ["std", "swash"] }
xui-core = { git = "https://github.com/va1erian/xui", rev = "016e9b79af4ee4d00db0659749fa6d599cbc1ea1" }

[dev-dependencies]
# Offscreen rendering for the crate's snapshot tests.
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "016e9b79af4ee4d00db0659749fa6d599cbc1ea1", default-features = false }
# The resizable offscreen backend the window-resize tests drive.
xui-app-testkit = { path = "../testkit" }
