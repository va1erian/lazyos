# Copied from `va1erian/xui` `crates/xui-code-editor` (MIT), library only. The
# upstream notepad example is promoted to the `xui-editor` binary in
# `xui-app/src/bin/editor.rs` + `xui-app/src/bin/editor/`. `xui-core` and
# `xui-canvas` are git dependencies at the LazyOS-pinned rev.
[package]
name = "xui-code-editor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A reusable xui code-editor widget: rope buffer, monospace view, pluggable highlighting"
repository = "https://github.com/va1erian/xui"
readme = "README.md"
publish = false

[dependencies]
regex = "1"
ropey = "1"
xui-core = { git = "https://github.com/va1erian/xui", rev = "ae93b9d11a3860d1982aed4e49d9f703aa0fa6ab" }

[features]
# The hand-written, line-incremental Rhai lexer (`lexer::RhaiHighlighter`).
# It is off by default, so a plain-text editor carries no language rules.
rhai-syntax = []

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "ae93b9d11a3860d1982aed4e49d9f703aa0fa6ab", default-features = false }
# The resizable offscreen backend the window-resize tests drive.
xui-app-testkit = { path = "../testkit" }
# Rhai's own tokenizer, the oracle the hand-written lexer's tests compare token
# boundaries against. The lexer itself never uses it, so `rhai-syntax` builds
# carry no Rhai crate either.
rhai = { version = "1", features = ["internals"] }
