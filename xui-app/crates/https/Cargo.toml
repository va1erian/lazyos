[package]
name = "lazyhttps"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "HTTPS for LazySky and LazyAgent: rustls over nettls-crypto, a ureq connector, a resolver that stays on the calling thread, capped blocking requests and a streaming path (no xui, no LazyOS crate)"

[dependencies]
# TLS 1.2/1.3 with default features off: they pull aws-lc-rs, and neither it
# nor ring has a GPLv2-compatible licence. The crypto is `nettls-crypto`
# (the stack and pins LazyWeb had, now removed).
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12"] }
nettls-crypto = { path = "../../../nettls/crypto" }
rustls-pki-types = { version = "1.15", features = ["std"] }
# Blocking HTTP/1.1 without its own TLS, roots or gzip: `tls` is the only TLS
# path.
ureq = { version = "=3.4.2", default-features = false }
# The host's own trust store, for desktop front ends only.
rustls-native-certs = { version = "0.8", optional = true }

[features]
# The desktop examples turn this on; LazyOS images never link it.
native-roots = ["dep:rustls-native-certs"]

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12"] }
# A throwaway CA and server certificate for the HTTPS tests.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
# The TLS test server signs with the provider's P-256 key support.
nettls-crypto = { path = "../../../nettls/crypto", features = ["server"] }
