[package]
name = "xui-confd-editor"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Config app core: a registry-style confd tree editor (host-testable)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "112b411c0e0889e1757da9e09481c8e9c5acca98" }
# Path validation, the size limits and the typed `Value` are the service's own
# contract, reused client-side so the editor never re-implements them.
confd = { path = "../../../libs/confd" }

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "112b411c0e0889e1757da9e09481c8e9c5acca98", default-features = false }
