# What a web page's notification becomes before it reaches the shell, and the limits that keep one site or
# one client from using up the allowance of toasts (docs/lazywebplus.md "Notifications", docs/webd.md):
# the toast's title is the site, a host too long for it keeps its END, the page's words are cleaned, a site
# has a few live toasts and a slow pace. Std only, host-tested. LazyWeb+'s window (`xui-webplus`, as
# `xui_webplus::notify::{origin, live}`) and webd's service (`xui-webd`, per client) use the same rules.
[package]
name = "lazywebnotify"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only OR GPL-3.0-or-later"
description = "A web page's notification as a toast: origin, cleaned words, and per-site and per-client limits"

[lib]
name = "lazywebnotify"
path = "src/lib.rs"
