[package]
name = "app-icons"
version = "0.1.0"
edition = "2021"
publish = false
description = "Renders every packaged app's icons/app-{16,32,128}.png from the xui icon sets (host tool)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "71dc3b5903ac94dba00466a6d6a00d69251beeab" }
# The same rev and features as the desktop's launchers, so a package icon and
# the shell's built-in fallback are the same picture.
xui-icons = { git = "https://github.com/va1erian/xui", rev = "71dc3b5903ac94dba00466a6d6a00d69251beeab" }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "71dc3b5903ac94dba00466a6d6a00d69251beeab", default-features = false }
