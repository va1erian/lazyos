[package]
name = "app-icons"
version = "0.1.0"
edition = "2021"
publish = false
description = "Renders every packaged app's icons/app-{16,32,128}.png from the xui icon sets (host tool)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "281dc178b9393cb937491a1c2805cafe0c45952e" }
# The same rev and features as the desktop's launchers, so a package icon and
# the shell's built-in fallback are the same picture.
xui-icons = { git = "https://github.com/va1erian/xui", rev = "281dc178b9393cb937491a1c2805cafe0c45952e" }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "281dc178b9393cb937491a1c2805cafe0c45952e", default-features = false }
