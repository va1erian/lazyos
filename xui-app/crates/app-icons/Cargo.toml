[package]
name = "app-icons"
version = "0.1.0"
edition = "2021"
publish = false
description = "Renders every packaged app's icons/app-{16,32,128}.png from the xui icon sets (host tool)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "b345b1565b74d45783b0de877516fd96d3c33964" }
# The same rev and features as the desktop's launchers, so a package icon and
# the shell's built-in fallback are the same picture.
xui-icons = { git = "https://github.com/va1erian/xui", rev = "b345b1565b74d45783b0de877516fd96d3c33964" }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "b345b1565b74d45783b0de877516fd96d3c33964", default-features = false }
