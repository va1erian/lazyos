[package]
name = "app-icons"
version = "0.1.0"
edition = "2021"
publish = false
description = "Renders every packaged app's icons/app-{16,32,128}.png from the xui icon sets (host tool)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "112b411c0e0889e1757da9e09481c8e9c5acca98" }
# The same rev and features as the desktop's launchers, so a package icon and
# the shell's built-in fallback are the same picture.
xui-icons = { git = "https://github.com/va1erian/xui", rev = "112b411c0e0889e1757da9e09481c8e9c5acca98" }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "112b411c0e0889e1757da9e09481c8e9c5acca98", default-features = false }
