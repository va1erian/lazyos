[package]
name = "app-icons"
version = "0.1.0"
edition = "2021"
publish = false
description = "Renders every packaged app's icons/app-{16,32,128}.png from the xui icon sets (host tool)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "e50e69d64c0b851b89c85b06e3d8f5df891a916a" }
# The same rev and features as the desktop's launchers, so a package icon and
# the shell's built-in fallback are the same picture.
xui-icons = { git = "https://github.com/va1erian/xui", rev = "e50e69d64c0b851b89c85b06e3d8f5df891a916a" }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "e50e69d64c0b851b89c85b06e3d8f5df891a916a", default-features = false }
