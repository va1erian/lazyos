[package]
name = "app-icons"
version = "0.1.0"
edition = "2021"
publish = false
description = "Renders every packaged app's icons/app-{16,32,128}.png from the xui icon sets (host tool)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "016e9b79af4ee4d00db0659749fa6d599cbc1ea1" }
# The same rev and features as the desktop's launchers, so a package icon and
# the shell's built-in fallback are the same picture.
xui-icons = { git = "https://github.com/va1erian/xui", rev = "016e9b79af4ee4d00db0659749fa6d599cbc1ea1" }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "016e9b79af4ee4d00db0659749fa6d599cbc1ea1", default-features = false }
