[package]
name = "xui-about"
version = "0.1.0"
edition = "2021"
publish = false
description = "About LazyOS: a real-time software 3D renderer and its xui window (portable, host-testable)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "c90f5568dedac41c99dcec106ada26bfb061e548" }
# Only for the `desktop` runner: xui's winit backend, so the same app runs
# as a window on Windows, Linux and macOS. LazyOS builds never turn it on.
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "c90f5568dedac41c99dcec106ada26bfb061e548", default-features = false, optional = true }

[features]
# `cargo run --release -p xui-about --example about --features desktop`
desktop = ["dep:xui-canvas", "xui-canvas/winit-backend"]

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "c90f5568dedac41c99dcec106ada26bfb061e548", default-features = false }

[[example]]
name = "about"
required-features = ["desktop"]
