[package]
name = "lazyagent-ui"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "LazyAgent's portable xui window (docs/ai-agent-plan.md): host-tested offscreen, run on LazyOS by `xui-agent` and on a desktop by the `desktop` example"

[dependencies]
lazyagent-core = { path = "../agent-core" }
xui-core = { git = "https://github.com/va1erian/xui", rev = "016e9b79af4ee4d00db0659749fa6d599cbc1ea1" }
# Markdown to blocks on the layout thread (MIT; no raw HTML is ever drawn).
pulldown-cmark = { version = "0.13", default-features = false }
# Only for the `desktop` runner: xui's winit backend, so the same app runs
# as a window on Windows, Linux and macOS. LazyOS builds never turn it on.
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "016e9b79af4ee4d00db0659749fa6d599cbc1ea1", default-features = false, optional = true }

[features]
# `cargo run --release -p lazyagent-ui --example desktop --features desktop`
desktop = ["dep:xui-canvas", "xui-canvas/winit-backend", "lazyagent-core/native-roots"]

[dev-dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "016e9b79af4ee4d00db0659749fa6d599cbc1ea1", default-features = false }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12"] }
nettls-crypto = { path = "../../../nettls/crypto", features = ["server"] }

[[example]]
name = "desktop"
required-features = ["desktop"]
