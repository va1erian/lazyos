[package]
name = "wifitray"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Network Status applet's Wi-Fi half as pure functions: which icon and tooltip a connection state gets, the icon's pixels, and the menu of networks (docs/tray-plan.md, docs/architecture/wifi.md)"

# Pure and host-tested: no clock, no syscalls, no xui. The applet
# (`src/bin/netstatus.rs`) reads `wlanmd` and the topics and feeds a [`Link`]
# and a list of networks in; the tray item comes out.
[dependencies]
# The wire types of a tray item (icon, menu rows), generated by midlc.
trayclient = { path = "../../../libs/trayclient" }
