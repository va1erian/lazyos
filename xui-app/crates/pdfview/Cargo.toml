# The PDF Viewer's app core (docs/pdf-reader-plan.md): the page layout, the
# tile cache, the render threads, the page view and the window. The
# `xui-pdf` binary in `xui-app/src/bin/pdf.rs` supplies the LazyOS platform
# through `xui_host::AppHost`, so this crate builds and is tested on the host.
[package]
name = "xui-pdfview"
version = "0.1.0"
edition = "2021"
publish = false
description = "PDF Viewer, a PDF reader for xui"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3" }
lazypdf = { path = "../pdf" }
xui-work = { path = "../work" }
xui-host = { path = "../host" }

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3", default-features = false }
