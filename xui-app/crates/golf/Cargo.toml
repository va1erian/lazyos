[package]
name = "xui-golf"
version = "0.1.0"
edition = "2021"
publish = false
description = "LazyGolf: a procedural golf course generator, a mid-90s software renderer and its xui window (portable, host-testable)"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "51bded370a5174ab43a33be56991807ae5b2be93" }
# Only for the `desktop` runner: xui's winit backend, so the same app runs
# as a window on Windows, Linux and macOS. LazyOS builds never turn it on.
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "51bded370a5174ab43a33be56991807ae5b2be93", default-features = false, optional = true }

[features]
# `cargo run --release -p xui-golf --example golf --features desktop`
desktop = ["dep:xui-canvas", "xui-canvas/winit-backend"]

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "51bded370a5174ab43a33be56991807ae5b2be93", default-features = false }

[[example]]
name = "golf"
required-features = ["desktop"]
