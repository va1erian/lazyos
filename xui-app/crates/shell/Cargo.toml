[package]
name = "lazyshell"
version = "0.1.0"
edition = "2021"
publish = false
description = "LazyShell's pure models (taskbar, start menu, desktop launchers, clock) with headless host tests (issue #157)"

# Pure logic only: no xui, no syscalls. The `xui-shell` binary
# (`xui-app/src/bin/lazyshell.rs`) feeds these models from the compositor,
# `init`, `confd` and `timed`, and paints them.
[dependencies]
# The `sys/ui/menu` schema shared with the Settings app; the desktop launchers
# (`sys/ui/desktop`) use the same line format.
deskmenu = { path = "../../../libs/deskmenu" }
confd = { path = "../../../libs/confd" }
# The zone table and clock text `xuid`'s clock used (`libs/timed`).
timezone = { path = "../../../libs/timed" }
# The `os.lazy.shell.tray.v1` request types the tray model validates.
messenger-generated = { path = "../../../libs/generated" }

[dev-dependencies]
# Seeded fuzz over set/update/clear/resident sequences (`tray::fuzz`).
fuzzkit = { path = "../../../libs/fuzzkit" }
