# The Video Player's window (docs/video-player-plan.md): the picture view,
# the transport controls and the app over `lazyvideo`. The `xui-video`
# binary in `xui-app/src/bin/video.rs` supplies the LazyOS platform through
# `xui_host::AppHost`, so this crate builds and is tested on the host.
[package]
name = "xui-videoview"
version = "0.1.0"
edition = "2021"
publish = false
description = "Video Player, a video player for xui"

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3" }
lazyvideo = { path = "../video" }
xui-host = { path = "../host" }

[dev-dependencies]
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3", default-features = false }
