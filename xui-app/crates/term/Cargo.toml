[package]
name = "lazyterm"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Terminal's portable engine: escape-sequence parser, screen, cursor and modes (docs/terminal-plan.md)"

[dependencies]
# Alacritty's escape-sequence state machine (MIT/Apache-2.0).
vte = { version = "0.15", default-features = false }
# Terminal cell widths (CJK and emoji take two cells).
unicode-width = "0.2"
# Font tables: family names, styles and glyph advances (to offer only the
# monospace families whose advances match).
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[features]
# Exposes `lazyterm::fuzz::run` to a cargo-fuzz target.
fuzz = []

[dev-dependencies]
# The shipped terminfo entry is checked against what the engine does and the
# keys it sends (`src/tests_terminfo.rs`).
terminfo = { path = "../../../libs/terminfo" }
