# LazyWeb: a core LazyOS app, packaged by `tools/xui/build.py` (issue #509).
#
# The web browser, on the NetSurf engine (docs/lazyweb.md). NetSurf is
# GPL-2.0-only, so `bin/lazyweb.elf` is too. It is not checked in: the build
# copies the built xui app (`target/xui/xui-lazyweb.elf`) into a scratch copy
# of this tree. `version` is replaced by the workspace version and `autostart`
# is set from `LAZYOS_XUI_AUTOSTART`. Only a desktop image with the network
# stack ships it (`LAZYOS_LAZYWEB=1`, `python tools/run_demo.py --lazyweb`).

[app]
name = "LazyWeb"
system_name = "os.lazy.lazyweb"
author = "LazyOS"
version = "0.1.0"
description = "Browse the web: HTML, CSS and images over HTTP and HTTPS (NetSurf)"
category = "internet"

[entry]
binary = "bin/lazyweb.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[permissions]
# Provisional, modelled on Net Tools: the window, `netd`'s stack interface
# (status, `Resolve`) and sockets (plain `std::net`/musl, the `outbound`
# network permission). Names resolve through musl and `/etc/resolv.conf`,
# which may make `os.lazy.net.stack.v1` unnecessary: derive the final list
# from a run under its label (`LAZYOS_LABEL_TRACE=1`, docs/packages.md).
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.input.v1",
    "os.lazy.net.stack.v1",
]
network = ["outbound"]
