# LazyWeb+: a core LazyOS app, packaged by `tools/xui/core_packages.py` (docs/lazywebplus.md).
#
# LazyWeb's browser window on the WebKit engine (WebKit2 ported, docs/webkit-port-plan.md): the
# same menu bar, toolbar, status bar, history and downloads as LazyWeb, with a real engine
# (JavaScript, forms, the modern web) in place of Blitz. One static program (`lazywebplus-app`,
# about 108 MB: ICU's data is inside, and LazyOS loads a program whole into RAM) that starts
# `/system/bin/webprocess` and `/system/bin/networkprocess`, which a `LAZYOS_LAZYWEBPLUS=1` image
# ships beside it. The build copies the built program (`target/xui/xui-lazywebplus.elf`, from
# `python tools/webkit/app.py --plus`) into a scratch copy of this tree; `version` is replaced by
# the workspace version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`. Only a desktop image
# with the network stack ships it (`LAZYOS_LAZYWEBPLUS=1`, `python tools/run_demo.py --lazywebplus`).
# LazyWeb stays the browser every image ships. The window is declared GPL-2.0-only OR
# GPL-3.0-or-later (the program links OpenSSL, Apache-2.0, through WebKit's curl: docs/lazywebplus.md).

[app]
name = "LazyWeb+"
system_name = "os.lazy.lazywebplus"
author = "LazyOS"
version = "0.1.0"
description = "Browse the web with WebKit: JavaScript, HTML, CSS and images over HTTP and HTTPS. The page process is sandboxed: it reads only fonts, has no network, no access to your files and no windows of its own. The network process may reach the network, keep cookies in your LazyWeb+ profile folder (.apps/os.lazy.lazywebplus) and save downloads to your Downloads folder"
category = "internet"

[entry]
binary = "bin/lazywebplus.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

# Web links other apps open (Mail, Files, the Terminal) come here when this is the browser
# `mimed` picks for the type (a `user/<uid>/mimed/default/<type>` setting chooses between this and
# LazyWeb, which registers the same types). Local HTML files open here too.
[[mime]]
type = "x-scheme-handler/http"
verbs = ["open"]

[[mime]]
type = "x-scheme-handler/https"
verbs = ["open"]

[[mime]]
type = "text/html"
verbs = ["open"]

[permissions]
# Derived from a run under `LAZYOS_LABEL_TRACE=1` (`python tools/webplus/run.py --label-trace`,
# docs/packages.md): the window, its keyboard and pointer, the pointer shape, `mimed` for the
# links and files it hands on, and the notification service for the download toasts and the toasts
# of the pages the person allowed (the notification calls are made from the first thread, which the
# shell names an app by, and `Listen` carries a click back). Sockets are
# plain musl ones (the `outbound` network permission) and names resolve through
# `/etc/resolv.conf`, so `os.lazy.net.stack.v1` is not needed. The UI process never fetches
# anything itself; `network` and the reads below are listed because a child label may hold no more
# than the app's own (the two `[processes.*]` tables), and the kernel judges the UI process by the
# window's needs only for what it has not confined.
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.display.cursor.v1",
    "os.lazy.input.v1",
    "os.lazy.mimed.v1",
    "os.lazy.notify.v1",
]
network = ["outbound"]
# What persists (cookies, site storage, the history) is kept below the app's own per-user folder,
# and downloads go to the user's Downloads folder; nothing else is written. The reads are the union
# of what the two processes below read.
files = [
    "write:$HOME/.apps/os.lazy.lazywebplus",
    "write:$HOME/Downloads",
    "read:/system/share/fonts",
    "read:/system/etc/fonts",
    "read:/tmp/fontconfig",
    "read:/etc/resolv.conf",
    "read:/etc/hosts",
    "read:/etc/ssl/certs/ca-certificates.crt",
]

# One process per page, running whatever the page says with the JIT on. It is the process a page's
# exploit lands in, so it holds nothing: its image and the IPC socket it inherits are all it starts
# with, and only the font files, the font configuration and the font cache directory may be read.
# No Messenger interface, no network, no `$HOME`, no program to start (docs/architecture/
# process-sandbox.md).
[processes.webprocess]
program = "/system/bin/webprocess"
interfaces = []
network = []
files = [
    "read:/system/share/fonts",
    "read:/system/etc/fonts",
    "read:/tmp/fontconfig",
]

# The one process that fetches. It reads the resolver, the host table and the CA bundle, opens
# outbound sockets, keeps the cookie jar and site storage in the profile folder the UI process made,
# and writes a download's `.part` file in the Downloads folder (the window renames it when done).
[processes.networkprocess]
program = "/system/bin/networkprocess"
interfaces = []
network = ["outbound"]
files = [
    "read:/etc/resolv.conf",
    "read:/etc/hosts",
    "read:/etc/ssl/certs/ca-certificates.crt",
    "write:$HOME/.apps/os.lazy.lazywebplus",
    "write:$HOME/Downloads",
]
