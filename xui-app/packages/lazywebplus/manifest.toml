# LazyWeb+: a core LazyOS app, packaged by `tools/xui/core_packages.py` (docs/lazywebplus.md).
#
# The web browser: a menu bar, toolbar, status bar, history, downloads and an ad blocker around a
# page of WebKit (JavaScript, forms, the modern web). Since docs/webd-plan.md P4 it is a client of
# `webd`, the session's WebKit (`os.lazy.webd`, every desktop): one full view of webd's `browser`
# profile, made through `os.lazy.webd.browser.v1`. This program links no WebKit: webd owns the page
# and network processes. The build copies the built xui app (`target/xui/xui-lazywebplus.elf`, from
# `python tools/xui/build.py`) into a scratch copy of this tree; `version` is replaced by the
# workspace version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`. Only a desktop image with
# the network stack and webd ships it (`LAZYOS_LAZYWEBPLUS=1`, `python tools/run_demo.py
# --lazywebplus`).

[app]
name = "LazyWeb+"
system_name = "os.lazy.lazywebplus"
author = "LazyOS"
version = "0.1.0"
description = "Browse the web with WebKit: JavaScript, HTML, CSS and images over HTTP and HTTPS, with a built-in ad blocker. The pages run in the system's web engine (webd) with your browsing profile: its cookies and site data, and downloads saved to your Downloads folder. LazyWeb+ keeps your history and notification choices in its own folder (.apps/os.lazy.lazywebplus). The ad blocker's filter lists are downloaded by a separate process that may reach the network and write only the lists folder of that folder"
category = "internet"

[entry]
binary = "bin/lazywebplus.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

# Web links other apps open (Mail, Files, the Terminal) come here when this is the browser
# `mimed` picks for the type (a `user/<uid>/mimed/default/<type>` setting chooses between this and
# any other browser that registers the same types). Local HTML files open here too.
[[mime]]
type = "x-scheme-handler/http"
verbs = ["open"]

[[mime]]
type = "x-scheme-handler/https"
verbs = ["open"]

[[mime]]
type = "text/html"
verbs = ["open"]

[permissions]
# The display, pointer shapes and input every window needs; `mimed` for the links and files handed
# on; the shell's toasts (downloads, and the pages' notifications, posted by the browser so a click
# brings its window back); `confd` for the ad blocker's switches (`user/<uid>/lazywebplus/blocker/`);
# the clipboard (a page's Copy); and webd's full view: every call goes through
# `os.lazy.webd.view.v1`, the view is made through the browser scope `os.lazy.webd.browser.v1`
# (the `browser` profile, downloads, content blocking).
# Derived from runs under `LAZYOS_LABEL_TRACE=1` (`python tools/webplus/run.py --label-trace`, and the
# notification and hang harnesses): no `LABEL:DENY` for `app:os.lazy.lazywebplus`.
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.display.cursor.v1",
    "os.lazy.input.v1",
    "os.lazy.mimed.v1",
    "os.lazy.notify.v1",
    "os.lazy.confd.v1",
    "os.lazy.clipboard.v1",
    "os.lazy.webd.view.v1",
    "os.lazy.webd.browser.v1",
]
# Only for the list updater below: a child label holds at most its app's permissions.
network = ["outbound"]
files = [
    # History, notification choices, the blocker's lists and the "page data in memory" switch.
    "write:$HOME/.apps/os.lazy.lazywebplus",
    # The size of a finished download, and opening it (webd writes the files).
    "read:$HOME/Downloads",
    # The list updater's (below).
    "read:/etc/resolv.conf",
    "read:/etc/hosts",
    "read:/etc/ssl/certs/ca-certificates.crt",
]

# The ad blocker's list updates (issue #845): `curl`, started by the browser, under a label of its
# own that may reach the network and write only the lists folder (the lists are the browser's;
# webd compiles what the browser gives it, `BlockingCompile`).
[processes.listupdate]
program = "/system/bin/curl"
interfaces = []
network = ["outbound"]
files = [
    "read:/etc/resolv.conf",
    "read:/etc/hosts",
    "read:/etc/ssl/certs/ca-certificates.crt",
    "write:$HOME/.apps/os.lazy.lazywebplus/lists",
]
