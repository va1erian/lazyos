# LazyWeb+: a core LazyOS app, packaged by `tools/xui/core_packages.py` (docs/lazywebplus.md).
#
# LazyWeb's browser window on the WebKit engine (WebKit2 ported, docs/webkit-port-plan.md): the
# same menu bar, toolbar, status bar, history and downloads as LazyWeb, with a real engine
# (JavaScript, forms, the modern web) in place of Blitz. One static program (`lazywebplus-app`,
# about 108 MB: ICU's data is inside, and LazyOS loads a program whole into RAM) that starts
# `/system/bin/webprocess` and `/system/bin/networkprocess`, which a `LAZYOS_LAZYWEBPLUS=1` image
# ships beside it. The build copies the built program (`target/xui/xui-lazywebplus.elf`, from
# `python tools/webkit/app.py --plus`) into a scratch copy of this tree; `version` is replaced by
# the workspace version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`. Only a desktop image
# with the network stack ships it (`LAZYOS_LAZYWEBPLUS=1`, `python tools/run_demo.py --lazywebplus`).
# LazyWeb stays the browser every image ships. The window is declared GPL-2.0-only OR
# GPL-3.0-or-later (the program links OpenSSL, Apache-2.0, through WebKit's curl: docs/lazywebplus.md).

[app]
name = "LazyWeb+"
system_name = "os.lazy.lazywebplus"
author = "LazyOS"
version = "0.1.0"
description = "Browse the web with WebKit: JavaScript, HTML, CSS and images over HTTP and HTTPS. Not sandboxed yet: the page process runs with this app's display, input, network and file access as you"
category = "internet"

[entry]
binary = "bin/lazywebplus.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

# Web links other apps open (Mail, Files, the Terminal) come here when this is the browser
# `mimed` picks for the type (a `user/<uid>/mimed/default/<type>` setting chooses between this and
# LazyWeb, which registers the same types). Local HTML files open here too.
[[mime]]
type = "x-scheme-handler/http"
verbs = ["open"]

[[mime]]
type = "x-scheme-handler/https"
verbs = ["open"]

[[mime]]
type = "text/html"
verbs = ["open"]

[permissions]
# Derived from a run under `LAZYOS_LABEL_TRACE=1` (`python tools/webplus/run.py --label-trace`,
# docs/packages.md): the window, its keyboard and pointer, the pointer shape, `mimed` for the
# links and files it hands on, and the notification service for the download toasts. Sockets are
# plain musl ones (the `outbound` network permission) and names resolve through
# `/etc/resolv.conf`, so `os.lazy.net.stack.v1` is not needed. WebProcess and NetworkProcess are
# children of the app and run under its label: the profile (cookies, site storage) lives in the
# app's own folder, downloads go to the user's Downloads.
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.display.cursor.v1",
    "os.lazy.input.v1",
    "os.lazy.mimed.v1",
    "os.lazy.notify.v1",
]
network = ["outbound"]
files = ["write:$HOME/.apps/os.lazy.lazywebplus", "write:$HOME/Downloads"]
