# LazyWriter: a core LazyOS app, packaged by `tools/xui/build.py` (issue #533).
#
# `bin/writer.elf` is not checked in: the build copies the built xui app
# (cargo bin `writer`, `target/xui/xui-writer.elf`) into a scratch copy of this
# tree. `version` is replaced by the workspace version and `autostart` is set
# from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "LazyWriter"
system_name = "os.lazy.writer"
author = "LazyOS"
version = "0.1.0"
description = "A word processor"
category = "office"

[entry]
binary = "bin/writer.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

# Its own documents (`.lzw`; `mimed` maps the extension). Plain text and
# Markdown stay with the Editor and Docs: LazyWriter opens `.txt` only from its
# Open dialog and exports Markdown, it does not register for them.
[[mime]]
type = "application/x-lazywriter"
verbs = ["open", "edit"]

[permissions]
# Derived from runs of the app under its label (`LAZYOS_LABEL_TRACE=1`, which
# prints every refused call); see docs/packages.md, core packages. `confd`
# keeps the last printer (`user/<uid>/writer/printer`); printing to an IPP
# printer (plain `std::net`, docs/printing-plan.md) is the `outbound` network
# permission.
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.input.v1",
    "os.lazy.clipboard.v1",
    "os.lazy.confd.v1",
]
network = ["outbound"]
