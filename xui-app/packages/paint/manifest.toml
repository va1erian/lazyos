# Paint: a core LazyOS app, packaged by `tools/xui/build.py` (issue #509).
#
# `bin/paint.elf` is not checked in: the build copies the built xui app into
# a scratch copy of this tree. `version` is replaced by the workspace version
# and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "Paint"
system_name = "os.lazy.paint"
author = "LazyOS"
version = "0.1.0"
description = "Draw and edit PNG pictures"
category = "graphics"

[entry]
binary = "bin/paint.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[[mime]]
type = "image/png"
verbs = ["open", "edit"]

[permissions]
# Derived from a run of the app under its label (`LAZYOS_LABEL_TRACE=1`).
interfaces = ["os.lazy.display.v1", "os.lazy.input.v1"]
