# webd: a core LazyOS app, packaged by `tools/xui/core_packages.py` (docs/webd.md, docs/webd-plan.md).
#
# The daemon that owns WebKit for a login session and serves it to other apps: an app that only needs
# WebKit's HTML/CSS/layout/font engine (a mail reader, a document viewer) asks webd for a LIGHT view,
# hands it the page's HTML and gets the pixels back in shared memory. One static program (`webd-app`,
# about 75 MB: ICU's data is inside, and LazyOS loads a program whole into RAM) that starts
# `/system/bin/webprocess` and `/system/bin/networkprocess`, which a `LAZYOS_WEBD=1` image ships beside
# it. The build copies the built program (`target/xui/xui-webd.elf`, from `python tools/webkit/webd.py`)
# into a scratch copy of this tree; `version` is replaced by the workspace version and `autostart` is
# set from `LAZYOS_XUI_AUTOSTART` (an image with `LAZYOS_WEBD=1` opens it with every session in any
# case). Only a desktop image ships it (`LAZYOS_WEBD=1`, `python tools/run_demo.py --webd`).
#
# It is resident (docs/tray-plan.md section 5): it has no window, runs once per session, has a tray
# icon the shell draws for it, and ends when `init` says Quit. The program links WebKit (LGPL-2.1) and
# OpenSSL (Apache-2.0, through WebKit's curl), so it is GPL-3.0-or-later (docs/webd-plan.md section 10).

[app]
name = "Web Engine"
system_name = "os.lazy.webd"
author = "LazyOS"
version = "0.1.0"
description = "Draws web pages for other apps with WebKit, the engine of Safari. An app gives it a page of HTML, or (if you let that app reach the internet) an address, and gets the pixels back. Its page processes are sandboxed: they read only fonts and have no network. Its network process may reach the network, keep the browsing cookies in its own folder (.apps/os.lazy.webd) and save downloads to your Downloads folder; it hands addresses another app opens (mailto:) to the app you chose, and shows a site's notifications under its own name"
category = "system"

[entry]
binary = "bin/webd.elf"
# The argument every desktop app gets (unused by a windowless daemon).
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = true
# Keeps running with no window and always has a tray icon (docs/tray-plan.md section 5). It implies the
# tray (`os.lazy.shell.tray.v1`), the lifecycle line (`os.lazy.init.app.v1`) and the tray generation topic.
resident = true

[permissions]
# Derived from runs under `LAZYOS_LABEL_TRACE=1` (docs/webd.md, "Permissions"). The light and the full
# interface: the service sends each view's events on its client's channel with the interface the view
# was made through, and the kernel judges a oneway send by its header like a call; the light self-test
# also calls the light interface. The services are registered under the app's own namespace
# (`app.os.lazy.webd.light`, `app.os.lazy.webd.view`), which needs no permission. A full view's page may
# hand an address to the app the person chose (`os.lazy.mimed.v1`, Handoff.Browser) and show its
# notifications as webd's toasts (`os.lazy.notify.v1`; the clicks come back on the channel it moved in).
interfaces = [
    "os.lazy.webd.light.v1",
    "os.lazy.webd.view.v1",
    "os.lazy.mimed.v1",
    "os.lazy.notify.v1",
]
# The network process's (a child label holds at most what the app holds).
network = ["outbound"]
# The engine keeps its network-lock rule store and the profiles under the app's own folder; a finished
# download is renamed in the person's Downloads folder; the page process reads the fonts; the network
# process reads the resolver's files and the certificate bundle. The union of the processes below.
files = [
    "write:$HOME/.apps/os.lazy.webd",
    "write:$HOME/Downloads",
    "read:/system/share/fonts",
    "read:/system/etc/fonts",
    "read:/tmp/fontconfig",
    "read:/etc/resolv.conf",
    "read:/etc/hosts",
    "read:/etc/ssl/certs/ca-certificates.crt",
]

# One process per client app (every view of one app shares it), running whatever the page says with the
# JIT on (scripts are off in a light view unless the app asks). It is the process a page's exploit lands
# in, so it holds nothing: its image and the IPC socket it inherits are all it starts with, and only the
# font files, the font configuration and the font cache directory may be read. No Messenger interface, no
# network, no `$HOME`, no program to start (docs/architecture/process-sandbox.md).
[processes.webprocess]
program = "/system/bin/webprocess"
interfaces = []
network = []
files = [
    "read:/system/share/fonts",
    "read:/system/etc/fonts",
    "read:/tmp/fontconfig",
]

# One network process for every profile (docs/webd-plan.md 3.3): it reaches the network for the full
# views whose scope allows it (a light view, and a full view without the network scope, carry a content
# rule list that blocks every load in the engine), keeps each profile's cookies, cache and storage below
# the profiles' folder, and writes downloads. It can read every profile's cookies: the cost of not paying
# 107 MiB per profile, stated in the plan. It writes only `profiles/` of the app's folder, not the folder:
# the network-lock rule store (`rules/`) is compiled and read by the UI process, and the light views'
# no-network guarantee rests on it, so a compromised network process must not be able to rewrite it
# (`tools/webd/test_manifest.py`).
[processes.networkprocess]
program = "/system/bin/networkprocess"
interfaces = []
network = ["outbound"]
files = [
    "read:/etc/resolv.conf",
    "read:/etc/hosts",
    "read:/etc/ssl/certs/ca-certificates.crt",
    "write:$HOME/.apps/os.lazy.webd/profiles",
    "write:$HOME/Downloads",
]
