# WebKit: a core LazyOS app, packaged by `tools/xui/core_packages.py` (docs/webkit-port-plan.md W5).
#
# WebKit2 itself, ported (LGPL-2.1; the build pins WebKitGTK 2.54.1): a UI process with this
# window, a WebProcess per page and a NetworkProcess, over the Unix IPC. It is one static
# program (`webkit-app`, about 108 MB: ICU's data is inside, and LazyOS loads a program whole
# into RAM) that starts `/system/bin/webprocess` and `/system/bin/networkprocess`, which a
# `LAZYOS_WEBKIT=1` image ships beside it. The build copies the built program
# (`target/xui/xui-webkit.elf`, from `python tools/webkit/app.py`) into a scratch copy of
# this tree; `version` is replaced by the workspace version and `autostart` is set from
# `LAZYOS_XUI_AUTOSTART`. Only a desktop image with the network stack ships it
# (`LAZYOS_WEBKIT=1`, `python tools/run_demo.py --webkit`). LazyWeb stays the shipped browser;
# this one claims no file or link type.

[app]
name = "WebKit"
system_name = "os.lazy.webkit"
author = "LazyOS"
version = "0.1.0"
description = "Browse the web with WebKit: HTML, CSS, JavaScript and images over HTTP and HTTPS. Not sandboxed: the page process has this app's display, input and network access as you; nothing is saved between runs"
category = "internet"

[entry]
binary = "bin/webkit.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[permissions]
# Derived from a run under `LAZYOS_LABEL_TRACE=1` (`python tools/webkit/app_run.py --label-trace`,
# docs/packages.md): the window, its keyboard and pointer, and the pointer shape (without
# `os.lazy.display.cursor.v1` the run prints `LABEL:DENY ... SetCursor`). Sockets are plain musl
# ones (the `outbound` network permission) and names resolve through `/etc/resolv.conf`, so
# `os.lazy.net.stack.v1` is not needed. WebProcess and NetworkProcess are children of the app and
# run under its label. WebKit's data directories default to the PlayStation's `/app0`, which LazyOS
# has not, so nothing is persisted yet and no file is asked
# for (a persistent profile would ask for `write:$HOME/.apps/os.lazy.webkit`).
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.display.cursor.v1",
    "os.lazy.input.v1",
]
network = ["outbound"]
