# About LazyOS: a core LazyOS app, packaged by `tools/xui/build.py`
# (scaffolded by `tools/xui/new_app.py`).
#
# `bin/about.elf` is not checked in: the build copies the built xui app
# into a scratch copy of this tree. `version` is replaced by the workspace
# version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "About LazyOS"
system_name = "os.lazy.about"
author = "LazyOS"
version = "0.1.0"
description = "About LazyOS, with a real-time 3D renderer"
category = "system"

[entry]
binary = "bin/about.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[permissions]
# The display, pointer shapes and input every window needs. The app draws
# on the CPU and talks to nothing else: a `LAZYOS_LABEL_TRACE=1` run of
# `tools/screenshot/examples/xui_about.json` prints no `LABEL:DENY`.
interfaces = ["os.lazy.display.v1", "os.lazy.display.cursor.v1", "os.lazy.input.v1"]
