# PDF Viewer: a core LazyOS app, packaged by `tools/xui/build.py`
# (docs/pdf-reader-plan.md).
#
# `bin/pdf.elf` is not checked in: the build copies the built xui app
# into a scratch copy of this tree. `version` is replaced by the workspace
# version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "PDF Viewer"
system_name = "os.lazy.pdf"
author = "LazyOS"
version = "0.1.0"
description = "Read PDF documents: scroll, zoom and page through them"
category = "office"

[entry]
binary = "bin/pdf.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

# `mimed` maps the `.pdf` extension (a manifest cannot name it).
[[mime]]
type = "application/pdf"
verbs = ["open", "view"]

[permissions]
# Derived from runs of the app under its label (`LAZYOS_LABEL_TRACE=1`, which
# prints every refused call); see docs/packages.md, core packages. The
# clipboard carries the `text/uri-list` of a file dropped on the window.
interfaces = [
    "os.lazy.clipboard.v1",
    "os.lazy.display.v1",
    "os.lazy.input.v1",
]
