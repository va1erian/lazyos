# Web View Test: a core LazyOS app, packaged by `tools/xui/build.py`
# (scaffolded by `tools/xui/new_app.py`). A test client of webd's full views, shipped only by
# `LAZYOS_WEBDDEMO=1` images (`build_support/webd_embed.rs`, CLIENT_PACKAGES).
#
# `bin/webdbrowse.elf` is not checked in: the build copies the built xui app
# into a scratch copy of this tree. `version` is replaced by the workspace
# version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "Web View Test"
system_name = "os.lazy.webdbrowse"
author = "LazyOS"
version = "0.1.0"
description = "Drives full web views of webd through the view, net and browser scopes and reports each step"
category = "system"

[entry]
binary = "bin/webdbrowse.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[permissions]
# The display, pointer shapes and input every window needs, and webd's full views: the interface
# every call goes through (`os.lazy.webd.view.v1`) and the two scopes its views are made through
# (`os.lazy.webd.net.v1`: http and https; `os.lazy.webd.browser.v1`: the browser profile,
# downloads, content blocking). The scenario also makes a view through `view.v1` alone and expects
# the network refused (EACCES).
# To confirm with a traced run (`LAZYOS_LABEL_TRACE=1`, docs/packages.md): no `LABEL:DENY` for
# `app:os.lazy.webdbrowse`.
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.display.cursor.v1",
    "os.lazy.input.v1",
    "os.lazy.webd.view.v1",
    "os.lazy.webd.net.v1",
    "os.lazy.webd.browser.v1",
]
