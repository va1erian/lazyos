# Editor: a core LazyOS app, packaged by `tools/xui/build.py` (issue #509).
#
# `bin/editor.elf` is not checked in: the build copies the built xui app into
# a scratch copy of this tree. `version` is replaced by the workspace version
# and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "Editor"
system_name = "os.lazy.editor"
author = "LazyOS"
version = "0.1.0"
description = "A text editor"
category = "accessories"

[entry]
binary = "bin/editor.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[[mime]]
type = "text/plain"
verbs = ["open", "edit"]

[[mime]]
type = "text/markdown"
verbs = ["edit"]

[[mime]]
type = "text/x-rust"
verbs = ["open", "edit"]

[[mime]]
type = "text/x-shellscript"
verbs = ["open", "edit"]

[permissions]
# Derived from a run of the app under its label (`LAZYOS_LABEL_TRACE=1`).
interfaces = ["os.lazy.display.v1", "os.lazy.input.v1"]
