# Docs: a core LazyOS app, packaged by `tools/xui/build.py` (issue #509).
#
# `bin/docs.elf` is not checked in: the build copies the built xui app into
# a scratch copy of this tree. `version` is replaced by the workspace version
# and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "Docs"
system_name = "os.lazy.docs"
author = "LazyOS"
version = "0.1.0"
description = "Read the LazyOS documentation and Markdown files"
category = "office"

[entry]
binary = "bin/docs.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[[mime]]
type = "text/markdown"
verbs = ["open", "view"]

[permissions]
# Derived from a run of the app under its label (`LAZYOS_LABEL_TRACE=1`). The pages are drawn by a
# light view of `webd` (`os.lazy.webd.light.v1`: no network, no scripts, no files); a link in a
# document to a web address or another kind of file goes to `mimed`.
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.display.cursor.v1",
    "os.lazy.input.v1",
    "os.lazy.webd.light.v1",
    "os.lazy.mimed.v1",
]
