# Settings: a core LazyOS app, packaged by `tools/xui/build.py` (issue #509).
#
# `bin/settings.elf` is not checked in: the build copies the built xui app into
# a scratch copy of this tree. `version` is replaced by the workspace version
# and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "Settings"
system_name = "os.lazy.settings"
author = "LazyOS"
version = "0.1.0"
description = "Appearance, windows, keyboard, menu, hidden apps, time and accounts"
category = "system"

[entry]
binary = "bin/settings.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[permissions]
# Derived from runs of the app under its label (`LAZYOS_LABEL_TRACE=1`, which
# prints every refused call); see docs/packages.md, core packages.
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.input.v1",
    "os.lazy.confd.v1",
    "os.lazy.init.v1",
    "os.lazy.timed.v1",
    # The Accounts page (docs/accounts-plan.md U1) and the changes an
    # administrator approves through elevd (U2).
    "os.lazy.accounts.v1",
    "os.lazy.elevd.v1",
]
