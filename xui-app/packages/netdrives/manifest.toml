# Network Drives: a core LazyOS app, packaged by `tools/xui/build.py`.
#
# `bin/netdrives.elf` is not checked in: the build copies the built xui app
# into a scratch copy of this tree. `version` is replaced by the workspace
# version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`. A desktop image
# ships it only with the network stack (`LAZYOS_NETD=1`,
# `python tools/run_demo.py --net`), which also starts `mountd`.

[app]
name = "Network Drives"
system_name = "os.lazy.netdrives"
author = "LazyOS"
version = "0.1.0"
description = "Mount FTP servers as folders under /mnt"
category = "internet"

[entry]
binary = "bin/netdrives.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[permissions]
# Derived from a run of the app under its label (`LAZYOS_LABEL_TRACE=1`,
# `tools/fuse/ui_run.py`): the window, `mountd` (the app never touches the
# network or registers a filesystem itself) and `init.Launch` to open a
# mounted folder in Files.
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.input.v1",
    "os.lazy.mount.v1",
    "os.lazy.init.v1",
]
