# Web View Demo: a core LazyOS app, packaged by `tools/xui/build.py`
# (scaffolded by `tools/xui/new_app.py`).
#
# `bin/webddemo.elf` is not checked in: the build copies the built xui app
# into a scratch copy of this tree. `version` is replaced by the workspace
# version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "Web View Demo"
system_name = "os.lazy.webddemo"
author = "LazyOS"
version = "0.1.0"
description = "Shows one light web view from webd: a page with a link, a form and a picture that must not load"
category = "system"

[entry]
binary = "bin/webddemo.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[permissions]
# The display, pointer shapes and input every window needs, and the light web view service
# (`os.lazy.webd.light.v1`, LOW: "show formatted text and pictures that you give it"). Never the
# network: a light view has none, and the demo proves it (its page's picture must not load).
# Listed from reading the code; the integration step derives the final set from a run under
# `LAZYOS_LABEL_TRACE=1` (`python tools/webd/run.py --label-trace`, docs/packages.md), which must
# show no `LABEL:DENY` for `app:os.lazy.webddemo`.
interfaces = [
    "os.lazy.display.v1",
    "os.lazy.display.cursor.v1",
    "os.lazy.input.v1",
    "os.lazy.webd.light.v1",
]
