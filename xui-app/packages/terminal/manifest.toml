# Terminal: a core LazyOS developer tool that is the user's shell, packaged by
# `tools/xui/build.py` (docs/devtool-packages-plan.md, "T-later: Terminal").
#
# `bin/terminal.elf` is not checked in: the build copies the built xui app
# (`xui-term.elf`) into a scratch copy of this tree. `version` is replaced by
# the workspace version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.
# Every desktop image ships it (`build_support/devtools_embed.rs`, `always`).

[app]
name = "Terminal"
system_name = "os.lazy.terminal"
author = "LazyOS"
version = "0.1.0"
description = "A terminal window running your shell"
category = "system"
# A developer tool (docs/devtool-packages-plan.md): it runs under the label
# `tool:os.lazy.terminal`, which allows every call but a short, reviewed deny
# list, because the calls it makes are the ones the user types. Its shell and
# every command typed in it keep that label.
kind = "developer-tool"
# The user's shell: `pkgd` and `init` judge what runs under the label as the
# session's owner (`pkgctl`, `powerctl`), which a plain tool never is. `pkgd`
# honours it for a package the image ships and nothing else.
shell = true

[entry]
binary = "bin/terminal.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

# No [[mime]]: the built-in row this package replaced listed the verb `open`
# but registered no type with `mimed`, and nothing reads that list.

[permissions]
# No `interfaces` and no `topics`: a developer tool is default-allow (the
# manifest validator refuses a list). The shell runs `curl`, `wget`, `ping`,
# `nc` and `smb`, which use the socket service, so it declares the network.
network = ["outbound"]
