# Mail: esMail (va1erian/esmail) as a core LazyOS app, packaged by
# `tools/xui/build.py --mail` (docs/mail.md).
#
# `bin/mail.elf` is not checked in: the build copies the built xui app into a
# scratch copy of this tree. `version` is replaced by the workspace version and
# `autostart` is set from `LAZYOS_XUI_AUTOSTART`. A desktop image ships it with
# `LAZYOS_MAIL=1` (`python tools/run_demo.py --mail`).

[app]
name = "Mail"
system_name = "os.lazy.mail"
author = "LazyOS"
version = "0.1.0"
description = "Read and send email over IMAP and SMTP, with TLS"
category = "internet"

[entry]
binary = "bin/mail.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[permissions]
# The window, and outbound sockets to the IMAP and SMTP servers (plain
# `std::net` under tokio, so the `outbound` network permission).
interfaces = ["os.lazy.display.v1", "os.lazy.input.v1"]
network = ["outbound"]
