# Messenger Playground: a core LazyOS developer tool, packaged by
# `tools/xui/build.py` (docs/messenger-playground-plan.md).
#
# `bin/playground.elf` is not checked in: the build copies the built xui app
# into a scratch copy of this tree. `version` is replaced by the workspace
# version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`. Only a
# `LAZYOS_DEVTOOLS=1` image ships it (`build_support/devtools_embed.rs`).

[app]
name = "Messenger Playground"
system_name = "os.lazy.playground"
author = "LazyOS"
version = "0.1.0"
description = "Browse Messenger APIs and topics, and script them in Rhai"
category = "development"
# A developer tool (docs/devtool-packages-plan.md): it runs under the label
# `tool:os.lazy.playground`, which allows every call but a short, reviewed deny
# list, because the calls it makes are the ones the user's scripts name.
kind = "developer-tool"

[entry]
binary = "bin/playground.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[permissions]
# No `interfaces` and no `topics`: a developer tool is default-allow, and a list
# would only look like a limit (the manifest validator refuses one). The deny
# list (`devtool::DENY`) refuses the tool's Messenger calls (and its scripts')
# to the key, secret, account and label-policy services, and to the socket
# service unless this is `["outbound"]`. It confines Messenger only: the
# tool's own native code runs with the user's permissions, like the Terminal.
network = []
