# Video Player: a core LazyOS app, packaged by `tools/xui/build.py`
# (scaffolded by `tools/xui/new_app.py`).
#
# `bin/video.elf` is not checked in: the build copies the built xui app
# into a scratch copy of this tree. `version` is replaced by the workspace
# version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "Video Player"
system_name = "os.lazy.video"
author = "LazyOS"
version = "0.1.0"
description = "Play video files: open, pause, seek and watch them in a window"
category = "graphics"

[entry]
binary = "bin/video.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

# `mimed` maps the `.avi` extension (a manifest cannot name it).
[[mime]]
type = "video/x-msvideo"
verbs = ["open", "view"]

[permissions]
# The display, the pointer shapes and input every window needs, and the
# clipboard, which carries the `text/uri-list` of a file dropped on the
# window. Derive anything more from a run under `LAZYOS_LABEL_TRACE=1`
# (AGENTS.md; docs/packages.md, core packages).
interfaces = [
    "os.lazy.clipboard.v1",
    "os.lazy.display.v1",
    "os.lazy.display.cursor.v1",
    "os.lazy.input.v1",
]
