# Files: a core LazyOS app, packaged by `tools/xui/build.py` (issue #509).
#
# `bin/files.elf` is not checked in: the build copies the built xui app into
# a scratch copy of this tree. `version` is replaced by the workspace version
# and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "Files"
system_name = "os.lazy.files"
author = "LazyOS"
version = "0.1.0"
description = "Browse and open your files"
category = "utilities"

[entry]
binary = "bin/files.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false

[[mime]]
type = "text/plain"
verbs = ["reveal"]

[[mime]]
type = "image/png"
verbs = ["reveal"]

[[mime]]
type = "application/octet-stream"
verbs = ["reveal"]

[permissions]
# Derived from runs of the app under its label (`LAZYOS_LABEL_TRACE=1`, which
# prints every refused call); see docs/packages.md, core packages. The
# clipboard carries drag-and-drop payloads (docs/archiver-plan.md).
interfaces = [
    "os.lazy.clipboard.v1",
    "os.lazy.display.v1",
    "os.lazy.input.v1",
    "os.lazy.mimed.v1",
]
# The current selection, on the session topic `idl/files.midl` declares
# (issue #488). The kernel lets an app reach only its own session there.
topics = ["publish:session/+/selection"]
