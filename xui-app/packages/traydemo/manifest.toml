# Tray Demo: a core LazyOS app, packaged by `tools/xui/build.py`
# (scaffolded by `tools/xui/new_app.py`).
#
# `bin/traydemo.elf` is not checked in: the build copies the built xui app
# into a scratch copy of this tree. `version` is replaced by the workspace
# version and `autostart` is set from `LAZYOS_XUI_AUTOSTART`.

[app]
name = "Tray Demo"
system_name = "os.lazy.traydemo"
author = "LazyOS"
version = "0.1.0"
description = "Shows a taskbar tray icon and reacts to it"
category = "development"

[entry]
binary = "bin/traydemo.elf"
# A desktop app is a client of the `xuid` compositor, not the display owner.
args = ["--client"]
# A static musl program: `init` starts it under the Linux ABI personality.
abi = "linux"
autostart = false
# Keeps running with no window and always has a tray icon (docs/tray-plan.md
# section 5). It implies the tray (`os.lazy.shell.tray.v1`), the lifecycle
# line (`os.lazy.init.app.v1`) and the tray generation topic.
resident = true

[permissions]
# Derived from runs under `LAZYOS_LABEL_TRACE=1` (tools/screenshot/examples/
# tray.json, tray_menu.json and tray_resident.json show no `LABEL:DENY`): a
# window and keyboard input; the rest is implied by `resident`.
interfaces = ["os.lazy.display.v1", "os.lazy.input.v1"]
