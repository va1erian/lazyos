[package]
name = "xui-app"
version = "0.1.0"
edition = "2021"
publish = false
description = "An ordinary xui application running on LazyOS (issue #114)"

# A standalone workspace: this crate builds for x86_64-unknown-linux-musl and
# is embedded in the disk image, so the LazyOS workspace stays unaffected.
[workspace]
resolver = "2"
members = [
    "crates/code-editor",
    "crates/paint",
    "crates/explorer",
    "crates/icons",
]
exclude = ["vendor/xui-canvas"]

[dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "5efb730" }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "5efb730" }
# The same parcel codec the kernel and native `user` programs use, so the
# fabric panel reads registry replies and talks to the topics broker with one
# shared wire implementation. `no_std` + `alloc`, so it links into this binary.
libmessenger = { path = "../libs/messenger" }
# The generated `os.lazy.messenger.{registry,topics}.v1` stubs (midlc, from
# `idl/*.midl`): the fabric panel encodes and decodes those interfaces with the
# same code the kernel and native clients use, never hand-copied field ids.
messenger-generated = { path = "../libs/generated" }
# The Terminal (issue #254) sends a process-group SIGINT on Ctrl-C. `libc` is
# already in the dependency graph; a direct edge lets `term.rs` name `kill`.
libc = "0.2"
# The three portable apps, copied from `va1erian/xui` at rev `5efb730` into
# `crates/`. Each is a workspace member so its own test suite runs on the host;
# the `xui-editor`/`xui-paint`/`xui-files` binaries in `src/bin` supply the
# LazyOS platform (filesystem, launcher, storage, clipboard) and drive them.
xui-code-editor = { path = "crates/code-editor" }
xui-paint = { path = "crates/paint" }
xui-explorer = { path = "crates/explorer" }

# Upstream `xui-canvas` builds its shaper's font database from the directories
# `fontdb` scans and memory-maps the files it finds; LazyOS's Linux ABI has
# anonymous `mmap` only. The vendored copy adds `set_default_font` /
# `add_font` / `set_default_family`, applies `TextStyle`'s horizontal alignment
# for natural-width (non-wrapped) runs, and exposes `Surface::pixels` for a
# clone-free present; otherwise it is the pinned revision (see its README).
[patch."https://github.com/va1erian/xui"]
xui-canvas = { path = "vendor/xui-canvas" }

[[bin]]
name = "xui-m0"
path = "src/bin/m0.rs"

[[bin]]
name = "xui-counter"
path = "src/bin/counter.rs"

[[bin]]
name = "xui-client"
path = "src/bin/client.rs"

[[bin]]
name = "xui-sysmon"
path = "src/bin/sysmon.rs"

[[bin]]
name = "xui-fabricmon"
path = "src/bin/fabricmon.rs"

[[bin]]
name = "xui-term"
path = "src/bin/term.rs"

# The three migrated apps; every desktop image ships them (see build.rs
# `DESKTOP_XUI_APPS`). `editor` is the upstream notepad example promoted.
[[bin]]
name = "xui-editor"
path = "src/bin/editor.rs"

[[bin]]
name = "xui-paint"
path = "src/bin/paint.rs"

[[bin]]
name = "xui-files"
path = "src/bin/files.rs"

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
strip = "symbols"
