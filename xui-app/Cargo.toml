[package]
name = "xui-app"
version = "0.1.0"
edition = "2021"
publish = false
description = "An ordinary xui application running on LazyOS (issue #114)"

# A standalone workspace: this crate builds for x86_64-unknown-linux-musl and
# is embedded in the disk image, so the LazyOS workspace stays unaffected.
[workspace]
resolver = "2"
members = [
    "docs",
    "mail",
    # LazyWeb, the web browser (NetSurf, GPL-2.0-only); built with zig like Docs.
    "web",
    "crates/code-editor",
    "crates/paint",
    "crates/explorer",
    "crates/settings",
    "crates/confd-editor",
    "crates/testkit",
    # LazyWriter's portable core (issue #533); `src/bin/writer.rs` hosts it.
    "crates/writer",
    # The print spooler (docs/printing-plan.md P6); `src/bin/printd.rs` serves it.
    "crates/printd",
    "crates/shell",
    # The Archiver (docs/archiver-plan.md): its format library and app core.
    "crates/archive",
    "crates/archiver",
    # The PDF Viewer (docs/pdf-reader-plan.md): its rendering library.
    "crates/pdf",
    "crates/pdfview",
    # The Calculator's engine and window (host-tested); `src/bin/calc.rs` runs it.
    "crates/calc",
    # Host tool: renders the packages' app icons (`cargo run -p app-icons`).
    "crates/app-icons",
    # `lazyicons`: the OS-wide stable icon names (docs/tray-plan.md 6.3, docs/icons.md).
    "crates/named-icons",
]

[dependencies]
# Both xui crates must resolve to the same revision so a single `xui_core`
# links. `xui-canvas`'s default `winit-backend` feature pulls winit/softbuffer/
# glutin/glow/arboard/windows/xui-gpu; turning it off leaves the pure tiny-skia
# software painter core (Surface, SkiaCanvas, OffscreenBackend and the in-memory
# font API) that LazyOS drives its own display protocol with.
xui-core = { git = "https://github.com/va1erian/xui", rev = "112b411c0e0889e1757da9e09481c8e9c5acca98" }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "112b411c0e0889e1757da9e09481c8e9c5acca98", default-features = false }
# The rich-text widget LazyWriter edits with (issue #533), with its native JSON
# format (`serde`). Same revision as `xui-core`, so one `xui_core` links.
xui-rich-text = { git = "https://github.com/va1erian/xui", rev = "112b411c0e0889e1757da9e09481c8e9c5acca98", features = ["serde"] }
# The same parcel codec the kernel and native `user` programs use, so the
# fabric panel reads registry replies and talks to the topics broker with one
# shared wire implementation. `no_std` + `alloc`, so it links into this binary.
libmessenger = { path = "../libs/messenger" }
# The generated `os.lazy.messenger.{registry,topics}.v1` stubs (midlc, from
# `idl/*.midl`): the fabric panel encodes and decodes those interfaces with the
# same code the kernel and native clients use, never hand-copied field ids.
messenger-generated = { path = "../libs/generated" }
# The audio API (`os.lazy.audio.v1` calls and `PlaybackStream`); the
# platform layer supplies its musl transport (`platform::audio`).
audioclient = { path = "../libs/audioclient" }
# The key-state page layout an input session polls (`inputmap::keystate`,
# docs/input-plan.md I3): the same seqlock reader `inputd` writes for.
inputmap = { path = "../libs/inputmap" }
# The Terminal (issue #254) sends a process-group SIGINT on Ctrl-C. `libc` is
# already in the dependency graph; a direct edge lets `term.rs` name `kill`.
libc = "0.2"
# Well-known paths and boot-volume names (docs/filesystem-plan.md F0).
fhs = { path = "../libs/fhs" }
# Row layouts and names of the device inspection ops (the Devices app, #481).
devinspect = { path = "../libs/devinspect" }
# The client half of the pipelined `Present` (issue #372): the same pure slot
# state machine `xdemo` and the kernel display suite drive.
surfbuf = { path = "../libs/surfbuf" }
# The three portable apps, copied from `va1erian/xui` (unchanged by the canvas
# bump) into `crates/`. Each is a workspace member so its own test suite runs on
# the host; the `xui-editor`/`xui-paint`/`xui-files` binaries in `src/bin`
# supply the LazyOS platform (filesystem, launcher, storage, clipboard) and
# drive them.
xui-code-editor = { path = "crates/code-editor" }
xui-paint = { path = "crates/paint" }
# LazyWriter's app core (state, commands, file logic, widget tree); the
# `writer` binary supplies the LazyOS platform through `xui_writer::Host`.
xui-writer = { path = "crates/writer" }
# The print spooler (docs/printing-plan.md P6): the `xui-printd` binary serves
# it as `os.lazy.print.v1`; the platform layer's client prints through it.
printd = { path = "crates/printd" }
# The LazyOS Files app ships the multi-colour Global Village tiles: the
# `village-icons` feature pulls in `xui-icons` and makes `village::paint` draw
# the coloured set instead of the Lucide fallback.
xui-explorer = { path = "crates/explorer", features = ["village-icons"] }
# The Archiver (docs/archiver-plan.md): its app core and format library.
xui-archiver = { path = "crates/archiver" }
# The PDF Viewer (docs/pdf-reader-plan.md): its window over `lazypdf`.
xui-pdfview = { path = "crates/pdfview" }
# The Settings app core (sections, config seam, UI); the binary supplies confd.
xui-settings = { path = "crates/settings" }
# The desktop theme schema (`GetTheme`'s `mode` names), shared with `xuid`.
uitheme = { path = "../libs/uitheme" }
# The Config app core (registry tree editor); the binary supplies confd.
xui-confd-editor = { path = "crates/confd-editor" }
# The Calculator's engine and window; the `xui-calc` binary only launches it.
xui-calc = { path = "crates/calc" }
# LazyShell (issue #157): the pure taskbar/menu/desktop/clock models; the
# `xui-shell` binary paints them and talks to xuid, init, confd and timed.
lazyshell = { path = "crates/shell" }
# Named Lucide outlines (docs/icons.md): the tray draws `lucide` icons by name.
lazyicons = { path = "crates/named-icons" }
# One app's tray item over os.lazy.shell.tray.v1 (`xui_app::tray`).
trayclient = { path = "../libs/trayclient" }
# The shell themes its surfaces from the same `sys/ui/*` palette as xuid
# (through the `uitheme` dependency above).
confd = { path = "../libs/confd" }
deskmenu = { path = "../libs/deskmenu" }
# The network apps validate a static setup with the very parser `netd` applies
# it with (`netstack::config`), so the form refuses exactly what the stack
# would silently replace with DHCP.
netstack = { path = "../libs/netstack" }
# The desktop's launcher icons (the Global Village set the Files app ships).
xui-icons = { git = "https://github.com/va1erian/xui", rev = "112b411c0e0889e1757da9e09481c8e9c5acca98" }

[[bin]]
name = "xui-m0"
path = "src/bin/m0.rs"

[[bin]]
name = "xui-counter"
path = "src/bin/counter.rs"

[[bin]]
name = "xui-client"
path = "src/bin/client.rs"

[[bin]]
name = "xui-sysmon"
path = "src/bin/sysmon.rs"

[[bin]]
name = "xui-devices"
path = "src/bin/devices.rs"

[[bin]]
name = "xui-widget"
path = "src/bin/widget.rs"

[[bin]]
name = "xui-fabricmon"
path = "src/bin/fabricmon.rs"

[[bin]]
name = "xui-term"
path = "src/bin/term.rs"

# The three migrated apps; every desktop image ships them (see build.rs
# `DESKTOP_XUI_APPS`). `editor` is the upstream notepad example promoted.
[[bin]]
name = "xui-editor"
path = "src/bin/editor.rs"

# LazyWriter, the word processor (issue #533). The bin is `writer` so the
# package's binary is `bin/writer.elf`; `tools/xui/build.py` copies it to
# `target/xui/xui-writer.elf`.
[[bin]]
name = "writer"
path = "src/bin/writer.rs"

[[bin]]
name = "xui-paint"
path = "src/bin/paint.rs"

[[bin]]
name = "xui-files"
path = "src/bin/files.rs"

# The Archiver, a 7-Zip-style archive manager (docs/archiver-plan.md).
[[bin]]
name = "xui-archiver"
path = "src/bin/archiver.rs"

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
strip = "symbols"

# Size first, except the software rasteriser: every frame is painted by
# tiny-skia through xui-canvas, and at "z" a full HiDPI repaint costs 3-4x
# more (issue #604). Only performance-critical crates get 3; keep it that way.
[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

[profile.release.package.xui-canvas]
opt-level = 3

[[bin]]
name = "xui-settings"
path = "src/bin/settings.rs"

[[bin]]
name = "xui-confd"
path = "src/bin/confd_editor.rs"

[[bin]]
name = "xui-installer"
path = "src/bin/installer.rs"

# The network apps (docs/networking-host-access.md): Network shows the
# interface and edits `netd`'s configuration; Net Tools pings, looks names up,
# fetches a web page and serves one the host can open.
[[bin]]
name = "xui-network"
path = "src/bin/network.rs"

[[bin]]
name = "xui-nettools"
path = "src/bin/nettools.rs"

# LazyShell (issue #157): desktop, taskbar, start menu and `os.lazy.shell`.
[[bin]]
name = "xui-shell"
path = "src/bin/lazyshell.rs"

# The graphical login screen (issue #623): `logind`'s `Login` client, run as
# the `_greeter` system uid.
[[bin]]
name = "xui-greeter"
path = "src/bin/greeter.rs"

[[bin]]
name = "xui-calc"
path = "src/bin/calc.rs"

# The print spooler service, `/system/bin/printd` (no window).
[[bin]]
name = "xui-printd"
path = "src/bin/printd.rs"

[[bin]]
name = "xui-pdf"
path = "src/bin/pdf.rs"

[[bin]]
name = "xui-traydemo"
path = "src/bin/traydemo.rs"
