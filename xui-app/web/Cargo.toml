# LazyWeb, the web browser: pages laid out by the Blitz engine (`xui-blitz`,
# pure Rust), fetched over HTTP and HTTPS by `src/fetch/` (ureq + rustls with
# the in-tree `nettls-crypto` provider).
#
# A package of its own, like `xui-app/docs`, because Blitz (Stylo, Taffy,
# vello_cpu) is a large dependency tree the other apps do not need.
# `tools/xui/build.py` builds it with the plain `rust-lld` path, no zig.
#
# Blitz is MIT/Apache-2.0 (Stylo MPL-2.0), so LazyWeb no longer has to be
# GPL-2.0-only; the licence below is unchanged until that is decided (issue
# #649). Every crate linked into it must have a GPLv2-compatible licence
# choice: no ring, no aws-lc (`python tools/nettls/licenses.py` checks this
# package's tree).
[package]
name = "lazyweb"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only"
description = "LazyWeb: a basic web browser for LazyOS on the Blitz engine"

[lib]
name = "lazyweb"
path = "src/lib.rs"

[[bin]]
name = "lazyweb"
path = "src/main.rs"

[dependencies]
xui-app = { path = ".." }
# The CA bundle path.
fhs = { path = "../../libs/fhs", features = ["alloc"] }
# One xui revision for every crate, so a single `xui_core` links.
xui-core = { git = "https://github.com/va1erian/xui", rev = "bcdde8c859c017067505de082582c8fc02b3932b" }
# `system-fonts` off: it loads fontconfig with `dlopen`, which a static binary
# cannot do. Fonts are registered by `webfonts`.
webfonts = { path = "../crates/webfonts" }
xui-blitz = { git = "https://github.com/va1erian/xui", rev = "bcdde8c859c017067505de082582c8fc02b3932b", default-features = false }
# TLS 1.2/1.3 with default features off: they pull aws-lc-rs, and neither it
# nor ring has a GPLv2-compatible licence. The crypto is `nettls-crypto` (MIT,
# pure-Rust RustCrypto crates). Pinned with `nettls` so the two agree.
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12"] }
nettls-crypto = { path = "../../nettls/crypto" }
# The public suffix list (embedded, MIT/Apache-2.0): a cookie may not name one
# as its Domain (`fetch/cookies.rs`).
psl = "2"
# PEM parsing for the CA bundle.
rustls-pki-types = { version = "1.15", features = ["std"] }
# Blocking HTTP/1.1 without its own TLS, roots or gzip: `fetch::tls` is the
# only TLS path and bodies are decoded in `fetch::decode` under the size cap.
ureq = { version = "=3.4.2", default-features = false }
# gzip and deflate with the pure-Rust miniz_oxide backend.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# A throwaway CA and server certificate for the HTTPS tests.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
# The TLS test server signs with the provider's P-256 key support.
nettls-crypto = { path = "../../nettls/crypto", features = ["server"] }
