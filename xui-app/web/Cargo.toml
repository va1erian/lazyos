# LazyWeb, the web browser: pages laid out by the NetSurf browser core
# (`xui-netsurf`), fetched over HTTP and HTTPS by `src/fetch/` (ureq + rustls
# with the in-tree `nettls-crypto` provider).
#
# A package of its own, like `xui-app/docs`: NetSurf is C, and Cargo builds
# every dependency of a package for every target in it, so keeping it here
# lets the other apps build with the plain Rust toolchain.
# `tools/xui/build.py` builds this package with the zig toolchain.
#
# NetSurf is GPL-2.0-only, so this binary is too. Every crate linked into it
# must have a GPLv2-compatible licence choice: no ring, no aws-lc
# (`python tools/nettls/licenses.py` checks this package's tree).
[package]
name = "lazyweb"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only"
description = "LazyWeb: a basic web browser for LazyOS on the NetSurf browser core"

[lib]
name = "lazyweb"
path = "src/lib.rs"

[[bin]]
name = "lazyweb"
path = "src/main.rs"

[build-dependencies]
# netsurf-sys compiles ~250 C files through cc-rs; without this feature it
# does so one at a time (see `build.rs`).
cc = { version = "1", features = ["parallel"] }

[dependencies]
xui-app = { path = ".." }
# The CA bundle path.
fhs = { path = "../../libs/fhs", features = ["alloc"] }
# One xui revision for every crate, so a single `xui_core` links.
xui-core = { git = "https://github.com/va1erian/xui", rev = "baffd078bac9d0b8ba367780f5489ec66553a592" }
xui-netsurf = { git = "https://github.com/va1erian/xui", rev = "baffd078bac9d0b8ba367780f5489ec66553a592" }
# TLS 1.2/1.3 with default features off: they pull aws-lc-rs, and neither it
# nor ring has a GPLv2-compatible licence. The crypto is `nettls-crypto` (MIT,
# pure-Rust RustCrypto crates). Pinned with `nettls` so the two agree.
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12"] }
nettls-crypto = { path = "../../nettls/crypto" }
# PEM parsing for the CA bundle.
rustls-pki-types = { version = "1.15", features = ["std"] }
# Blocking HTTP/1.1 without its own TLS, roots or gzip: `fetch::tls` is the
# only TLS path and bodies are decoded in `fetch::decode` under the size cap.
ureq = { version = "=3.4.2", default-features = false }
# gzip and deflate with the pure-Rust miniz_oxide backend.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# A throwaway CA and server certificate for the HTTPS tests.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
# The TLS test server signs with the provider's P-256 key support.
nettls-crypto = { path = "../../nettls/crypto", features = ["server"] }
