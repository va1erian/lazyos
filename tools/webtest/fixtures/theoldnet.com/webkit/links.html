<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit links</title>
<style>
  body { margin: 0; font: 22px sans-serif; background: #e8f0ff; }
  /* One big box the harness clicks at a known place: 300 x 100 at the page's top-left. */
  #go { position: absolute; left: 0; top: 0; width: 300px; height: 100px; background: #c33; color: #fff;
        font: bold 26px sans-serif; text-decoration: none; line-height: 100px; text-align: center; }
  p { position: absolute; left: 20px; top: 130px; width: 500px; }
</style>
</head>
<body>
<a id="go" href="form.html">Go to the form</a>
<p>Click the red box: it is a link to the form page.</p>
</body>
</html>
