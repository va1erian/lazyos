[package]
name = "abi-fixtures"
version = "0.1.0"
edition = "2021"
publish = false
description = "LazyOS Linux-ABI conformance fixtures (built static for x86_64-unknown-linux-musl)"

# Standalone workspace: these are Linux binaries, never part of the OS build.
[workspace]

[[bin]]
name = "hello"
path = "src/hello.rs"

[[bin]]
name = "alloc"
path = "src/alloc.rs"

[[bin]]
name = "hashmap"
path = "src/hashmap.rs"

[[bin]]
name = "file"
path = "src/file.rs"

[[bin]]
name = "time"
path = "src/time.rs"

[[bin]]
name = "thread"
path = "src/thread.rs"

[[bin]]
name = "syncstress"
path = "src/syncstress.rs"

[[bin]]
name = "fsstress"
path = "src/fsstress.rs"

[[bin]]
name = "memstress"
path = "src/memstress.rs"

# JIT-style executable memory: W^X flips, access errors, fork, threads (issue #773).
[[bin]]
name = "jitmem"
path = "src/jitmem.rs"

# File-backed mmap: private and shared mappings, write-back, fork (issue #535).
[[bin]]
name = "filemap"
path = "src/filemap.rs"

[[bin]]
name = "procstress"
path = "src/procstress.rs"

# The ceilings one browser-class program hits: threads, memory, descriptors,
# alone and in four forked children (issue #774, docs/architecture/limits.md).
[[bin]]
name = "bigapp"
path = "src/bigapp.rs"

[[bin]]
name = "sigstress"
path = "src/sigstress.rs"

# x87/SSE state across asynchronous signals and sibling-thread delivery
# (issue #809).
[[bin]]
name = "fpsig"
path = "src/fpsig.rs"

# AVX state: OSXSAVE/XCR0, per-thread YMM halves under preemption and signals,
# the signal frame's XSAVE area, fork and execve (issue #822).
[[bin]]
name = "avx"
path = "src/avx.rs"

# Per-thread signal masks and thread-directed signals: the JavaScriptCore
# stop-the-world pattern (issue #772).
[[bin]]
name = "threadsig"
path = "src/threadsig.rs"

# alarm, setitimer/getitimer and POSIX timers (issue #535, gap 3).
[[bin]]
name = "alarm"
path = "src/alarm.rs"

[[bin]]
name = "epollstress"
path = "src/epollstress.rs"

# A Messenger endpoint beside a socket in one epoll set (issue #667).
[[bin]]
name = "msgpoll"
path = "src/msgpoll.rs"

[[bin]]
name = "unixstress"
path = "src/unixstress.rs"

# SCM_RIGHTS, memfd_create and MAP_SHARED between processes (issue #771).
[[bin]]
name = "seqpollout"
path = "src/seqpollout.rs"

[[bin]]
name = "scmrights"
path = "src/scmrights.rs"

[[bin]]
name = "persist"
path = "src/persist.rs"

[[bin]]
name = "statxio"
path = "src/statxio.rs"

[[bin]]
name = "cwd"
path = "src/cwd.rs"

[[bin]]
name = "fdinherit"
path = "src/fdinherit.rs"

[[bin]]
name = "fsops"
path = "src/fsops.rs"

[[bin]]
name = "statmiss"
path = "src/statmiss.rs"

[[bin]]
name = "compat"
path = "src/compat.rs"

# Runs the real programs of `tools/linuxapps/build.py` (an image built with
# `LAZYOS_LINUXAPPS=1`): one row per program in the bench.
[[bin]]
name = "linuxapps"
path = "src/linuxapps.rs"

# Runs `jsc` and `cxxproof` of `tools/jsc/build.py` (an image built with
# `LAZYOS_JSC=1`): run by `python tools/jsc/run.py`, not by the ABI bench.
[[bin]]
name = "jsc"
path = "src/jsc.rs"

# Needs a network (the echo servers of `tools/net/run.py`): run by `netd demo=1`
# as `linux:/system/bin/netfix`, never by the ABI bench (`tools/abi/run.py`).
[[bin]]
name = "netfix"
path = "src/netfix.rs"

# Bulk TCP throughput against `tools/net/bulk.py`'s host server
# (docs/performance-plan.md P4); embedded as `/system/bin/netbulk-linux`.
[[bin]]
name = "netbulk"
path = "src/netbulk.rs"

# Storage throughput and exec latency (docs/performance-plan.md P5): run by
# `tools/perf/disk.py` as `abi-init`, never by the ABI bench.
[[bin]]
name = "diskbench"
path = "src/diskbench.rs"

# The stand-in WebProcess and NetworkProcess of the browser's sandbox attack harness
# (`python tools/webkit/attack_run.py`, issue #832): tries what an exploited engine
# process would try, from inside its label. Never run by the ABI bench.
[[bin]]
name = "sandboxprobe"
path = "src/sandboxprobe.rs"

[dependencies]
# The native Messenger calls and the endpoint descriptor (`msgpoll`, issue
# #667); `no_std` + `alloc` underneath, so the other fixtures are unaffected.
lazyos-sys = { path = "../../../libs/lazyos-sys", features = ["parcel", "std"] }
# The parcel type and header flags `msgpoll` sends with.
libmessenger = { path = "../../../libs/messenger" }
# `sandboxprobe`'s driver loads the policy of two labels (`LoadLabel`) and compiles file rules.
messenger-generated = { path = "../../../libs/generated" }
filepolicy = { path = "../../../libs/filepolicy" }
