[package]
name = "abi-fixtures"
version = "0.1.0"
edition = "2021"
publish = false
description = "LazyOS Linux-ABI conformance fixtures (built static for x86_64-unknown-linux-musl)"

# Standalone workspace: these are Linux binaries, never part of the OS build.
[workspace]

[[bin]]
name = "hello"
path = "src/hello.rs"

[[bin]]
name = "alloc"
path = "src/alloc.rs"

[[bin]]
name = "hashmap"
path = "src/hashmap.rs"

[[bin]]
name = "file"
path = "src/file.rs"

[[bin]]
name = "time"
path = "src/time.rs"

[[bin]]
name = "thread"
path = "src/thread.rs"

[[bin]]
name = "syncstress"
path = "src/syncstress.rs"

[[bin]]
name = "fsstress"
path = "src/fsstress.rs"

[[bin]]
name = "memstress"
path = "src/memstress.rs"

[[bin]]
name = "procstress"
path = "src/procstress.rs"

[[bin]]
name = "sigstress"
path = "src/sigstress.rs"

[[bin]]
name = "epollstress"
path = "src/epollstress.rs"

[[bin]]
name = "unixstress"
path = "src/unixstress.rs"

[[bin]]
name = "persist"
path = "src/persist.rs"

[[bin]]
name = "statxio"
path = "src/statxio.rs"

[[bin]]
name = "cwd"
path = "src/cwd.rs"

[[bin]]
name = "fdinherit"
path = "src/fdinherit.rs"

[[bin]]
name = "fsops"
path = "src/fsops.rs"

[[bin]]
name = "statmiss"
path = "src/statmiss.rs"

[[bin]]
name = "compat"
path = "src/compat.rs"

# Runs the real programs of `tools/linuxapps/build.py` (an image built with
# `LAZYOS_LINUXAPPS=1`): one row per program in the bench.
[[bin]]
name = "linuxapps"
path = "src/linuxapps.rs"

# Needs a network (the echo servers of `tools/net/run.py`): run by `netd demo=1`
# as `linux:/system/bin/netfix`, never by the ABI bench (`tools/abi/run.py`).
[[bin]]
name = "netfix"
path = "src/netfix.rs"

# Bulk TCP throughput against `tools/net/bulk.py`'s host server
# (docs/performance-plan.md P4); embedded as `/system/bin/netbulk-linux`.
[[bin]]
name = "netbulk"
path = "src/netbulk.rs"

# Storage throughput and exec latency (docs/performance-plan.md P5): run by
# `tools/perf/disk.py` as `abi-init`, never by the ABI bench.
[[bin]]
name = "diskbench"
path = "src/diskbench.rs"
