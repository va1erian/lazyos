[package]
name = "fakebt"
version = "0.1.0"
edition = "2021"
publish = false
description = "A fake USB Bluetooth dongle served to QEMU over usbredir, answering through libs/btsim (docs/bluetooth-plan.md, phases B2 and B3)"
license = "GPL-3.0-or-later"

# A host tool: std and the Bluetooth libraries (`btsim` is the controller it
# serves, with its HID peers), so it builds with the plain
# `cargo build -p fakebt` on Windows, Linux and WSL.
[[bin]]
name = "fakebt"
path = "src/main.rs"

[dependencies]
bthci = { path = "../../../libs/bthci" }
btsim = { path = "../../../libs/btsim" }
