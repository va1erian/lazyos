<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WebPlus links</title>
<style>
  body { margin: 0; font: 22px sans-serif; background: #eef4ff; }
  /* Four big boxes the harness clicks at known places: 360 x 70, a row every 90 px from the
     page's top-left. */
  .box { position: absolute; left: 0; width: 360px; height: 70px; color: #fff; text-decoration: none;
         font: bold 24px sans-serif; line-height: 70px; text-align: center; border: 0; cursor: pointer; }
  #mail { top: 0; background: #c33; }
  #blank { top: 90px; background: #36c; }
  #open { top: 180px; background: #293; }
  #download { top: 270px; background: #c72; }
  p { position: absolute; left: 400px; top: 20px; width: 500px; }
</style>
</head>
<body>
<a id="mail" class="box" href="mailto:lazy@theoldnet.com?subject=hello">Mail us</a>
<a id="blank" class="box" href="blank-target.html" target="_blank">New window link</a>
<button id="open" class="box" onclick="window.open('opened.html')">window.open</button>
<a id="download" class="box" href="/files/oldnet-kit.zip">Download the kit</a>
<p>Red: a mailto: link, for another app. Blue: target=_blank. Green: window.open from a click.
Orange: an attachment.</p>
</body>
</html>
